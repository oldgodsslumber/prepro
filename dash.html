    noTasks.textContent = 'Nothing scheduled';
    section.appendChild(noTasks);
    return section;
  }

  // Group by project
  const byProject = new Map();
  tasks.forEach(t => {
    if (!byProject.has(t.projectId)) byProject.set(t.projectId, { name: t.projectName, tasks: [] });
    byProject.get(t.projectId).tasks.push(t);
  });

  byProject.forEach(({ name, tasks: projTasks }, projectId) => {
    const card = document.createElement('div');
    card.className = 'today-card';

    // Collect unique roles for this project
    const roles = [...new Set(projTasks.flatMap(t => t.matchRoles))];

    const header = document.createElement('div');
    header.className = 'today-card-header';
    header.innerHTML = `<a class="today-card-project" href="team.html#project=${encodeURIComponent(projectId)}" target="_blank">${esc(name)}</a>` +
      roles.map(r => `<span class="role-tag" style="background:${getRoleColor(r)}">${esc(r)}</span>`).join('');
    header.appendChild(buildStatusSeg(projectId));
    card.appendChild(header);

    projTasks.forEach(task => {
      const block = document.createElement('div');
      block.className = 'today-task-block';

      const row = document.createElement('div');
      const done = isTaskDone(task.id);
      row.className = 'today-task-row' + (done ? ' completed' : '');

      // Checkbox
      const check = document.createElement('button');
      check.className = 'task-check' + (done ? ' checked' : '');
      check.textContent = done ? '\u2713' : '';
      check.title = done ? 'Mark incomplete' : 'Mark complete';
      check.addEventListener('click', () => toggleTaskDone(task.id));
      row.appendChild(check);

      // Task content
      let html = '';
      const taskLabel = taskDisplayName(task);
      html += `<span class="task-name">${esc(taskLabel)}</span>`;

      const multiDay = getMultiDayInfo(task, selectedDate);
      if (multiDay) {
        html += `<span class="task-days">Day ${multiDay.currentDay} of ${multiDay.totalDays}</span>`;
      }

      if (task.isReview) {
        const label = task.reviewLabel || 'Review';
        html += `<span class="task-badge" title="${esc(label)}">${esc(typeAbbr(label))}</span>`;
      }
      if (task.isDueDate) {
        const mt = task.milestoneType || 'due-date';
        const mLabel = milestoneLabel(mt);
        html += `<span class="task-badge" style="${BADGE_STYLE[mt] || BADGE_STYLE['due-date']}" title="${esc(mLabel)}">${esc(typeAbbr(mLabel))}</span>`;
      }

      const contentSpan = document.createElement('span');
      contentSpan.style.cssText = 'display:contents';
      contentSpan.innerHTML = html;
      row.appendChild(contentSpan);

      // LOE — clickable to cycle
      if (!task.isDueDate) {
        const loeBtn = document.createElement('span');
        loeBtn.className = 'task-loe';
        loeBtn.textContent = LOE_EMOJI[task.loe || 'low'] || LOE_EMOJI.low;
        loeBtn.title = 'Click to change effort level';
        loeBtn.addEventListener('click', () => cycleLoe(task.projectId, task.id));
        row.appendChild(loeBtn);
      }

      // Note button
      const noteBtn = document.createElement('button');
      noteBtn.className = 'task-note-btn';
      noteBtn.textContent = '\u{1F4DD}';
      noteBtn.title = 'Add a note to this project';
      noteBtn.addEventListener('click', () => showNoteModal(task.projectId, task.projectName));
      row.appendChild(noteBtn);

      block.appendChild(row);

      // Sequence-aware suggestion — one per task, question-framed
      const suggestion = getTaskSuggestion(task, selectedPerson, selectedDate);
      if (suggestion) {
        const sugRow = document.createElement('div');
        sugRow.className = 'task-suggestion';
        sugRow.innerHTML = `<span class="ts-icon">💡</span>${esc(suggestion)}`;
        block.appendChild(sugRow);
      }

      // Subtasks area
      const subArea = document.createElement('div');
      subArea.className = 'subtask-area';
      const subs = getSubtasks(task.id);

      subs.forEach(sub => {
        const subRow = document.createElement('div');
        subRow.className = 'subtask-row';
        const subCheck = document.createElement('button');
        subCheck.className = 'subtask-check' + (sub.done ? ' checked' : '');
        subCheck.textContent = sub.done ? '\u2713' : '';
        subCheck.addEventListener('click', () => toggleSubtask(task.id, sub.id));
        subRow.appendChild(subCheck);
        const subText = document.createElement('span');
        subText.className = 'subtask-text' + (sub.done ? ' done' : '');
        subText.textContent = sub.text;
        subText.style.cursor = 'text';
        subText.title = 'Click to edit';
        subText.addEventListener('click', () => {
          const editInput = document.createElement('input');
          editInput.className = 'subtask-input';
          editInput.value = sub.text;
          editInput.style.flex = '1';
          let committed = false;
          const commitEdit = () => {
            if (committed) return;
            committed = true;
            if (editInput.value.trim()) editSubtask(task.id, sub.id, editInput.value);
            else renderAll();
          };
          editInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') commitEdit();
            if (e.key === 'Escape') { committed = true; renderAll(); }
          });
          editInput.addEventListener('blur', commitEdit);
          subText.replaceWith(editInput);
          editInput.focus();
          editInput.select();
        });
        subRow.appendChild(subText);
        const subDel = document.createElement('button');
        subDel.className = 'subtask-del';
        subDel.textContent = '\u00d7';
        subDel.title = 'Remove';
        subDel.addEventListener('click', () => removeSubtask(task.id, sub.id));
        subRow.appendChild(subDel);
        subArea.appendChild(subRow);
      });

      // Add subtask button / input
      const addBtn = document.createElement('button');
      addBtn.className = 'subtask-add-btn';
      addBtn.textContent = '+ Add subtask';
      addBtn.addEventListener('click', () => {
        addBtn.style.display = 'none';
        const inputRow = document.createElement('div');
        inputRow.className = 'subtask-input-row';
        const input = document.createElement('input');
        input.className = 'subtask-input';
        input.placeholder = 'Subtask...';
        let committed = false;
        const commit = () => {
          if (committed) return;
          committed = true;
          if (input.value.trim()) addSubtask(task.id, input.value);
          else { inputRow.remove(); addBtn.style.display = ''; }
        };
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            if (input.value.trim() && !committed) {
              committed = true;
              pendingAddSubtaskFor = task.id;
              addSubtask(task.id, input.value);
            } else {
              commit();
            }
          }
          if (e.key === 'Escape') { committed = true; inputRow.remove(); addBtn.style.display = ''; }
        });
        input.addEventListener('blur', commit);
        inputRow.appendChild(input);
        subArea.appendChild(inputRow);
        input.focus();
      });
      subArea.appendChild(addBtn);

      if (pendingAddSubtaskFor === task.id) {
        // Defer until layout settles. Don't clear the flag yet — if another
        // render replaces this DOM before the timeout fires, addBtn becomes
        // detached. The flag stays set so the next render can also schedule,
        // and whichever timeout finds a still-connected addBtn wins.
        setTimeout(() => {
          if (pendingAddSubtaskFor !== task.id) return;
          if (!addBtn.isConnected) return;
          pendingAddSubtaskFor = null;
          addBtn.click();
        }, 0);
      }

      block.appendChild(subArea);
      card.appendChild(block);
    });

    section.appendChild(card);
  });

  return section;
}

// ── HEADS UP — upcoming reviews, shoots, and teammate PTO ──
function getHeadsUpItems(personName, afterDate) {
  const items = [];
  const bizDays = getNextBusinessDays(afterDate, 5);
  const cutoff = bizDays[bizDays.length - 1]; // next 5 business days
  const peopleMap = getAllPeople();
  const personInfo = peopleMap.get(personName);
  if (!personInfo) return items;
  const myProjectIds = new Set(personInfo.projects.keys());

  (state.projects || []).filter(isActiveProject).forEach(proj => {
    (proj.tasks || []).forEach(task => {
      const start = task.date;
      const end = task.endDate || task.date;
      if (!start || end <= afterDate || start > cutoff) return;

      // Reviews & shoots this person is part of
      if (task.isReview) {
        let involved = false;
        if (task.attendees) {
          task.attendees.forEach(a => { if (a.person === personName) involved = true; });
        }
        if (involved) {
          const isShoot = (task.reviewLabel || '').toLowerCase().includes('shoot');
          items.push({
            type: isShoot ? 'shoot' : 'review',
            icon: isShoot ? '\u{1F3AC}' : '\u{1F4CB}',
            title: task.taskName || task.reviewLabel || 'Review',
            project: proj.name,
            projectId: proj.id,
            date: start,
            endDate: end !== start ? end : null,
            taskId: task.id
          });
        }
      }

      // Milestones with action keywords on my projects
      if (task.isDueDate && !isTimeOffTask(task) && myProjectIds.has(proj.id)) {
        const tn = (task.taskName || '').toLowerCase();
        const actionKeywords = [
          'kick-off','kick off','kickoff',
          'delivery','deliverable','deliver','handoff','hand-off','hand off',
          'launch','go live','go-live','golive',
          'final','finalize','lock',
          'approval','sign-off','sign off','signoff',
          'presentation','present','pitch',
          'onboard','on-board','onboarding',
          'start','begins','begin','deadline'
        ];
        if (actionKeywords.some(kw => tn.includes(kw))) {
          items.push({
            type: 'milestone',
            icon: '\u{1F3AF}',
            title: task.taskName || 'Milestone',
            project: proj.name,
            projectId: proj.id,
            date: start,
            endDate: end !== start ? end : null,
            taskId: task.id
          });
        }
      }

      // Teammate PTO on projects I'm involved in
      if (isTimeOffTask(task) && myProjectIds.has(proj.id)) {
        (task.attendees || []).forEach(a => {
          if (!a.person || a.person === personName) return;
          items.push({
            type: 'pto',
            icon: '\u{1F3D6}',
            title: a.person + ' — PTO',
            project: proj.name,
            projectId: proj.id,
            date: start,
            endDate: end !== start ? end : null,
            teammateName: a.person,
            teammateRole: a.role || null
          });
        });
        // Also check taskName for person references (PTO without attendees)
        if (!(task.attendees || []).length && task.taskName) {
          items.push({
            type: 'pto',
            icon: '\u{1F3D6}',
            title: task.taskName,
            project: proj.name,
            projectId: proj.id,
            date: start,
            endDate: end !== start ? end : null,
            teammateName: null,
            teammateRole: null
          });
        }
      }
    });
  });

  // Also find teammate PTO from OTHER projects where a teammate overlaps
  (state.projects || []).filter(p => isActiveProject(p) && !myProjectIds.has(p.id)).forEach(proj => {
    (proj.tasks || []).forEach(task => {
      if (!isTimeOffTask(task)) return;
      const start = task.date;
      const end = task.endDate || task.date;
      if (!start || end <= afterDate || start > cutoff) return;

      // Check if any attendee is a teammate on one of my projects
      (task.attendees || []).forEach(a => {
        if (!a.person || a.person === personName) return;
        // Is this person on any of my projects?
        const theirInfo = peopleMap.get(a.person);
        if (!theirInfo) return;
        let sharedProject = null;
        for (const [pid] of theirInfo.projects) {
          if (myProjectIds.has(pid)) { sharedProject = theirInfo.projects.get(pid).name; break; }
        }
        if (sharedProject) {
          // Find their role on the shared project
          let sharedRole = null;
          for (const [pid] of theirInfo.projects) {
            if (myProjectIds.has(pid)) {
              const roles = theirInfo.projects.get(pid).roles;
              if (roles && roles.size) sharedRole = [...roles][0];
              break;
            }
          }
          items.push({
            type: 'pto',
            icon: '\u{1F3D6}',
            title: a.person + ' — PTO',
            project: sharedProject,
            projectId: [...myProjectIds].find(pid => theirInfo.projects.has(pid)) || null,
            date: start,
            endDate: end !== start ? end : null,
            teammateName: a.person,
            teammateRole: sharedRole
          });
        }
      });
    });
  });

  // Deduplicate by type+title+date
  const seen = new Set();
  const deduped = items.filter(item => {
    const key = item.type + '|' + item.title + '|' + item.date;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  // Consolidate PTO into two summary cards — "Currently Out" (already started)
  // and "Upcoming PTO" (not started yet) — so individual PTO chips don't clutter
  // the Heads Up list.
  const startedPto  = deduped.filter(i => i.type === 'pto' && i.date <= afterDate);
  const upcomingPto = deduped.filter(i => i.type === 'pto' && i.date >  afterDate);
  const other       = deduped.filter(i => i.type !== 'pto');

  if (startedPto.length) {
    // Collapse to unique teammates with their latest end (= when they're back).
    const byPerson = new Map();
    startedPto.forEach(i => {
      const name = i.teammateName || i.title.replace(/ — PTO$/, '');
      if (!byPerson.has(name)) byPerson.set(name, { name, endDate: i.endDate || i.date });
      else {
        const existing = byPerson.get(name);
        const end = i.endDate || i.date;
        if (end > existing.endDate) existing.endDate = end;
      }
    });
    const people = [...byPerson.values()];
    other.push({
      type: 'pto', icon: '\u{1F3D6}',
      title: 'Currently Out (' + people.length + ')',
      project: '', date: afterDate, endDate: null,
      consolidated: true, outPeople: people
    });
  }

  if (upcomingPto.length) {
    // One line per upcoming PTO window (cross-project dupes already removed),
    // sorted by when each person goes out.
    const people = upcomingPto.map(i => ({
      name: i.teammateName || i.title.replace(/ — PTO$/, ''),
      startDate: i.date,
      endDate: i.endDate || i.date
    })).sort((a, b) => a.startDate.localeCompare(b.startDate));
    other.push({
      type: 'pto', icon: '\u{1F3D6}',
      title: 'Upcoming PTO (' + people.length + ')',
      project: '', date: afterDate, endDate: null,
      consolidated: true, upcoming: true, outPeople: people
    });
  }

  return other.sort((a, b) => a.date.localeCompare(b.date));
}

// Returns { text, tasks[] } — tasks is the expandable list (may be empty)
function getHeadsUpPrompt(item, personName, afterDate) {
  const bizDays = getNextBusinessDays(afterDate, 5);
  const windowEnd = bizDays[bizDays.length - 1];
  const status = item.projectId ? getStatus(personName, item.projectId) : 'on-schedule';
  const isBehind = status === 'behind';
  const isAhead = status === 'ahead';

  if (item.type === 'pto' && item.teammateName && item.projectId) {
    const proj = (state.projects || []).find(p => p.id === item.projectId);
    if (!proj) return null;
    const name = item.teammateName;
    const role = item.teammateRole || '';
    const roleLower = role.toLowerCase();

    // Find tasks assigned to this teammate in the 5-day window
    const theirTasks = (proj.tasks || []).filter(t => {
      if (t.isDueDate) return false;
      if (t.person !== name) return false;
      const end = t.endDate || t.date;
      return t.date <= windowEnd && end >= afterDate;
    });

    // Calculate their workload weight
    let totalPts = 0;
    theirTasks.forEach(t => { totalPts += loePts(t.loe); });
    const heavy = totalPts >= 4;

    // Check if they're an attendee on any reviews in the window
    const theirReviews = (proj.tasks || []).filter(t => {
      if (!t.isReview) return false;
      const end = t.endDate || t.date;
      if (t.date > windowEnd || end < afterDate) return false;
      return (t.attendees || []).some(a => a.person === name);
    });

    // Status modifier
    const behindNote = isBehind ? ' This project is marked behind.' : '';
    const aheadNote = isAhead ? ` You\u2019re ahead on this project \u2014 good time to get ahead of it.` : '';
    const statusNote = behindNote || aheadNote;

    if (roleLower === 'stakeholder' || roleLower === 'designer' || roleLower === 'copywriter') {
      if (theirReviews.length) return { text: `Do you need sign-off from ${name} before they leave?${statusNote}`, tasks: theirTasks };
      if (theirTasks.length) return { text: `Does ${name} need to deliver anything before PTO?${statusNote}`, tasks: theirTasks };
      return { text: `Need anything from ${name} before they\u2019re out?${statusNote}`, tasks: [] };
    }
    if (roleLower === 'editor' || roleLower === 'animator') {
      if (heavy) return { text: `${name} has a heavy workload (${totalPts} pts) before PTO \u2014 is their work on track?${statusNote}`, tasks: theirTasks };
      if (theirTasks.length) return { text: `Is ${name}\u2019s work on track to finish before PTO?${statusNote}`, tasks: theirTasks };
      return { text: `Has ${name} handed off their work?${statusNote}`, tasks: [] };
    }
    if (roleLower === 'producer') {
      return { text: `Who\u2019s covering for ${name} while they\u2019re out?${statusNote}`, tasks: theirTasks };
    }
    // Generic
    if (heavy) return { text: `${name} has a heavy workload (${totalPts} pts) before PTO \u2014 have they handed off?${statusNote}`, tasks: theirTasks };
    if (theirTasks.length) return { text: `Has ${name} handed off their ${theirTasks.length} task${theirTasks.length > 1 ? 's' : ''}?${statusNote}`, tasks: theirTasks };
    return { text: `Need anything from ${name} before they\u2019re out?${statusNote}`, tasks: [] };
  }

  if (item.type === 'review' || item.type === 'shoot' || item.type === 'milestone') {
    const proj = (state.projects || []).find(p => p.id === item.projectId);
    if (!proj) return null;
    const eventName = (item.title || '').toLowerCase();

    // Find tasks on this project in the window that come before the event
    const leadingTasks = (proj.tasks || []).filter(t => {
      if (t.isDueDate || t.isReview) return false;
      const end = t.endDate || t.date;
      return end >= afterDate && t.date < item.date;
    });

    // Status modifier
    const behindNote = isBehind ? ' You\u2019ve marked this project behind \u2014 flag early if anything\u2019s at risk.' : '';
    const aheadNote = isAhead ? ' You\u2019re ahead on this one.' : '';
    const statusNote = behindNote || aheadNote;

    // Try keyword matching
    const stopWords = new Set(['the','and','for','with','this','that','from','into','kick','off','final','date','due']);
    const eventWords = eventName.split(/[\s·\-—:,]+/).filter(w => w.length > 2 && !stopWords.has(w)).map(w => w.toLowerCase());
    const matched = leadingTasks.filter(t => {
      const tn = (t.taskName || '').toLowerCase();
      return eventWords.some(w => tn.includes(w));
    });

    if (matched.length) {
      if (matched.length === 1) {
        const taskName = taskDisplayName(matched[0]);
        return { text: `Will \u201c${taskName}\u201d be ready for this?${statusNote}`, tasks: leadingTasks };
      }
      return { text: `${matched.length} related tasks need to land before this \u2014 on track?${statusNote}`, tasks: leadingTasks };
    }
    if (leadingTasks.length) {
      return { text: `${leadingTasks.length} task${leadingTasks.length > 1 ? 's' : ''} due before this \u2014 everything on track?${statusNote}`, tasks: leadingTasks };
    }
    if (item.type === 'shoot') return { text: `Is everything prepped for the shoot?${statusNote}`, tasks: [] };
    if (item.type === 'milestone') return { text: `Is everything ready for this?${statusNote}`, tasks: [] };
    return { text: `Is everything ready for review?${statusNote}`, tasks: [] };
  }

  return null;
}

function renderHeadsUpSection() {
  const items = getHeadsUpItems(selectedPerson, selectedDate);
  if (!items.length) return null;

  const section = document.createElement('div');
  section.className = 'dash-section';

  const title = document.createElement('div');
  title.className = 'dash-section-title';
  title.textContent = 'Heads Up';
  section.appendChild(title);

  const list = document.createElement('div');
  list.className = 'headsup-list';

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'headsup-item ' + item.type;

    const icon = document.createElement('span');
    icon.className = 'headsup-icon';
    icon.textContent = item.icon;
    row.appendChild(icon);

    const body = document.createElement('div');
    body.className = 'headsup-body';

    // Consolidated PTO cards ("Currently Out" / "Upcoming PTO") — people list, no prompt
    if (item.consolidated && item.outPeople) {
      const titleDiv = document.createElement('div');
      titleDiv.className = 'headsup-title';
      titleDiv.textContent = item.title;
      body.appendChild(titleDiv);

      const peopleList = document.createElement('div');
      peopleList.className = 'headsup-meta';
      peopleList.style.marginTop = '4px';
      peopleList.style.lineHeight = '1.6';
      peopleList.innerHTML = item.outPeople.map(p => {
        let when;
        if (item.upcoming) {
          const start = fmtDateShort(p.startDate);
          when = 'out ' + ((p.endDate && p.endDate !== p.startDate) ? start + ' \u2013 ' + fmtDateShort(p.endDate) : start);
        } else {
          when = 'back ' + fmtDateShort(addDays(p.endDate, 1));
        }
        return `<div>\u{1F3D6} <strong style="color:var(--text)">${esc(p.name)}</strong> \u00b7 ${esc(when)}</div>`;
      }).join('');
      body.appendChild(peopleList);

      row.appendChild(body);
      list.appendChild(row);
      return; // skip the rest of this iteration
    }

    let dateText = fmtDateShort(item.date);
    if (item.endDate) dateText += ' \u2013 ' + fmtDateShort(item.endDate);

    // Title — clickable to open project in team.html
    const titleDiv = document.createElement('div');
    titleDiv.className = 'headsup-title';
    if (item.projectId) {
      const link = document.createElement('a');
      link.href = 'team.html#project=' + encodeURIComponent(item.projectId);
      link.target = '_blank';
      link.textContent = item.title;
      titleDiv.appendChild(link);
    } else {
      titleDiv.textContent = item.title;
    }
    body.appendChild(titleDiv);

    const dateDiv = document.createElement('div');
    dateDiv.className = 'headsup-date';
    dateDiv.textContent = dateText;
    body.appendChild(dateDiv);

    const metaDiv = document.createElement('div');
    metaDiv.className = 'headsup-meta';
    metaDiv.textContent = item.project;
    body.appendChild(metaDiv);

    // Prompt — clickable to expand task list
    const promptData = getHeadsUpPrompt(item, selectedPerson, selectedDate);
    if (promptData) {
      const promptDiv = document.createElement('div');
      promptDiv.className = 'headsup-prompt' + (promptData.tasks.length ? ' headsup-prompt-clickable' : '');
      promptDiv.textContent = promptData.text;

      if (promptData.tasks.length) {
        let expanded = false;
        const tasksDiv = document.createElement('div');
        tasksDiv.className = 'headsup-tasks';
        tasksDiv.style.display = 'none';

        promptData.tasks.forEach(t => {
          const ti = document.createElement('div');
          ti.className = 'headsup-task-item';
          const loe = t.loe ? (LOE_EMOJI[t.loe] || '') + ' ' : '';
          ti.innerHTML = `<span style="flex:1">${loe}${esc(taskDisplayName(t))}</span><span class="headsup-task-person">${esc(t.person || '')}</span>`;
          tasksDiv.appendChild(ti);
        });

        promptDiv.addEventListener('click', () => {
          expanded = !expanded;
          tasksDiv.style.display = expanded ? '' : 'none';
        });

        body.appendChild(promptDiv);
        body.appendChild(tasksDiv);
      } else {
        body.appendChild(promptDiv);
      }
    }

    row.appendChild(body);
    list.appendChild(row);
  });

  section.appendChild(list);
  return section;
}

// ── COMING UP — GANTT CHART (5 business days for selected person) ──
function renderComingUpSection() {
  const section = document.createElement('div');
  section.className = 'dash-section';

  const title = document.createElement('div');
  title.className = 'dash-section-title';
  title.textContent = 'Next 5 Days';
  section.appendChild(title);

  const days = [];
  let cursor = selectedDate;
  while (days.length < 5) {
    if (!isWeekend(cursor)) days.push(cursor);
    cursor = addDays(cursor, 1);
  }
  const windowStart = days[0];
  const windowEnd = days[days.length - 1];
  const today = todayStr();

  // Collect tasks for this person that overlap the visible window
  const items = [];
  (state.projects || []).filter(isActiveProject).forEach(proj => {
    (proj.tasks || []).forEach(task => {
      const start = task.date;
      const end = task.endDate || task.date;
      if (!start) return;
      if (end < windowStart || start > windowEnd) return;

      let isMatch = false;
      let matchRole = null;
      if (task.person === selectedPerson) {
        isMatch = true;
        matchRole = task.role;
      }
      if (task.attendees) {
        task.attendees.forEach(a => {
          if (a.person === selectedPerson) {
            isMatch = true;
            if (!matchRole) matchRole = a.role;
          }
        });
      }
      if (isTimeOffTask(task) && personOnTimeOff(task, selectedPerson)) isMatch = true;
      if (!isMatch) return;

      // Find first/last visible day index the task overlaps
      let startIdx = -1, endIdx = -1;
      for (let i = 0; i < days.length; i++) {
        if (days[i] >= start && days[i] <= end) {
          if (startIdx < 0) startIdx = i;
          endIdx = i;
        }
      }
      if (startIdx < 0) return; // task fell entirely on weekends within window

      items.push({
        task, startIdx, endIdx,
        clippedLeft: start < windowStart,
        clippedRight: end > windowEnd,
        projectName: proj.name,
        projectId: proj.id,
        color: getRoleColor(matchRole || task.role)
      });
    });
  });

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'gantt-empty';
    empty.textContent = 'Nothing scheduled in the next 5 business days';
    section.appendChild(empty);
    return section;
  }

  // Sort: earliest start, then longest, then project name
  items.sort((a, b) =>
    a.startIdx - b.startIdx
    || (b.endIdx - b.startIdx) - (a.endIdx - a.startIdx)
    || a.projectName.localeCompare(b.projectName)
  );

  const chart = document.createElement('div');
  chart.className = 'gantt-chart';

  // Header row
  const headerRow = document.createElement('div');
  headerRow.className = 'gantt-row gantt-header-row';
  const headerLabel = document.createElement('div');
  headerLabel.className = 'gantt-label';
  headerRow.appendChild(headerLabel);
  const headerCells = document.createElement('div');
  headerCells.className = 'gantt-cells';
  days.forEach(dayStr => {
    const dh = document.createElement('div');
    dh.className = 'gantt-day-header' + (dayStr === today ? ' today' : '');
    const d = new Date(dayStr + 'T00:00:00');
    const dow = DOW_SHORT[d.getDay()];
    const dateStr = (d.getMonth() + 1) + '/' + d.getDate();
    dh.innerHTML = `<div>${dow}</div><div class="gantt-date">${dateStr}</div>`;
    headerCells.appendChild(dh);
  });
  headerRow.appendChild(headerCells);
  chart.appendChild(headerRow);

  // Task rows
  items.forEach(({ task, startIdx, endIdx, clippedLeft, clippedRight, projectName, color }) => {
    const row = document.createElement('div');
    row.className = 'gantt-row';

    const labelCell = document.createElement('div');
    labelCell.className = 'gantt-label';
    const taskName = taskDisplayName(task);
    labelCell.innerHTML = `<div class="gantt-task-name">${esc(taskName)}</div><div class="gantt-task-project">${esc(projectName)}</div>`;
    row.appendChild(labelCell);

    const cellsWrap = document.createElement('div');
    cellsWrap.className = 'gantt-cells';
    days.forEach(dayStr => {
      const cell = document.createElement('div');
      cell.className = 'gantt-cell' + (dayStr === today ? ' today' : '');
      cellsWrap.appendChild(cell);
    });

    const bar = document.createElement('div');
    let barClass = 'gantt-bar';
    if (task.isDueDate) {
      barClass += isTimeOffTask(task) ? ' pto' : ' milestone';
    } else if (task.isReview) {
      barClass += ' review';
    }
    if (clippedLeft) barClass += ' clipped-left';
    if (clippedRight) barClass += ' clipped-right';
    bar.className = barClass;

    const span = endIdx - startIdx + 1;
    bar.style.left = `calc(${(startIdx / days.length) * 100}% + 2px)`;
    bar.style.width = `calc(${(span / days.length) * 100}% - 4px)`;
    if (!task.isDueDate && !task.isReview) bar.style.background = color;

    const loe = (!task.isDueDate && task.loe) ? LOE_EMOJI[task.loe] || '' : '';
    const prefix = clippedLeft ? '← ' : '';
    const suffix = clippedRight ? ' →' : '';
    bar.innerHTML = (loe ? `<span>${loe}</span>` : '') + `<span class="gantt-bar-text">${prefix}${esc(taskName)}${suffix}</span>`;

    const fullStart = task.date;
    const fullEnd = task.endDate || task.date;
    const dateRange = fullStart === fullEnd ? fmtDateShort(fullStart) : `${fmtDateShort(fullStart)} – ${fmtDateShort(fullEnd)}`;
    bar.title = `${taskName} — ${projectName}\n${dateRange}`;

    cellsWrap.appendChild(bar);
    row.appendChild(cellsWrap);
    chart.appendChild(row);
  });

  section.appendChild(chart);
  return section;
}

function mkPanelSection(titleText) {
  const section = document.createElement('div');
  section.className = 'dash-section';
  const title = document.createElement('div');
  title.className = 'dash-section-title';
  title.textContent = titleText;
  section.appendChild(title);
  return section;
}

// Shared helper: is task t assigned to / attended by the selected person?
function taskIsForSelected(t) {
  if (t.person === selectedPerson) return true;
  if ((t.attendees || []).some(a => a.person === selectedPerson)) return true;
  if (isTimeOffTask(t) && personOnTimeOff(t, selectedPerson)) return true;
  return false;
}

// ── PANEL: MY PROJECTS ──
function renderMyProjectsPanel() {
  const section = mkPanelSection('My Projects');
  const peopleMap = getAllPeople();
  const info = peopleMap.get(selectedPerson);
  const today = todayStr();

  // Sort projects by soonest upcoming key date, then name. The PTO/admin
  // buckets drop out here rather than in getAllPeople, so being "on" the PTO
  // project still counts for rosters and workload — it just isn't a project
  // card you review.
  const rows = (info ? [...info.projects.values()] : []).map(pref => {
    const proj = (state.projects || []).find(p => p.id === pref.id);
    const tasks = (proj && proj.tasks) || [];
    const openCount = tasks.filter(t => taskIsForSelected(t) && !t.isDueDate && !t.isReview && !isTaskDone(t.id)).length;
    const next = tasks
      .filter(t => taskIsForSelected(t) && (t.date || '') >= today)
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''))[0] || null;
    return { proj, pref, openCount, next };
  }).filter(r => r.proj && !isNonWorkProject(r.proj));

  if (!rows.length) {
    const empty = document.createElement('div');
    empty.className = 'od-empty';
    empty.textContent = 'Not on any active projects.';
    section.appendChild(empty);
    return section;
  }

  const list = document.createElement('div');
  list.className = 'mp-list';

  rows.sort((a, b) => {
    const ad = a.next ? a.next.date : '9999';
    const bd = b.next ? b.next.date : '9999';
    return ad.localeCompare(bd) || a.proj.name.localeCompare(b.proj.name);
  });

  rows.forEach(({ proj, pref, openCount, next }) => {
    const card = document.createElement('div');
    card.className = 'mp-card';

    const head = document.createElement('div');
    head.className = 'mp-card-head';
    const nameLink = document.createElement('a');
    nameLink.className = 'mp-name';
    nameLink.href = 'team.html#project=' + encodeURIComponent(proj.id);
    nameLink.target = '_blank';
    nameLink.textContent = proj.name;
    head.appendChild(nameLink);

    [...pref.roles].sort().forEach(role => {
      const tag = document.createElement('span');
      tag.className = 'role-tag';
      tag.style.background = getRoleColor(role);
      tag.textContent = role;
      head.appendChild(tag);
    });

    head.appendChild(buildStatusSeg(proj.id));
    card.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'mp-meta';
    if (openCount) {
      const b = document.createElement('span');
      b.className = 'mp-open-badge';
      b.textContent = openCount + ' open';
      meta.appendChild(b);
    }
    const nextSpan = document.createElement('span');
    if (next) {
      nextSpan.className = 'mp-meta-next';
      nextSpan.textContent = 'Next: ' + (next.taskName || next.reviewLabel || 'Key date') + ' · ' + fmtDayShort(next.date, today);
    } else {
      nextSpan.textContent = 'No upcoming dates';
    }
    meta.appendChild(nextSpan);
    card.appendChild(meta);

    list.appendChild(card);
  });

  section.appendChild(list);
  return section;
}

/* ── PANEL: PROJECT GRID ──────────────────────────────────────────────────────
 * The same project set My Projects shows, laid out one row per project so it
 * can be scanned — and pasted — like a spreadsheet.
 *
 * Two columns are writable and they deliberately write to different stores:
 *
 *   Next Step  → dashData.nextSteps[person][projectId], a per-person overlay,
 *                the same shape and sync path as status. Two people on one
 *                project each own their own next step.
 *   Note       → addNoteToProject(), the project's real note log. Anything
 *                typed here is a first-class note, so it also surfaces in
 *                Recent Activity, Look Back and Today. There is no grid-only
 *                note field, on purpose — that would fork the history in two.
 *
 * Previous Note is that log's newest entry, so writing a note moves it one cell
 * to the left and empties the entry cell for the next thing you have to say.
 * ─────────────────────────────────────────────────────────────────────────── */
const PG_SORT_KEY = 'dash_grid_sort';
const PG_WIDTH_KEY = 'dash_grid_widths';
const PG_STATUS_ORDER = ['behind', 'on-schedule', 'ahead'];
const PG_MIN_COL = 60; // a column can be squeezed, never dragged out of existence

/* The columns, in order. `width` is the default in pixels — the starting point
 * a reset returns to, not what is rendered once someone has dragged. */
const PG_COLS = [
  { id: 'project', label: 'Project',       sortable: true,  width: 200 },
  { id: 'team',    label: 'Team',          sortable: true,  width: 250 },
  { id: 'status',  label: 'Status',        sortable: true,  width: 150 },
  { id: 'next',    label: 'Next Step',     sortable: true,  width: 240 },
  { id: 'prev',    label: 'Previous Note', sortable: true,  width: 240 },
  { id: 'note',    label: 'Note',          sortable: false, width: 200 }
];

function getGridSort() {
  // Validated against the live column list: a sort saved under a key that no
  // longer exists (the old 'roles' column, say) falls back rather than sorting
  // by nothing at all.
  const keys = PG_COLS.filter(c => c.sortable).map(c => c.id);
  try {
    const s = JSON.parse(localStorage.getItem(PG_SORT_KEY) || 'null');
    if (s && keys.includes(s.key)) return { key: s.key, dir: s.dir === 'desc' ? 'desc' : 'asc' };
  } catch (_) {}
  return { key: 'project', dir: 'asc' };
}

// ── COLUMN WIDTHS (per browser, like the sort — a viewing preference, not
// shared data, so it stays out of dashData) ──
function getGridWidths() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(PG_WIDTH_KEY) || 'null'); } catch (_) {}
  const out = {};
  PG_COLS.forEach(c => {
    const v = saved && Number(saved[c.id]);
    out[c.id] = (v && isFinite(v) && v >= PG_MIN_COL) ? Math.round(v) : c.width;
  });
  return out;
}
function setGridWidth(id, px) {
  const w = getGridWidths();
  w[id] = Math.max(PG_MIN_COL, Math.round(px));
  try { localStorage.setItem(PG_WIDTH_KEY, JSON.stringify(w)); } catch (_) {}
}
function resetGridWidths(id) {
  const w = getGridWidths();
  PG_COLS.forEach(c => { if (!id || c.id === id) w[c.id] = c.width; });
  try { localStorage.setItem(PG_WIDTH_KEY, JSON.stringify(w)); } catch (_) {}
  renderAll();
}
function setGridSort(key) {
  const cur = getGridSort();
  const dir = cur.key === key && cur.dir === 'asc' ? 'desc' : 'asc';
  try { localStorage.setItem(PG_SORT_KEY, JSON.stringify({ key, dir })); } catch (_) {}
  renderAll();
}

// ── NEXT STEP (per-person overlay) ──
function getNextStep(person, projectId) {
  return ((dashData.nextSteps || {})[person] || {})[projectId] || null;
}
function setNextStep(person, projectId, text) {
  if (!dashData.nextSteps) dashData.nextSteps = {};
  const body = (text || '').trim();
  const forPerson = dashData.nextSteps[person];
  if (!body) {
    // Delete rather than blank it. Assigning undefined anywhere in dashData
    // makes the Firebase set() throw and takes every later save down with it.
    if (forPerson) {
      delete forPerson[projectId];
      if (!Object.keys(forPerson).length) delete dashData.nextSteps[person];
    }
  } else {
    if (!forPerson) dashData.nextSteps[person] = {};
    dashData.nextSteps[person][projectId] = { text: body, updated: todayStr() };
  }
  saveDashData();
}

// Fallback shown in grey when nobody has written a next step: the soonest thing
// actually on the schedule for this person. Editing promotes it to a real one.
function pgDerivedNextStep(proj, today) {
  const next = (proj.tasks || [])
    .filter(t => taskIsForSelected(t) && (t.date || '') >= today)
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''))[0];
  if (!next) return '';
  return taskDisplayName(next) + ' · ' + fmtDayShort(next.date, today);
}

/* Everyone from the Video Team on this project, grouped by what they do on it.
 * Mirrors the credit logic in getAllPeople — roster first, then task owners and
 * attendees, because projects routinely book people without rostering them —
 * and then keeps only the three craft roles, so admin blocks, stakeholders and
 * vendors don't turn into team members. Departed people drop out via
 * personCapacityOn, the same test the sidebar uses. */
function pgProjectTeam(proj, today) {
  const byRole = new Map(); // role -> Set(name)
  const add = (name, role, trusted) => {
    // `trusted` is for attendees: their stored role is frequently a chip label
    // ('Studio Work', 'Meeting'), so isInternalRole would reject them even
    // though isInternalAttendee already vouched for them. creditRole resolves
    // the real one from their person record.
    if (!name || isAdminRole(role)) return;
    if (!trusted && !isInternalRole(role)) return;
    if (!hasDashboard(name) || !personCapacityOn(name, today)) return;
    const r = creditRole(name, role);
    if (!INTERNAL_ROLES.has(r)) return;
    if (!byRole.has(r)) byRole.set(r, new Set());
    byRole.get(r).add(name);
  };

  Object.entries(proj.roster || {}).forEach(([role, names]) => (names || []).forEach(n => add(n, role, false)));
  (proj.tasks || []).forEach(t => {
    if (t.person && !t.isDueDate) add(t.person, t.role, false);
    (t.attendees || []).forEach(a => { if (a && a.person && isInternalAttendee(a)) add(a.person, a.role, true); });
  });

  // Producer, Editor, Animator — ROLE_CATS order, which is how the rest of the
  // app lists them.
  return [...INTERNAL_ROLES]
    .filter(role => byRole.has(role))
    .map(role => ({ role, names: [...byRole.get(role)].sort() }));
}
function pgTeamSortKey(groups) {
  return [...INTERNAL_ROLES]
    .map(role => { const g = groups.find(x => x.role === role); return g ? g.names.join(',') : '\uffff'; })
    .join('|');
}
function pgTeamText(groups) {
  return groups.map(g => g.role + ': ' + g.names.join(', ')).join('; ');
}

function pgLatestNote(proj) {
  let best = null, bestKey = '';
  (proj.notes || []).forEach(n => {
    if (!n || !n.date) return;
    const key = n.date + (n.time || '');
    if (!best || key.localeCompare(bestKey) > 0) { best = n; bestKey = key; }
  });
  return best ? { note: best, key: bestKey } : null;
}
function pgNoteEmoji(note) {
  const nt = NOTE_TYPES.find(t => t.key === note.type);
  return note.emoji || (nt && nt.emoji) || '\u{1F4CB}';
}
function pgOverdueCount(proj, today) {
  return (proj.tasks || []).filter(t => {
    if (t.isDueDate || t.isReview) return false;
    if (!taskIsForSelected(t) || isTaskDone(t.id)) return false;
    const end = t.endDate || t.date;
    return !!end && end < today;
  }).length;
}

/* Re-rendering after a commit destroys the cell you were typing in, so anything
 * that wants the caret back afterwards parks a request here and the next render
 * of the grid honours it. */
let _pgFocus = null; // { projectId, col }
function pgRestoreFocus() {
  const want = _pgFocus;
  _pgFocus = null;
  if (!want) return;
  const el = [...document.querySelectorAll('[data-pg-col="' + want.col + '"]')]
    .find(n => n.dataset.pgProject === want.projectId);
  if (!el) return;
  if (el.tagName === 'INPUT') el.focus();
  else el.click(); // an editable div — open it for typing
}

function renderProjectGridPanel() {
  const section = mkPanelSection('Project Grid');
  const today = todayStr();
  const info = getAllPeople().get(selectedPerson);

  const rows = (info ? [...info.projects.values()] : []).map(pref => {
    const proj = (state.projects || []).find(p => p.id === pref.id);
    if (!proj || isNonWorkProject(proj)) return null;
    const saved = getNextStep(selectedPerson, proj.id);
    const derived = pgDerivedNextStep(proj, today);
    const prev = pgLatestNote(proj);
    const team = pgProjectTeam(proj, today);
    return {
      proj, pref, saved, derived, prev, team,
      teamSort: pgTeamSortKey(team),
      status: getStatus(selectedPerson, proj.id),
      nextText: saved ? saved.text : derived,
      late: pgOverdueCount(proj, today)
    };
  }).filter(Boolean);

  if (!rows.length) {
    const empty = document.createElement('div');
    empty.className = 'pg-empty';
    empty.textContent = 'Not on any active projects.';
    section.appendChild(empty);
    return section;
  }

  const sort = getGridSort();
  const dir = sort.dir === 'desc' ? -1 : 1;
  rows.sort((a, b) => {
    let r = 0;
    if (sort.key === 'status') r = PG_STATUS_ORDER.indexOf(a.status) - PG_STATUS_ORDER.indexOf(b.status);
    else if (sort.key === 'team') r = a.teamSort.localeCompare(b.teamSort);
    else if (sort.key === 'next') r = (a.nextText || '￿').localeCompare(b.nextText || '￿');
    // Newest note first when ascending — "least recently touched" is the useful
    // end of this column, and it reads better as the reversed view.
    else if (sort.key === 'prev') r = (b.prev ? b.prev.key : '').localeCompare(a.prev ? a.prev.key : '');
    else r = a.proj.name.localeCompare(b.proj.name);
    return (r * dir) || a.proj.name.localeCompare(b.proj.name);
  });

  // ── toolbar ──
  const toolbar = document.createElement('div');
  toolbar.className = 'pg-toolbar';
  const hint = document.createElement('span');
  hint.className = 'pg-hint';
  hint.textContent = 'Click a cell to edit · Enter saves · Tab moves down · drag a column edge to resize';
  toolbar.appendChild(hint);
  const copyBtn = document.createElement('button');
  copyBtn.className = 'pg-copy';
  copyBtn.textContent = '\u{1F4CB} Copy';
  copyBtn.title = 'Copy as tab-separated rows — pastes into Excel or Sheets as real cells';
  copyBtn.addEventListener('click', () => {
    const lines = [['Project', 'Team', 'Status', 'Next Step', 'Previous Note'].join('\t')];
    rows.forEach(r => {
      const prevText = r.prev ? pgNoteEmoji(r.prev.note) + ' ' + (r.prev.note.body || '') : '';
      lines.push([
        r.proj.name,
        pgTeamText(r.team),
        r.status === 'on-schedule' ? 'On Track' : r.status === 'behind' ? 'Behind' : 'Ahead',
        r.nextText || '',
        prevText
      ].map(v => String(v).replace(/[\t\r\n]+/g, ' ')).join('\t'));
    });
    const tsv = lines.join('\r\n');
    const done = () => {
      copyBtn.textContent = '✓ Copied';
      setTimeout(() => { copyBtn.textContent = '\u{1F4CB} Copy'; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tsv).then(done).catch(() => pgFallbackCopy(tsv, done));
    } else pgFallbackCopy(tsv, done);
  });
  const resetBtn = document.createElement('button');
  resetBtn.className = 'pg-copy';
  resetBtn.textContent = '\u21f9 Reset widths';
  resetBtn.title = 'Put every column back to its default width';
  resetBtn.addEventListener('click', () => resetGridWidths());
  toolbar.appendChild(resetBtn);
  toolbar.appendChild(copyBtn);
  section.appendChild(toolbar);

  // ── table ──
  const wrap = document.createElement('div');
  wrap.className = 'pg-wrap';
  const table = document.createElement('table');
  table.className = 'pg-table';

  // Explicit widths on a colgroup — the only way a drag can own them. The table
  // is sized to their sum and a trailing filler column absorbs any slack, so
  // widening the panel never rescales what someone dragged.
  const widths = getGridWidths();
  const total = PG_COLS.reduce((n, c) => n + widths[c.id], 0);
  table.style.width = '100%';
  table.style.minWidth = total + 'px';

  const colgroup = document.createElement('colgroup');
  const colEls = {};
  PG_COLS.forEach(c => {
    const col = document.createElement('col');
    col.style.width = widths[c.id] + 'px';
    colgroup.appendChild(col);
    colEls[c.id] = col;
  });
  const filler = document.createElement('col');
  filler.className = 'pg-col-filler';
  colgroup.appendChild(filler);
  table.appendChild(colgroup);

  const thead = document.createElement('thead');
  const hrow = document.createElement('tr');
  PG_COLS.forEach(c => {
    const th = document.createElement('th');
    th.className = 'pg-col-' + c.id + (c.sortable ? ' sortable' : '') + (c.id === sort.key ? ' sorted' : '');
    th.textContent = c.label;
    if (c.sortable) {
      th.title = 'Sort by ' + c.label;
      if (c.id === sort.key) {
        const arrow = document.createElement('span');
        arrow.className = 'pg-sort-arrow';
        arrow.textContent = sort.dir === 'asc' ? '▲' : '▼';
        th.appendChild(arrow);
      }
      // A drag that ends over the header must not also sort. The suppressed
      // click consumes the flag, so the very next ordinary click still sorts.
      th.addEventListener('click', () => {
        if (_pgDragged) { _pgDragged = false; return; }
        setGridSort(c.id);
      });
    }
    th.appendChild(pgResizeHandle(c, colEls[c.id], table));
    hrow.appendChild(th);
  });
  const fillerTh = document.createElement('th');
  fillerTh.className = 'pg-col-filler';
  hrow.appendChild(fillerTh);
  thead.appendChild(hrow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  rows.forEach((r, i) => {
    tbody.appendChild(pgBuildRow(r, today, rows[i + 1] ? rows[i + 1].proj.id : null));
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  section.appendChild(wrap);

  if (_pgFocus) setTimeout(pgRestoreFocus, 0);
  return section;
}

/* Suppresses the click a finished drag would otherwise deliver to the header
 * underneath it. Cleared on the next tick, so an ordinary click still sorts. */
let _pgDragged = false;

function pgResizeHandle(col, colEl, table) {
  const handle = document.createElement('span');
  handle.className = 'pg-resize';
  handle.dataset.pgResize = col.id;
  handle.title = 'Drag to resize · double-click to reset this column';
  handle.addEventListener('click', e => e.stopPropagation());
  handle.addEventListener('dblclick', e => {
    e.preventDefault();
    e.stopPropagation();
    resetGridWidths(col.id);
  });

  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX;
    // Measured from the stored width rather than the rendered box: they are the
    // same number by construction, and this way a drag can't inherit a rounding
    // error from layout.
    const startW = getGridWidths()[col.id];
    let width = startW;
    let moved = false;
    handle.classList.add('dragging');

    const onMove = ev => {
      width = Math.max(PG_MIN_COL, startW + (ev.clientX - startX));
      if (width !== startW) moved = true;
      colEl.style.width = width + 'px';
      const others = PG_COLS.reduce((n, c) => n + (c.id === col.id ? 0 : getGridWidths()[c.id]), 0);
      table.style.minWidth = (others + width) + 'px';
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      handle.classList.remove('dragging');
      if (!moved) return;
      _pgDragged = true;
      // Backstop for a drag that ends away from any header, where no click
      // arrives to consume the flag.
      setTimeout(() => { _pgDragged = false; }, 0);
      setGridWidth(col.id, width);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  return handle;
}

function pgFallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (_) { alert('Copy failed — select the grid and copy manually.'); }
  ta.remove();
}

function pgBuildRow(r, today, nextRowId) {
  const { proj } = r;
  const tr = document.createElement('tr');

  // Project — with a red dot when something on it is overdue, since the grid
  // carries no date column of its own.
  const tdName = document.createElement('td');
  tdName.className = 'pg-col-project';
  if (r.late) {
    const dot = document.createElement('span');
    dot.className = 'pg-late-dot';
    dot.title = r.late + ' overdue ' + (r.late === 1 ? 'task' : 'tasks');
    tdName.appendChild(dot);
  }
  const link = document.createElement('a');
  link.className = 'pg-name';
  link.href = 'team.html#project=' + encodeURIComponent(proj.id);
  link.target = '_blank';
  link.textContent = proj.name;
  tdName.appendChild(link);
  tr.appendChild(tdName);

  tr.appendChild(pgTeamCell(r));

  // Status — the same control and store as My Projects, so they stay in step.
  const tdStatus = document.createElement('td');
  tdStatus.className = 'pg-col-status';
  tdStatus.appendChild(buildStatusSeg(proj.id));
  tr.appendChild(tdStatus);

  tr.appendChild(pgNextStepCell(r, today, nextRowId));
  tr.appendChild(pgPrevNoteCell(r, today));
  tr.appendChild(pgNoteEntryCell(proj));
  const fillerTd = document.createElement('td');
  fillerTd.className = 'pg-col-filler';
  tr.appendChild(fillerTd);
  return tr;
}

/* Who is on this project and in what role. You are listed too, marked rather
 * than dropped: omitting yourself would make the column mean something
 * different on every row, and you lose the confirmation of which role you are
 * actually credited with here. "You" is the starred identity (myPerson) only —
 * browsing someone else's dashboard must never relabel them as you. */
function pgTeamCell(r) {
  const td = document.createElement('td');
  td.className = 'pg-col-team';
  const wrap = document.createElement('div');
  wrap.className = 'pg-team';

  if (!r.team.length) {
    const none = document.createElement('span');
    none.className = 'pg-team-empty';
    none.textContent = 'No team recorded';
    wrap.appendChild(none);
    td.appendChild(wrap);
    return td;
  }

  r.team.forEach(({ role, names }) => {
    const line = document.createElement('div');
    line.className = 'pg-team-line';

    const label = document.createElement('span');
    label.className = 'pg-team-role';
    label.textContent = role;
    label.style.color = getRoleColor(role);
    line.appendChild(label);

    const list = document.createElement('span');
    list.className = 'pg-team-names';
    // Three deep per role, then a count — one over-rostered project shouldn't
    // stretch every other row.
    names.slice(0, 3).forEach((name, i) => {
      if (i) list.appendChild(document.createTextNode(', '));
      const span = document.createElement('span');
      if (myPerson && name === myPerson) {
        span.className = 'pg-team-me';
        span.textContent = name + ' (you)';
      } else {
        span.textContent = name;
      }
      list.appendChild(span);
    });
    if (names.length > 3) {
      const more = document.createElement('span');
      more.className = 'pg-team-more';
      more.textContent = ' +' + (names.length - 3);
      list.appendChild(more);
    }
    line.appendChild(list);
    line.title = role + ': ' + names.join(', ');
    wrap.appendChild(line);
  });

  td.appendChild(wrap);

function pgNextStepCell(r, today, nextRowId) {
  const { proj, saved, derived } = r;
  const td = document.createElement('td');
  td.className = 'pg-col-next';

  const cell = document.createElement('div');
  cell.className = 'pg-cell-edit' + (saved ? '' : derived ? ' derived' : ' empty');
  cell.dataset.pgProject = proj.id;
  cell.dataset.pgCol = 'next';
  cell.tabIndex = 0;
  cell.textContent = saved ? saved.text : (derived || 'Set next step…');
  cell.title = saved
    ? 'Updated ' + fmtDayShort(saved.updated, today) + ' — click to edit'
    : derived ? 'From your next scheduled task — click to write your own' : 'Click to add a next step';
  if (saved && saved.updated && saved.updated !== today) {
    const age = document.createElement('span');
    age.className = 'pg-age';
    age.textContent = fmtDayShort(saved.updated, today);
    cell.appendChild(age);
  }

  const startEdit = () => {
    const input = document.createElement('input');
    input.className = 'pg-input';
    input.value = saved ? saved.text : (derived || '');
    input.placeholder = 'What happens next?';
    td.innerHTML = '';
    td.appendChild(input);
    input.focus();
    input.select();

    let settled = false;
    const commit = moveDown => {
      if (settled) return;
      settled = true;
      setNextStep(selectedPerson, proj.id, input.value);
      if (moveDown && nextRowId) _pgFocus = { projectId: nextRowId, col: 'next' };
      renderAll();
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(false); }
      else if (e.key === 'Escape') { e.preventDefault(); settled = true; renderAll(); }
      else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); commit(true); }
    });
    input.addEventListener('blur', () => commit(false));
  };
  cell.addEventListener('click', startEdit);
  cell.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startEdit(); } });

  td.appendChild(cell);
  return td;
}

function renderOverduePanel() {
  const section = mkPanelSection('Needs Attention');
  const today = todayStr();

  const overdue = [];
  (state.projects || []).filter(isReviewableProject).forEach(proj => {
    (proj.tasks || []).forEach(t => {
      if (t.isDueDate || t.isReview) return;
      if (!taskIsForSelected(t) || isTaskDone(t.id)) return;

      if (!end || end >= today) return;

// ══════════════════════════════════════════════════════════════════
// ── PANEL: LOOK BACK (period self-review) ──
// Aggregates the selected person's work over a chosen quarter / half /
// full year so they can write a mid-year or year-end self-review.
// Unlike the daily panels, this intentionally includes COMPLETED
// projects — reviewing finished work is the whole point.
// ══════════════════════════════════════════════════════════════════
const LB_PERIODS = [
  { key: 'Q1', label: 'Q1', months: [0, 2] },
  { key: 'Q2', label: 'Q2', months: [3, 5] },
  { key: 'H1', label: 'H1', months: [0, 5] },
  { key: 'Q3', label: 'Q3', months: [6, 8] },
  { key: 'Q4', label: 'Q4', months: [9, 11] },
  { key: 'H2', label: 'H2', months: [6, 11] },
  { key: 'FY', label: 'Year', months: [0, 11] },
];
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function lbPad(n) { return (n < 10 ? '0' : '') + n; }

function lbPeriodRange(year, periodKey) {
  const def = LB_PERIODS.find(p => p.key === periodKey) || LB_PERIODS[2];
  const [m0, m1] = def.months;
  const start = year + '-' + lbPad(m0 + 1) + '-01';
  const lastDay = new Date(year, m1 + 1, 0).getDate();
  const end = year + '-' + lbPad(m1 + 1) + '-' + lbPad(lastDay);
  const label = def.label === 'Year'
    ? ('Full Year ' + year)
    : (def.label + ' ' + year + ' (' + MONTH_ABBR[m0] + '–' + MONTH_ABBR[m1] + ')');
  return { start, end, months: [m0, m1], label, def };
}

// One pass over ALL non-ghost projects (including completed) collecting the
// selected person's activity across [start, end].
function aggregateLookback(start, end) {
  const byDay = {};                 // dateStr -> effort pts
  const byMonth = new Array(12).fill(0);
  const byProject = new Map();       // projId -> { proj, pts, tasks, roles:Set, completed }
  const notes = [];
  let taskCount = 0, totalPts = 0, reviewCount = 0, ptoDays = 0;

  (state.projects || []).filter(p => !p.ghost).forEach(proj => {
    let projPts = 0, projTasks = 0;
    const projRoles = new Set();

    (proj.tasks || []).forEach(t => {
      const s = t.date;
      const e = t.endDate || t.date;
      if (!s) return;
      if (e < start || s > end) return;      // no overlap with the period
      if (!taskIsForSelected(t)) return;

      // Clip the task span to the period.
      const from = s < start ? start : s;
      const to   = e > end   ? end   : e;

      if (t.isDueDate) {
        // Milestones / time off carry no effort; count days out (PTO + holidays).
        if (isTimeOffTask(t)) ptoDays += daysBetween(from, to) + 1;
        return;
      }

      const pts = loePts(t.loe);
      taskCount++; projTasks++;
      if (t.isReview) reviewCount++;
      if (t.role) projRoles.add(t.role);
      (t.attendees || []).forEach(a => { if (a.person === selectedPerson && a.role) projRoles.add(a.role); });

      // Distribute effort across each spanned day (matches getDayWorkload semantics).
      for (let d = from; d <= to; d = addDays(d, 1)) {
        byDay[d] = (byDay[d] || 0) + pts;
        byMonth[new Date(d + 'T00:00:00').getMonth()] += pts;
        projPts += pts; totalPts += pts;
      }
    });

    if (projTasks > 0) {
      byProject.set(proj.id, { proj, pts: projPts, tasks: projTasks, roles: projRoles, completed: !!proj.completed });
      (proj.notes || []).forEach(n => {
        if (n && n.date && n.date >= start && n.date <= end) notes.push({ note: n, projectName: proj.name });
      });
    }
  });

  notes.sort((a, b) => (b.note.date + (b.note.time || '')).localeCompare(a.note.date + (a.note.time || '')));

  let busiestMonthIdx = -1, busiestMonthVal = 0;
  byMonth.forEach((v, i) => { if (v > busiestMonthVal) { busiestMonthVal = v; busiestMonthIdx = i; } });

  return {
    byDay, byMonth, byProject, notes,
    taskCount, totalPts, reviewCount, ptoDays,
    activeDays: Object.keys(byDay).length,
    busiestMonthIdx,
  };
}

function renderLookbackPanel() {
  const range = lbPeriodRange(lookbackYear, lookbackPeriod);
  const agg = aggregateLookback(range.start, range.end);

  const section = mkPanelSection('Look Back — ' + range.label);

  // ── Controls: year stepper + period segments + copy ──

  controls.className = 'lb-controls';

  const yPrev = document.createElement('button');
  yPrev.className = 'lb-year-btn'; yPrev.textContent = '‹'; yPrev.title = 'Previous year';
  yPrev.addEventListener('click', () => { lookbackYear--; saveLookback(); renderDashboard(); });
  const yLabel = document.createElement('span');

  yNext.className = 'lb-year-btn'; yNext.textContent = '›'; yNext.title = 'Next year';

  controls.appendChild(periods);

  const copyBtn = document.createElement('button');

  copyBtn.addEventListener('click', () => {

      () => { copyBtn.textContent = '✕ Failed'; setTimeout(() => { copyBtn.textContent = '📋 Copy for review'; }, 1600); }

  section.appendChild(controls);

  if (!agg.taskCount && !agg.ptoDays) {

  const projRows = [...agg.byProject.values()].sort((a, b) => b.pts - a.pts || b.tasks - a.tasks);

      const nt = NOTE_TYPES.find(t => t.key === note.type);
      icon.textContent = note.emoji || (nt && nt.emoji) || '\u{1F4CB}';
      item.appendChild(icon);
      const body = document.createElement('div');
      body.className = 'act-body';
      const text = document.createElement('div');
      text.className = 'act-text';
      text.textContent = note.body || '';
      body.appendChild(text);
      const meta = document.createElement('div');
      meta.className = 'act-meta';
      meta.innerHTML = '<span class="act-project">' + esc(projectName) + '</span> · ' + esc(note.person || 'Team') + ' · ' + esc(fmtDateShort(note.date));
      body.appendChild(meta);
      item.appendChild(body);
      list.appendChild(item);
    });
    section.appendChild(list);
  }

  return section;
}

// GitHub-style calendar heatmap for the period: columns = weeks (Sun-start),
// rows = weekdays, cell color = that day's effort via workloadInfo().
function buildLookbackHeatmap(range, agg) {
  const wrap = document.createElement('div');
  wrap.className = 'lb-heatmap-wrap';

  const gridStart = getWeekStart(range.start);   // Sunday on/before period start
  const weeks = [];
  let cursor = gridStart;
  let guard = 0;
  while (cursor <= range.end && guard++ < 400) {
    weeks.push(cursor);
    cursor = addDays(cursor, 7);
  }

  // Month labels aligned to the week column where each month first appears.
  const monthRow = document.createElement('div');
  monthRow.className = 'lb-hm-months';
  let lastMonth = -1;
  weeks.forEach(weekStart => {
    const lbl = document.createElement('div');
    lbl.className = 'lb-hm-month';
    lbl.style.width = '15px'; // 12px cell + 3px gap
    const m = new Date(weekStart + 'T00:00:00').getMonth();
    if (m !== lastMonth && weekStart >= range.start) { lbl.textContent = MONTH_ABBR[m]; lastMonth = m; }
    monthRow.appendChild(lbl);
  });
  wrap.appendChild(monthRow);

  const grid = document.createElement('div');
  grid.className = 'lb-heatmap';
  weeks.forEach(weekStart => {
    const col = document.createElement('div');
    col.className = 'lb-hm-week';
    for (let dow = 0; dow < 7; dow++) {
      const day = addDays(weekStart, dow);
      const cell = document.createElement('div');
      cell.className = 'lb-hm-cell';
      if (day < range.start || day > range.end) {
        cell.classList.add('empty');
      } else {
        const pts = agg.byDay[day] || 0;
        if (dow === 5 || dow === 6) cell.classList.add('weekend'); // Mon-start grid: 5=Sat, 6=Sun
        if (pts > 0) {
          cell.style.background = workloadInfo(pts).color;
          cell.title = fmtDateShort(day) + ' · ' + pts + ' pt' + (pts === 1 ? '' : 's') + ' (' + workloadInfo(pts).label + ')';
        } else {
          cell.title = fmtDateShort(day) + ' · no tracked work';
        }
      }
      col.appendChild(cell);
    }
    grid.appendChild(col);
  });
  wrap.appendChild(grid);

  // Legend
  const legend = document.createElement('div');
  legend.className = 'lb-hm-legend';
  legend.appendChild(document.createTextNode('Lighter'));
  [1, 2, 3, 4, 5].forEach(p => {
    const sw = document.createElement('span');
    sw.className = 'lb-hm-legend-swatch';
    sw.style.background = workloadInfo(p).color;
    legend.appendChild(sw);
  });
  legend.appendChild(document.createTextNode('Heavier'));
  wrap.appendChild(legend);

  return wrap;
}

// Plain-text summary to paste straight into a self-review doc.
function buildLookbackSummaryText(range, agg) {
  const lines = [];
  lines.push(selectedPerson + ' — Look Back: ' + range.label);
  lines.push('');
  lines.push('SNAPSHOT');
  lines.push('  Projects worked on: ' + agg.byProject.size);
  lines.push('  Tasks: ' + agg.taskCount + '   Effort points: ' + agg.totalPts + '   Active days: ' + agg.activeDays);
  lines.push('  Reviews: ' + agg.reviewCount + '   PTO days: ' + agg.ptoDays);
  if (agg.busiestMonthIdx >= 0) lines.push('  Busiest month: ' + MONTH_ABBR[agg.busiestMonthIdx]);
  lines.push('');
  lines.push('PROJECTS (by effort)');
  [...agg.byProject.values()].sort((a, b) => b.pts - a.pts).forEach(r => {
    const roleTxt = [...r.roles].sort().join(', ') || '—';
    lines.push('  • ' + r.proj.name + (r.completed ? ' [completed]' : '') + ' — ' + r.pts + ' pts, ' + r.tasks + ' tasks (' + roleTxt + ')');
  });
  if (agg.notes.length) {
    lines.push('');
    lines.push('NOTES & HIGHLIGHTS');
    agg.notes.slice(0, 20).forEach(({ note, projectName }) => {
      const nt = NOTE_TYPES.find(t => t.key === note.type);
      lines.push('  • [' + (nt ? nt.label : 'Note') + '] ' + projectName + ' (' + note.date + '): ' + (note.body || ''));
    });
  }
  return lines.join('\n');
}

// ── ESCAPE HTML ──
function esc(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ── DATE NAVIGATION ──
document.getElementById('btnPrevDay').addEventListener('click', () => {
  selectedDate = addDays(selectedDate, -1);
  renderAll();
});
document.getElementById('btnNextDay').addEventListener('click', () => {
  selectedDate = addDays(selectedDate, 1);
  renderAll();
});
document.getElementById('btnToday').addEventListener('click', () => {
  selectedDate = todayStr();
  renderAll();
});
document.getElementById('dateLabel').addEventListener('click', () => {
  const picker = document.getElementById('datePicker');
  picker.value = selectedDate;
  // showPicker() is unsupported on older browsers/WebViews and throws there —
  // fall back to a plain click so the native picker still opens.
  try {
    if (picker.showPicker) picker.showPicker();
    else picker.click();
  } catch (_) { picker.click(); }
});
document.getElementById('datePicker').addEventListener('change', (e) => {
  if (e.target.value) {
    selectedDate = e.target.value;
    renderAll();
  }
});

// ── SEARCH ──
document.getElementById('personSearch').addEventListener('input', (e) => {
  searchFilter = e.target.value;
  renderSidebar();
});

// ── INIT ──
renderAll();
</script>
