<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRE-PRO — Dashboard</title>

<!-- Firebase + auth gate -->
<!-- Cache-bust / auto-update: bump PREPRO_BUILD + version.json + the ?v= tokens
     on each deploy. If the deployed build is newer than this cached page, reload
     once so users always get the latest without a manual hard refresh. -->
<script>
window.PREPRO_BUILD = '20260825a';
(function () {
  try {
    fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (v) {
        if (v && v.build && v.build !== window.PREPRO_BUILD) {
          var k = 'prepro_reloaded_' + v.build;
          if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, '1'); location.reload(); }
        }
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>

<script type="module" src="./auth.js?v=20260825a"></script>
<!-- Shared people module — classic script so its globals exist before the app
     script below runs. Same file is loaded by team.html and ops.html. -->
<script src="./people.js?v=20260825a"></script>
<script type="module">
window._fbReady.then(({ db, ref, onValue }) => {
  onValue(ref(db, 'prepro/state'), snapshot => {
    const data = snapshot.val();
    if (!data || !Array.isArray(data.projects)) return;
    window._fbState = data;
    if (window._dashReloadState) window._dashReloadState(data);
  }, err => console.error('dash firebase error:', err));

  onValue(ref(db, 'prepro/dash'), snapshot => {
    const data = snapshot.val();
    // Skip the echo of our own writes — local state is already current and
    // re-rendering would tear down any input the user just opened. We compare
    // the incoming payload against a signature of what THIS client last wrote,
    // rather than a decrementing counter (which desyncs when Firebase coalesces
    // rapid writes into fewer echoes and permanently drops later remote updates).
    let sig = null;
    try { sig = JSON.stringify(data); } catch (_) { sig = null; }
    if (sig !== null && sig === window._fbLastDashWrite) { window._fbLastDashWrite = null; return; }
    if (data) { window._fbDashData = data; if (window._dashReloadDashData) window._dashReloadDashData(data); }
  }, err => console.error('dash meta firebase error:', err));

  onValue(ref(db, 'prepro/nameHistory'), snapshot => {
    const data = snapshot.val();
    if (data) { window._fbNameHistory = data; if (window._dashReloadNameHistory) window._dashReloadNameHistory(data); }
  }, err => console.error('dash nameHistory firebase error:', err));

  // Dash never subscribed to sunsetPeople, so soft-removed people kept showing
  // up in its pickers and panels. Both nodes are wired now.
  onValue(ref(db, 'prepro/sunsetPeople'), snapshot => {
    window._fbSunsetPeople = snapshot.val() || {};
    if (window._dashReloadSunsetPeople) window._dashReloadSunsetPeople(window._fbSunsetPeople);
  }, err => console.error('dash sunsetPeople firebase error:', err));

  onValue(ref(db, 'prepro/people'), snapshot => {
    window._fbPeople = snapshot.val() || {};
    if (window._dashReloadPeople) window._dashReloadPeople(window._fbPeople);
  }, err => console.error('dash people firebase error:', err));

  onValue(ref(db, 'prepro/peopleEmails'), snapshot => {
    const data = snapshot.val();
    if (data) { window._fbPeopleEmails = data; if (window._dashReloadPeopleEmails) window._dashReloadPeopleEmails(data); }
  }, err => console.error('dash peopleEmails firebase error:', err));
});
</script>

<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button { font: inherit; cursor: pointer; border: none; background: none; }
input  { font: inherit; }

/* ── VARIABLES ── */
:root {
  --bg:        #0d0d12;
  --panel:     #16161e;
  --card:      #1e1e28;
  --border:    #2c2c3e;
  --text:      #e0e0ec;
  --dim:       #8080a0;
  --accent:    #6c63ff;
  --danger:    #e05555;
  --cat-internal: #4a90d9;
  --cat-external: #e07b39;
  --cat-vendor:   #7c5cbf;
  --cat-other:    #4cba6a;
}

/* ── LIGHT THEME ── */
:root[data-theme="light"] {
  --bg:      #eceef4;
  --panel:   #ffffff;
  --card:    #f6f7fb;
  --border:  #d3d6e0;
  --text:    #1b1c26;
  --dim:     #61637a;
  --accent:  #5a51e6;
}

/* ── THEME TOGGLE BUTTON ── */
.theme-toggle { font-size: 14px; line-height: 1; color: var(--dim); background: var(--card); border: 1px solid var(--border); border-radius: 6px; width: 30px; height: 28px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: color .15s, border-color .15s; flex-shrink: 0; user-select: none; }
.theme-toggle:hover { color: var(--text); border-color: var(--accent); }

/* ── BASE ── */
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 13px; overflow: hidden; }
body { display: flex; flex-direction: column; }

/* ── HEADER ── */
.dash-header { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.dash-title { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.dash-subtitle { font-size: 11px; color: var(--dim); }
.dash-spacer { flex: 1; }

/* ── DATE NAV ── */
.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav-btn { font-size: 14px; font-weight: 700; color: var(--dim); background: var(--card); border: 1px solid var(--border); border-radius: 5px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s; user-select: none; }
.date-nav-btn:hover { color: var(--text); border-color: var(--dim); }
.date-nav-label { font-size: 12px; font-weight: 600; color: var(--text); cursor: pointer; min-width: 140px; text-align: center; }
.date-nav-label:hover { color: var(--accent); }
.btn-today { font-size: 11px; font-weight: 600; color: var(--dim); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.btn-today:hover { color: var(--text); }
#datePicker { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }

/* ── LAYOUT ── */
.dash-layout { display: grid; grid-template-columns: 220px 1fr; flex: 1; min-height: 0; }

/* ── SIDEBAR ── */
.dash-sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.dash-sidebar-head { padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.data-migration { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); flex-shrink: 0; }
.data-mig-btn { flex: 1; font-size: 10px; font-weight: 600; color: var(--dim); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 5px 4px; cursor: pointer; transition: color .15s, border-color .15s; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.data-mig-btn:hover { color: var(--text); border-color: var(--accent); }
.dash-search { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; color: var(--text); padding: 5px 8px; font-size: 12px; outline: none; }
.dash-search:focus { border-color: var(--accent); }
.dash-search::placeholder { color: var(--dim); }
.dash-people { flex: 1; overflow-y: auto; padding: 6px 0; }
.dash-person { display: flex; flex-direction: row; align-items: center; gap: 6px; padding: 6px 10px; cursor: pointer; border-radius: 5px; margin: 1px 6px; user-select: none; transition: background .1s; }
.dash-person:hover { background: var(--card); }
.dash-person.active { background: var(--accent); }
.dash-person-info { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.dash-person-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.dash-person.active .dash-person-name { color: #fff; }
.dash-person-roles { font-size: 10px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash-person.active .dash-person-roles { color: rgba(255,255,255,.7); }
.me-badge { font-size: 8px; font-weight: 800; letter-spacing: .08em; color: #fff; background: var(--accent); border-radius: 3px; padding: 1px 4px; flex-shrink: 0; }
.dash-person.active .me-badge { background: rgba(255,255,255,.28); }
.dash-me-btn { flex-shrink: 0; font-size: 14px; line-height: 1; background: none; border: none; cursor: pointer; color: var(--dim); opacity: 0; transition: opacity .12s, color .12s; padding: 2px; }
.dash-person:hover .dash-me-btn { opacity: 1; }
.dash-me-btn.active { opacity: 1; color: #f5b301; }
.dash-person.active .dash-me-btn { color: rgba(255,255,255,.7); }
.dash-person.active .dash-me-btn.active { color: #ffd451; }
.dash-me-btn:hover { color: #f5b301; }

/* ── MAIN ── */
.dash-main { overflow-y: auto; padding: 20px 28px 40px; }
.dash-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--dim); font-size: 14px; }

/* ── STATUS CONTROL (per-project) ── */
.status-seg { display: flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; margin-left: auto; flex-shrink: 0; }
.status-seg-btn { font-size: 9px; font-weight: 600; padding: 2px 8px; color: var(--dim); background: var(--bg); border: none; cursor: pointer; transition: all .15s; border-right: 1px solid var(--border); }
.status-seg-btn:last-child { border-right: none; }
.status-seg-btn:hover { color: var(--text); }
.status-seg-btn.active-behind { background: rgba(192,57,79,.2); color: #e07070; }
.status-seg-btn.active-on { background: rgba(76,186,106,.2); color: #4cba6a; }
.status-seg-btn.active-ahead { background: rgba(74,144,217,.2); color: #4a90d9; }

/* ── EFFORT BAR ── */
.effort-bar { display: flex; gap: 4px; margin-bottom: 20px; }
.effort-day { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 4px; text-align: center; min-width: 0; }
.effort-day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
/* Out on PTO or a holiday — dimmed so an empty day and a day off don't look alike. */
.effort-day.off { opacity: .55; border-style: dashed; }
.effort-day-label { font-size: 9px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.effort-day-score { font-size: 14px; font-weight: 700; }

/* ── SECTIONS ── */
.dash-section { margin-bottom: 24px; }
.dash-section-title { font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }

/* ── TODAY HERO ── */
.today-hero { margin-bottom: 28px; min-height: 200px; }
.today-date-heading { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 16px; letter-spacing: -.02em; }
.today-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
.today-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.today-card-project { font-size: 14px; font-weight: 700; color: var(--text); text-decoration: none; }
a.today-card-project:hover { color: var(--accent); }
.role-tag { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 10px; color: #fff; white-space: nowrap; }
.today-task-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
.today-task-block + .today-task-block { border-top: 1px solid var(--border); }
.today-task-row.completed { opacity: .35; }
.today-task-row.completed .task-name { text-decoration: line-through; }
.task-suggestion { font-size: 11px; color: var(--accent); background: rgba(108,99,255,.08); border-left: 2px solid var(--accent); padding: 6px 10px 6px 8px; margin: 2px 0 4px 26px; border-radius: 0 6px 6px 0; line-height: 1.55; }
.task-suggestion .ts-icon { margin-right: 4px; }
.task-check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--dim); background: none; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; transition: all .15s; padding: 0; }
.task-check:hover { border-color: var(--accent); }
.task-check.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
.task-name { flex: 1; }
.task-loe { flex-shrink: 0; cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: background .15s; user-select: none; font-size: 14px; }
.task-loe:hover { background: rgba(255,255,255,.1); }
.task-badge { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: rgba(192,57,79,.2); color: #e07070; white-space: nowrap; }
.task-days { font-size: 10px; color: var(--dim); flex-shrink: 0; }
/* ── SUBTASKS ── */
.subtask-area { padding-left: 26px; padding-bottom: 4px; }
.subtask-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12px; }
.subtask-check { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--border); background: none; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: transparent; transition: all .15s; padding: 0; }
.subtask-check:hover { border-color: var(--accent); }
.subtask-check.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
.subtask-text { flex: 1; color: var(--text); }
.subtask-text.done { text-decoration: line-through; opacity: .4; }
.subtask-del { font-size: 11px; color: var(--dim); cursor: pointer; opacity: 0; transition: opacity .15s; padding: 0 2px; }
.subtask-row:hover .subtask-del { opacity: 1; }
.subtask-del:hover { color: var(--danger); }
.subtask-add-btn { font-size: 11px; color: var(--dim); cursor: pointer; padding: 2px 0; display: inline-flex; align-items: center; gap: 4px; transition: color .15s; background: none; border: none; }
.subtask-add-btn:hover { color: var(--accent); }
.subtask-input { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 3px 6px; font-size: 11px; outline: none; flex: 1; }
.subtask-input:focus { border-color: var(--accent); }
.subtask-input-row { display: flex; gap: 4px; padding: 3px 0; }

/* ── TASK NOTE BUTTON ── */
.task-note-btn { font-size: 11px; color: var(--dim); cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: all .15s; user-select: none; flex-shrink: 0; background: none; border: none; opacity: 0; }
.today-task-row:hover .task-note-btn { opacity: 1; }
.task-note-btn:hover { color: var(--accent); background: rgba(255,255,255,.06); }

/* ── NOTE COMPOSE OVERLAY ── */
.note-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: flex; align-items: center; justify-content: center; }
.note-modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; width: 380px; max-width: 90vw; }
.note-modal-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.note-modal-types { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.note-modal-type-btn { font-size: 10px; font-weight: 600; color: var(--dim); background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; cursor: pointer; transition: all .15s; }
.note-modal-type-btn:hover { color: var(--text); border-color: var(--accent); }
.note-modal-type-btn.active { background: rgba(108,99,255,.18); color: var(--accent); border-color: var(--accent); }
.note-modal textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; color: var(--text); padding: 6px 8px; font: inherit; font-size: 12px; resize: vertical; min-height: 60px; outline: none; box-sizing: border-box; }
.note-modal textarea:focus { border-color: var(--accent); }
.note-modal-actions { display: flex; gap: 6px; margin-top: 8px; }
.note-modal .btn { padding: 5px 14px; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; }
.note-modal .btn-primary { background: var(--accent); color: #fff; }
.note-modal .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }

.no-tasks { color: var(--dim); font-size: 14px; font-style: italic; padding: 24px 0; }

/* ── HEADS UP ── */
.headsup-list { display: flex; flex-direction: column; gap: 6px; }
.headsup-item { display: flex; align-items: flex-start; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12px; }
.headsup-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.headsup-body { flex: 1; min-width: 0; }
.headsup-title { font-weight: 600; }
.headsup-date { font-size: 10px; color: var(--dim); margin-top: 1px; }
.headsup-meta { font-size: 10px; color: var(--dim); margin-top: 1px; }
.headsup-item.pto { border-color: rgba(255,180,50,.25); }
.headsup-item.pto .headsup-icon { opacity: .8; }
.headsup-item.review { border-color: rgba(192,57,79,.3); }
.headsup-item.shoot { border-color: rgba(192,57,79,.4); }
.headsup-item.milestone { border-color: rgba(108,99,255,.3); }
.headsup-title a { color: var(--text); text-decoration: none; }
.headsup-title a:hover { color: var(--accent); text-decoration: underline; }
.headsup-prompt { font-size: 11px; color: var(--dim); font-style: italic; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border); }
.headsup-prompt-clickable { cursor: pointer; }
.headsup-prompt-clickable:hover { color: var(--text); }
.headsup-tasks { margin-top: 4px; padding: 4px 0 0; font-style: normal; }
.headsup-task-item { font-size: 11px; color: var(--text); padding: 2px 0; display: flex; align-items: center; gap: 6px; }
.headsup-task-item + .headsup-task-item { border-top: 1px solid var(--border); }
.headsup-task-person { font-size: 9px; color: var(--dim); }
.headsup-task-loe { flex-shrink: 0; }

/* ── COMING UP CARDS ── */
.coming-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.coming-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-height: 70px; }
.coming-card.free { opacity: .45; }
.coming-card-date { font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 6px; }
.coming-card-task { font-size: 12px; padding: 4px 0; }
.coming-card-task + .coming-card-task { border-top: 1px solid var(--border); }
.coming-card-task-row { display: flex; align-items: center; gap: 6px; }
.coming-card-task-row .task-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.coming-card-project { font-size: 9px; color: var(--dim); margin-top: 1px; }
.coming-card-free { font-size: 12px; color: var(--dim); font-style: italic; }

/* ── GANTT CHART ── */
.gantt-chart { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
.gantt-row { display: grid; grid-template-columns: 200px 1fr; min-height: 40px; }
.gantt-row + .gantt-row { border-top: 1px solid var(--border); }
.gantt-row.gantt-header-row { background: var(--bg); min-height: 36px; }
.gantt-label { padding: 6px 10px; font-size: 11px; border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.gantt-task-name { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gantt-task-project { font-size: 9px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.gantt-cells { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); }
.gantt-cell { border-right: 1px solid var(--border); }
.gantt-cell:last-child { border-right: none; }
.gantt-cell.today { background: rgba(108,99,255,.08); }
.gantt-day-header { padding: 6px 4px; text-align: center; font-size: 10px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.gantt-day-header:last-child { border-right: none; }
.gantt-day-header.today { color: var(--accent); background: rgba(108,99,255,.08); }
.gantt-day-header .gantt-date { font-size: 10px; font-weight: 600; color: var(--text); }
.gantt-day-header.today .gantt-date { color: var(--accent); }
.gantt-bar { position: absolute; top: 5px; bottom: 5px; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.35); cursor: default; }
.gantt-bar-text { overflow: hidden; text-overflow: ellipsis; }
.gantt-bar.milestone { background: #c0394f !important; }
.gantt-bar.pto { background: #c8923a !important; }
.gantt-bar.review { background: #c0394f !important; }
.gantt-bar.clipped-left { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.gantt-bar.clipped-right { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.gantt-empty { padding: 24px; text-align: center; color: var(--dim); font-style: italic; font-size: 12px; }

/* ── MY PROJECTS PANEL ── */
.mp-list { display: flex; flex-direction: column; gap: 8px; }
.mp-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.mp-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }

<script>
// ── LIGHT / DARK THEME (shared across ops, team, dash via 'prepro_theme') ──
(function () {
  const KEY = 'prepro_theme';
  const apply = t => document.documentElement.setAttribute('data-theme', t);
  apply(localStorage.getItem(KEY) === 'light' ? 'light' : 'dark');
  document.addEventListener('DOMContentLoaded', function () {
    const btn = document.getElementById('themeToggle');
    if (!btn) return;
    const sync = () => { btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀'; };
    sync();
    btn.addEventListener('click', function () {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      localStorage.setItem(KEY, next);
      apply(next);
      sync();
    });
  });
})();
</script>

<script>
'use strict';

// ── CONSTANTS ──
/* Identical to team.html's copy, deliberately. `label` is not display text:
 * team.html writes it into task.roleCategory and attendee.category, and five
 * places across the three pages test it against 'Internal Team'. It is a stored
 * enum, so the values are frozen. Dash only ever reads them.
 *
 * TEAMS (people.js) is the other axis — who somebody IS. Colour comes from there
 * first, via getRoleColor, which is why this table no longer needs a
 * Stakeholders bucket of its own to keep chips the right colour. */
const ROLE_CATS = [
  { label: 'Internal Team', color: '#4a90d9', roles: ['Producer', 'Editor', 'Animator'] },
  { label: 'External',      color: '#e07b39', roles: ['Copywriter', 'Designer', 'Stakeholder'] },
  { label: 'Vendors',       color: '#7c5cbf', roles: ['External Vendor'] },
  { label: 'Other',         color: '#4cba6a', roles: ['Other'] }
];
const LOE_EMOJI = { low: '\u{1F7E2}', medium: '\u{1F7E1}', high: '\u{1F534}' };
const LOE_PTS   = { low: 1, medium: 2, high: 3 };

// Generic display name for a task when no custom name was entered. Mirrors
// ops.html's opsTaskTitle: role verb for work tasks, review/milestone labels
// otherwise. Without this, unnamed work tasks fell through to '(untitled)'.
const ROLE_VERB = { 'Producer': 'Producing', 'Editor': 'Editing', 'Animator': 'Animating', 'Copywriter': 'Copywriting', 'Designer': 'Designing', 'Stakeholder': 'Reviewing', 'External Vendor': 'Vendor Work', 'Other': 'Working', 'Administrative': 'Administrative', 'Team/Other Event': 'Team Event' };
function roleVerb(role) { return ROLE_VERB[role] || role || 'Task'; }
// ── TASK TYPE DISPLAY (mirrors team.html / ops.html) ──
const MILESTONE_LABEL = { milestone: 'Milestone', delivery: 'Delivery', pto: 'PTO', holiday: 'Holiday', 'due-date': 'Project Due Date' };
function milestoneLabel(type) { return MILESTONE_LABEL[type] || MILESTONE_LABEL['due-date']; }
// Holidays mean nobody is working, exactly like PTO — every PTO test here wants
// this, or a holiday would be counted as a project deliverable instead.
function isHolidayTask(t) { return !!(t && t.isDueDate && t.milestoneType === 'holiday'); }
function isTimeOffTask(t) { return !!(t && t.isDueDate && (t.milestoneType === 'pto' || t.milestoneType === 'holiday')); }
// Is this specific person off on this PTO/Holiday task? Explicit attendees only.
// The old test also matched the task NAME against the person's name, which threw
// false positives on short names ("Al" is a substring of "Alex PTO"), so someone
// else's time off showed up as yours. Mirrors ops.html's isPersonPTO.
function personOnTimeOff(task, personName) {
  if (!personName) return false;
  const lp = personName.toLowerCase();
  return (task.attendees || []).some(a => a.person && a.person.toLowerCase() === lp);
}
// Three-letter badge labels, matching team.html.
const TYPE_ABBR = {
  'Review':            'REV',
  'Meeting':           'MTG',
  'Studio Shoot':      'STS',
  'On-Location Shoot': 'OLS',
  'Studio Work':       'STW',
  'Project Due Date':  'DUE',
  'Milestone':         'MLS',
  'Delivery':          'DEL',
  'PTO':               'PTO',
  'Holiday':           'HOL',
};
function typeAbbr(label) { return TYPE_ABBR[label] || String(label || '').slice(0, 3).toUpperCase(); }
const BADGE_STYLE = {
  pto:        'background:rgba(108,99,255,.2);color:var(--accent)',
  holiday:    'background:rgba(240,180,41,.2);color:#f0b429',
  'due-date': 'background:rgba(224,123,57,.2);color:#e07b39',
  delivery:   'background:rgba(76,186,106,.2);color:#4cba6a',
  milestone:  'background:rgba(108,99,255,.2);color:var(--accent)',
};

function taskDisplayName(task) {
  if (!task) return 'Task';
  if (task.taskName) return task.taskName;
  if (task.isReview) return task.reviewLabel || 'Review';
  if (task.isDueDate) return milestoneLabel(task.milestoneType);
  return roleVerb(task.role);
}
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const NOTE_TYPES = [
  { key: 'update',    label: 'Project Update',        emoji: '\u{1F4CB}', desc: 'General status update' },
  { key: 'delay',     label: 'Project Delay',          emoji: '\u{23F3}',  desc: 'Something is behind schedule' },
  { key: 'direction', label: 'Change in Direction',     emoji: '\u{1F500}', desc: 'Scope, creative, or strategy shift' },
  { key: 'feedback',  label: 'Stakeholder Feedback',    emoji: '\u{1F4AC}', desc: 'Feedback from a stakeholder or client' },
  { key: 'blocker',   label: 'Blocker',                 emoji: '\u{1F6A7}', desc: 'Something is blocking progress' },
  { key: 'decision',  label: 'Decision Made',           emoji: '\u{2705}',  desc: 'Key decision logged for the record' },
  { key: 'team',      label: 'Team Change',             emoji: '\u{1F465}', desc: 'Staffing, reassignment, availability' }
];

// ── STATE ──
let state = { projects: [] };
let dashData = { completions: {}, subtasks: {}, status: {} };
let selectedPerson = localStorage.getItem('dash_selected_person') || null;
// The durable "this is me" identity — separate from whoever's dashboard is
// currently being viewed. Used to attribute notes/comments so browsing other
// people's dashboards never re-attributes work to them. See team.html notes.
let myPerson       = localStorage.getItem('dash_me') || null;
let selectedDate   = todayStr();
let searchFilter   = '';
let pendingAddSubtaskFor = null;

// ── LOOK BACK PANEL STATE (per-browser) ──
let lookbackYear   = new Date().getFullYear();
let lookbackPeriod = 'H1'; // Q1 Q2 H1 Q3 Q4 H2 FY
(function loadLookback() {
  try {
    const raw = localStorage.getItem('dash_lookback');
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s.year === 'number') lookbackYear = s.year;
      if (s && typeof s.period === 'string') lookbackPeriod = s.period;
    }
  } catch (_) {}
})();
function saveLookback() {
  localStorage.setItem('dash_lookback', JSON.stringify({ year: lookbackYear, period: lookbackPeriod }));
}

// ── DATA LOADING ──
function loadState() {
  try { const r = localStorage.getItem('prepro_data'); if (r) state = JSON.parse(r); } catch(e) {}
  if (!state || !state.projects) state = { projects: [] };
}
function loadDashData() {
  try { const r = localStorage.getItem('dash_data'); if (r) dashData = JSON.parse(r); } catch(e) {}
  if (!dashData) dashData = {};
  if (!dashData.completions) dashData.completions = {};
  if (!dashData.subtasks) dashData.subtasks = {};
  if (!dashData.status) dashData.status = {};
  if (!dashData.nextSteps) dashData.nextSteps = {};
}

// ── NAME HISTORY & PEOPLE EMAILS (synced via Firebase) ──
let nameHistory = {};
let peopleEmails = {};

function saveNameHistory() {
  if (!window._fb) return;
  const { db, ref, set } = window._fb;
  set(ref(db, 'prepro/nameHistory'), nameHistory).catch(err => console.error('saveNameHistory:', err));
}
function savePeopleEmails() {
  if (!window._fb) return;
  const { db, ref, set } = window._fb;
  set(ref(db, 'prepro/peopleEmails'), peopleEmails).catch(err => console.error('savePeopleEmails:', err));
}
function setPersonEmail(name, email) {
  const clean = (email || '').trim();
  if (clean) peopleEmails[name] = clean;
  else delete peopleEmails[name];
  savePeopleEmails();
}
function getPersonEmail(name) { return peopleEmails[name] || ''; }

window._dashReloadNameHistory = function(data) {
  if (data && typeof data === 'object') nameHistory = data;
  if (document.getElementById('settingsOverlay') && document.getElementById('settingsOverlay').style.display === 'flex') renderSettingsContent();
};
window._dashReloadPeopleEmails = function(data) {
  if (data && typeof data === 'object') peopleEmails = data;
  if (document.getElementById('settingsOverlay') && document.getElementById('settingsOverlay').style.display === 'flex') renderSettingsContent();
};

function collectAllPeople() {
  const people = {};
  const touch = (name, role) => {
    if (!name) return;
    if (!people[name]) people[name] = { name, email: peopleEmails[name] || '', roles: new Set() };
    if (role) people[name].roles.add(role);
  };
  Object.entries(nameHistory || {}).forEach(([role, names]) => (names || []).forEach(n => touch(n, role)));
  (state.projects || []).forEach(p => {
    const roster = p.roster || {};
    Object.entries(roster).forEach(([role, names]) => (names || []).forEach(n => touch(n, role)));
  });
  Object.keys(peopleEmails || {}).forEach(n => touch(n, null));
  // Records are their own source of people: someone added in team.html but not
  // yet placed on any project exists there and nowhere else.
  Object.entries(peopleRecords || {}).forEach(([n, rec]) => {
    touch(n, null);
    (rec.roles || []).forEach(r => people[n].roles.add(r));
    if (rec.email) people[n].email = rec.email;
  });
  return Object.values(people).sort((a,b) => a.name.localeCompare(b.name));
}

function deletePersonEverywhere(name) {
  Object.keys(nameHistory || {}).forEach(role => {
    nameHistory[role] = (nameHistory[role] || []).filter(n => n !== name);
  });
  (state.projects || []).forEach(p => {
    const roster = p.roster || {};
    Object.keys(roster).forEach(role => {
      roster[role] = (roster[role] || []).filter(n => n !== name);
    });
    (p.tasks || []).forEach(t => {
      if (t.person === name) t.person = '';
      if (Array.isArray(t.attendees)) t.attendees = t.attendees.filter(a => a.person !== name);
    });
  });
  delete peopleEmails[name];
  // The record half lives in people.js. Dash used to skip it, which left an
  // orphan in prepro/people that team.html read back and resurrected.
  deletePersonRecord(name);
  saveNameHistory();
  savePeopleEmails();
  saveState();
}

function mergePersonInto(from, into) {
  if (!from || !into || from === into) return;
  Object.keys(nameHistory || {}).forEach(role => {
    const list = nameHistory[role] || [];
    if (list.includes(from)) {
      nameHistory[role] = list.filter(n => n !== from);
      if (!nameHistory[role].includes(into)) nameHistory[role].push(into);
    }
  });
  (state.projects || []).forEach(p => {
    const roster = p.roster || {};
    Object.keys(roster).forEach(role => {
      const list = roster[role] || [];
      if (list.includes(from)) {
        roster[role] = list.filter(n => n !== from);
        if (!roster[role].includes(into)) roster[role].push(into);
      }
    });
    (p.tasks || []).forEach(t => {
      if (t.person === from) t.person = into;
      if (Array.isArray(t.attendees)) {
        t.attendees.forEach(a => { if (a.person === from) a.person = into; });
        const seen = new Set();
        t.attendees = t.attendees.filter(a => {
          const k = a.person + '|' + (a.role || '');
          if (seen.has(k)) return false;
          seen.add(k); return true;
        });
      }
    });
  });
  if (!peopleEmails[into] && peopleEmails[from]) peopleEmails[into] = peopleEmails[from];
  delete peopleEmails[from];
  // Folds the records and records the merged-away name as an alias, so the next
  // Pega import matches the survivor instead of re-creating the duplicate.
  mergePersonRecords(from, into);
  saveNameHistory();
  savePeopleEmails();
  saveState();
}

// ── SETTINGS MODAL ──
let settingsActiveTab = 'data';

function openSettings(tab) {
  settingsActiveTab = tab || 'data';
  document.querySelectorAll('.settings-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.settingsTab === settingsActiveTab);
  });
  document.getElementById('settingsOverlay').style.display = 'flex';
  renderSettingsContent();
}
function closeSettings() {
  document.getElementById('settingsOverlay').style.display = 'none';
}

function renderSettingsContent() {
  const c = document.getElementById('settingsContent');
  if (!c) return;
  c.innerHTML = '';
  if (settingsActiveTab === 'data') renderDataSettings(c);
  else if (settingsActiveTab === 'people') renderPeopleSettings(c);
}

function renderDataSettings(c) {
  const title = document.createElement('div');
  title.className = 'settings-section-title';
  title.textContent = 'Backup & Restore';
  c.appendChild(title);

  const actions = document.createElement('div');
  actions.className = 'data-actions';
  const expBtn = document.createElement('button');
  expBtn.className = 'settings-btn primary';
  expBtn.textContent = '⬇ Export Data';
  expBtn.addEventListener('click', doExportData);
  const impBtn = document.createElement('button');
  impBtn.className = 'settings-btn';
  impBtn.textContent = '⬆ Import Data';
  impBtn.addEventListener('click', () => {
    if (!confirm('Importing will merge projects from the file into your current data.\n\nProjects with the same ID will be overwritten. Continue?')) return;
    document.getElementById('importFileInput').click();
  });
  actions.appendChild(expBtn);
  actions.appendChild(impBtn);
  c.appendChild(actions);

  const hint = document.createElement('div');
  hint.className = 'settings-hint';
  hint.textContent = 'Export downloads a JSON backup of every project, name history, saved emails, and your dashboard data \u2014 ticked tasks, subtasks, statuses and next steps. Import merges projects by ID (overwrites duplicates) and adds new names, emails and dashboard entries without overwriting what is already here.';
  c.appendChild(hint);
}

function doExportData() {
  const payload = {
    version: 3,
    exported: new Date().toISOString(),
    prepro_data: JSON.stringify(state),
    prepro_name_history: JSON.stringify(nameHistory),
    prepro_people_emails: JSON.stringify(peopleEmails),
    // The dashboard overlay: completions, subtasks, statuses and next steps.
    // It lives outside `state` and so was absent from backups entirely — the
    // one copy was whatever Firebase and this browser happened to be holding.
    dash_data: JSON.stringify(dashData)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'prepro-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

/* Fold a backup's dashboard overlay into the live one. Deliberately additive
 * rather than a wholesale replace: this data is shared and per-person, so an
 * import must not silently drop what a colleague wrote since the backup.
 *
 * Completions and subtasks union. Status has no timestamp to arbitrate with, so
 * whatever is already here wins. Next steps do carry `updated`, so the newer
 * text wins whichever side it came from. */
function mergeDashData(incoming) {
  if (!incoming || typeof incoming !== 'object') return;

  Object.entries(incoming.completions || {}).forEach(([taskId, done]) => {
    if (done && !dashData.completions[taskId]) dashData.completions[taskId] = done;
  });

  Object.entries(incoming.subtasks || {}).forEach(([taskId, subs]) => {
    if (!Array.isArray(subs)) return;
    const mine = dashData.subtasks[taskId] || (dashData.subtasks[taskId] = []);
    const seen = new Set(mine.map(s => s && s.id));
    subs.forEach(s => { if (s && !seen.has(s.id)) { mine.push(s); seen.add(s.id); } });
  });

  Object.entries(incoming.status || {}).forEach(([person, byProject]) => {
    if (!byProject) return;
    if (!dashData.status[person]) dashData.status[person] = {};
    Object.entries(byProject).forEach(([projectId, val]) => {
      if (!dashData.status[person][projectId]) dashData.status[person][projectId] = val;
    });
  });

  if (!dashData.nextSteps) dashData.nextSteps = {};
  Object.entries(incoming.nextSteps || {}).forEach(([person, byProject]) => {
    if (!byProject) return;
    if (!dashData.nextSteps[person]) dashData.nextSteps[person] = {};
    Object.entries(byProject).forEach(([projectId, step]) => {
      if (!step || !step.text) return;
      const mine = dashData.nextSteps[person][projectId];
      if (!mine || (step.updated || '').localeCompare(mine.updated || '') > 0) {
        dashData.nextSteps[person][projectId] = step;
      }
    });
  });

  saveDashData();
}

function handleImportFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const payload = JSON.parse(e.target.result);
      const rawData    = payload.prepro_data    || (payload.projects ? JSON.stringify(payload) : null);
      const rawHistory = payload.prepro_name_history || null;
      const rawEmails  = payload.prepro_people_emails || null;
      const rawDash    = payload.dash_data || null; // absent in v2 and earlier backups
      if (!rawData) { alert('File doesn\'t look like a PRE-PRO backup.'); return; }

      const incoming = JSON.parse(rawData);
      if (!Array.isArray(incoming.projects)) { alert('No projects found in file.'); return; }

      const idMap = new Map((state.projects || []).map(p => [p.id, p]));
      incoming.projects.forEach(p => idMap.set(p.id, p));
      state.projects = [...idMap.values()];
      saveState();

      if (rawHistory) {
        try {
          const inHist = JSON.parse(rawHistory);
          Object.entries(inHist).forEach(([role, names]) => {
            if (!nameHistory[role]) nameHistory[role] = [];
            names.forEach(n => { if (!nameHistory[role].includes(n)) nameHistory[role].push(n); });
          });
          saveNameHistory();
        } catch(_) {}
      }
      if (rawEmails) {
        try {
          const inEmails = JSON.parse(rawEmails);
          Object.entries(inEmails).forEach(([name, email]) => {
            if (!peopleEmails[name]) peopleEmails[name] = email;
          });
          savePeopleEmails();
        } catch(_) {}
      }

      if (rawDash) {
        try { mergeDashData(JSON.parse(rawDash)); } catch(_) {}
      }

      renderAll();
      renderSettingsContent();
      alert('Import complete — ' + incoming.projects.length + ' project(s) merged successfully.');
    } catch(err) {
      alert('Failed to read file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function renderPeopleSettings(c) {
  const title = document.createElement('div');
  title.className = 'settings-section-title';
  title.textContent = 'People & Emails';
  c.appendChild(title);

  const hint = document.createElement('div');
  hint.className = 'settings-hint';
  hint.textContent = 'Add an email to any person to auto-fill the To: line when exporting meetings to Outlook. Deleting a person removes them from every project roster and unassigns their tasks. Merging moves all roles, rosters, and assignments from one person to another.';
  c.appendChild(hint);

  const people = collectAllPeople();
  if (!people.length) {
    const empty = document.createElement('div');
    empty.className = 'people-empty';
    empty.textContent = 'No people yet. Add one below.';
    c.appendChild(empty);
  } else {
    const list = document.createElement('div');
    list.className = 'people-list';
    people.forEach(p => {
      const row = document.createElement('div');
      row.className = 'people-row';

      const nm = document.createElement('div');
      nm.className = 'pname';
      nm.textContent = p.name;
      nm.title = p.name;
      row.appendChild(nm);

      const emailInput = document.createElement('input');
      emailInput.className = 'pemail';
      emailInput.type = 'email';
      emailInput.placeholder = 'email@example.com';
      emailInput.value = p.email;
      emailInput.addEventListener('blur', () => setPersonEmail(p.name, emailInput.value));
      emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') emailInput.blur(); });
      row.appendChild(emailInput);

      const rolesEl = document.createElement('div');
      rolesEl.className = 'proles';
      const rolesArr = Array.from(p.roles);
      rolesEl.textContent = rolesArr.length ? rolesArr.join(', ') : '—';
      rolesEl.title = rolesEl.textContent;
      row.appendChild(rolesEl);

      const del = document.createElement('button');
      del.className = 'pdel';
      del.textContent = '✕';
      del.title = 'Delete ' + p.name + ' everywhere';
      del.addEventListener('click', () => {
        if (!confirm('Delete "' + p.name + '" from every project roster, unassign their tasks, and remove their email?\n\nThis cannot be undone.')) return;
        deletePersonEverywhere(p.name);
        renderSettingsContent();
        renderAll();
      });
      row.appendChild(del);

      list.appendChild(row);
    });
    c.appendChild(list);
  }

  const addTitle = document.createElement('div');
  addTitle.className = 'settings-section-title';
  addTitle.style.marginTop = '18px';
  addTitle.textContent = 'Add Person';
  c.appendChild(addTitle);

  const addRow = document.createElement('div');
  addRow.className = 'people-add';
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.placeholder = 'Name';
  const emailInput = document.createElement('input');
  emailInput.type = 'email';
  emailInput.placeholder = 'email@example.com (optional)';
  const roleSel = document.createElement('select');
  const defaultOpt = document.createElement('option');
  defaultOpt.value = ''; defaultOpt.textContent = 'Role (optional)';
  roleSel.appendChild(defaultOpt);
  ROLE_CATS.flatMap(cat => cat.roles).filter(r => r !== 'Other').forEach(r => {
    const o = document.createElement('option');
    o.value = r; o.textContent = r;
    roleSel.appendChild(o);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'settings-btn primary';
  addBtn.textContent = '+ Add';
  addBtn.addEventListener('click', () => {
    const n = nameInput.value.trim();
    if (!n) { nameInput.focus(); return; }
    const role = roleSel.value;
    const targetRole = role || ROLE_CATS[0].roles[0];
    if (!nameHistory[targetRole]) nameHistory[targetRole] = [];
    if (!nameHistory[targetRole].includes(n)) nameHistory[targetRole].push(n);
    saveNameHistory();
    const em = emailInput.value.trim();
    if (em) { peopleEmails[n] = em; savePeopleEmails(); }
    nameInput.value = ''; emailInput.value = ''; roleSel.value = '';
    renderSettingsContent();
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); });
  emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); });
  addRow.appendChild(nameInput);
  addRow.appendChild(emailInput);
  addRow.appendChild(roleSel);
  addRow.appendChild(addBtn);
  c.appendChild(addRow);

  if (people.length >= 2) {
    const merge = document.createElement('div');
    merge.className = 'people-merge';
    const mt = document.createElement('div');
    mt.className = 'people-merge-title';
    mt.textContent = 'Merge Duplicates';
    merge.appendChild(mt);
    const mrow = document.createElement('div');
    mrow.className = 'people-merge-row';
    const fromSel = document.createElement('select');
    const intoSel = document.createElement('select');
    [fromSel, intoSel].forEach((sel, i) => {
      const def = document.createElement('option');
      def.value = ''; def.textContent = i === 0 ? 'Merge…' : 'into…';
      sel.appendChild(def);
      people.forEach(p => {
        const o = document.createElement('option');
        o.value = p.name; o.textContent = p.name;
        sel.appendChild(o);
      });
    });
    const arrow = document.createElement('span');
    arrow.className = 'people-merge-arrow';
    arrow.textContent = '→';
    const mbtn = document.createElement('button');
    mbtn.className = 'settings-btn';
    mbtn.textContent = 'Merge';
    mbtn.addEventListener('click', () => {
      const from = fromSel.value, into = intoSel.value;
      if (!from || !into) { alert('Choose both a source and a target person.'); return; }
      if (from === into) { alert('Source and target must be different.'); return; }
      if (!confirm('Merge "' + from + '" into "' + into + '"?\n\nAll roles, roster memberships, tasks, and attendee entries for "' + from + '" will be reassigned to "' + into + '".')) return;
      mergePersonInto(from, into);
      renderSettingsContent();
      renderAll();
    });
    mrow.appendChild(fromSel);
    mrow.appendChild(arrow);
    mrow.appendChild(intoSel);
    mrow.appendChild(mbtn);
    merge.appendChild(mrow);
    c.appendChild(merge);
  }
}

const LOE_CYCLE = ['low', 'medium', 'high'];
function cycleLoe(projectId, taskId) {
  const proj = (state.projects || []).find(p => p.id === projectId);
  if (!proj) return;
  const task = (proj.tasks || []).find(t => t.id === taskId);
  if (!task || task.isDueDate) return;
  const idx = LOE_CYCLE.indexOf(task.loe || 'low');
  task.loe = LOE_CYCLE[(idx + 1) % 3];
  saveState();
  renderAll();
}

// ── ADD NOTE (to project) ──
function addNoteToProject(projectId, type, body) {
  const proj = (state.projects || []).find(p => p.id === projectId);
  if (!proj) return;
  if (!proj.notes) proj.notes = [];
  const now = new Date();
  const noteType = NOTE_TYPES.find(t => t.key === type) || NOTE_TYPES[0];
  proj.notes.push({
    id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36),
    type: noteType.key,
    emoji: noteType.emoji,
    body: body,
    // Prefer the pinned "This is me" identity so notes logged while viewing
    // someone else's dashboard stay attributed to the real author.
    person: myPerson || selectedPerson || 'Team',
    date: fmtDate(now.getFullYear(), now.getMonth() + 1, now.getDate()),
    time: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0')
  });
  saveState();
}

// ── DATE UTILITIES ──
function fmtDate(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function todayStr() {
  const d = new Date();
  return fmtDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return fmtDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
function getWeekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return fmtDate(mon.getFullYear(), mon.getMonth() + 1, mon.getDate());
}
function fmtDateLong(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function fmtDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function isWeekend(dateStr) {
  const day = new Date(dateStr + 'T00:00:00').getDay();
  return day === 0 || day === 6;
}
function getNextBusinessDays(startDate, count) {
  const days = [];
  let cursor = addDays(startDate, 1);
  while (days.length < count) {
    if (!isWeekend(cursor)) days.push(cursor);
    cursor = addDays(cursor, 1);
  }
  return days;
}
// An unset LOE scores as Low, matching what the panel shows for a task that
// has never had one set. It used to score Medium, so a task the UI called
// Low was quietly counted as 2 points.
function loePts(loe) { return LOE_PTS[loe] || LOE_PTS.low; }

function workloadInfo(pts) {
  if (pts === 0)  return { label: '\u2014',       color: '#4a4a60' };
  if (pts < 1.5)  return { label: 'Light',       color: '#4cba6a' };
  if (pts < 2.5)  return { label: 'Manageable',  color: '#9ab84c' };
  if (pts < 3.5)  return { label: 'Busy',        color: '#e07b39' };
  if (pts < 4.5)  return { label: 'Very Busy',   color: '#c0394f' };
  return            { label: 'Overloaded',     color: '#8b1a2a' };
}

const INTERNAL_ROLES = new Set(ROLE_CATS[0].roles); // Producer, Editor, Animator

// ── ROLE COLOR LOOKUP ──
// Mirrors team.html's colorForRole: the team a role belongs to wins, so a
// Stakeholder reads teal here exactly as it does in Team, and the category
// table is only the fallback.
function getRoleColor(role) {
  const t = TEAMS.find(t => t.roles.includes(role));
  if (t) return t.color;
  const cat = ROLE_CATS.find(c => c.roles.includes(role));
  return cat ? cat.color : '#8080a0';
}

// ── ACTIVE-PROJECT PREDICATE ──
// Single source of truth for "should this project appear in the daily panels".
// Every panel routes through this so they can't drift apart. (Look Back is the
// deliberate exception — it filters only on !ghost so it can include completed
// projects.)
//
// onHold / cancelled / draft are checked because Team writes all three and Ops
// has always honoured them via isInactive. Dash only knew about `completed`, so
// a cancelled shoot or an unapproved draft still turned up in somebody's Today
// and Coming Up as though it were live work.
function isActiveProject(p) {
  return !p.completed && !p.onHold && !p.cancelled && !p.draft && !p.ghost;
}

// ── NON-WORK PROJECT PREDICATE ──
// PTO / Time Off / Holidays / Administrative are real projects in the data —
// they hold real tasks, real days and real effort, and they must keep feeding
// workload, PTO awareness and the Look Back totals. What they are NOT is
// something we ship, so they can never be "late", "at risk", or a row on a
// project-review surface. Only the review-facing panels add this filter;
// getAllPeople, getTasksForPerson, getDayWorkload and aggregateLookback
// deliberately leave it off.
//
// The stored flag wins so a project named "Admin Portal Launch" can opt back
// in; the name test is the fallback so this works on existing data with no
// migration. (Toggled from the project context menu in team.html.)
function isNonWorkProject(p) {
  if (!p) return false;
  if (typeof p.nonWork === 'boolean') return p.nonWork;
  const n = p.name || '';
  return /pto|time\s*off|holiday/i.test(n) || /administrative|\badmin\b/i.test(n);
}
// "A project we review" — active work, minus the non-work buckets.
function isReviewableProject(p) { return isActiveProject(p) && !isNonWorkProject(p); }

/* ── PERSON EXTRACTION & DEDUP ────────────────────────────────────────────────
 * Who has a dashboard, and what does it say they do.
 *
 * The person record is the source of who exists: everyone on the Video Team has
 * a dashboard whether or not they are assigned to anything this week. Projects
 * then supply membership on top of that.
 *
 * This used to work the other way round — you existed only if you were assigned,
 * and only if the assignment's `role` string was one of Producer/Editor/Animator.
 * Two things made that lose people:
 *
 *   - `attendee.role` is frequently not a job role at all. Dropping someone onto
 *     a red block writes the CHIP LABEL there ('Studio Work', 'Meeting',
 *     'Review'), and holiday auto-activation writes 'Holiday'. None of those
 *     matched, so meeting-and-shoot attendees were dropped: the project never
 *     joined their membership, so its milestones never reached Heads Up and it
 *     never appeared in My Projects. Ops and Team both key on `category`, which
 *     is what actually says "this is one of ours" — so we do too now.
 *   - Administrative and Team/Other Event are in no ROLE_CATS bucket, so admin
 *     work put nobody on a project, while getDayWorkload counted it the whole
 *     time. isAdminRole is the same test Ops uses.
 * ─────────────────────────────────────────────────────────────────────────── */

// Roles that mean "internal team work" beyond the three craft roles. Mirrors
// ops.html — these appear on real tasks but sit in no ROLE_CATS bucket.
const ADMIN_ROLES = ['administrative', 'team/other event'];
function isAdminRole(role) { return ADMIN_ROLES.includes((role || '').toLowerCase()); }

// Does this assignment count as internal-team work?
function isInternalRole(role) { return INTERNAL_ROLES.has(role) || isAdminRole(role); }
function isInternalAttendee(a) { return a.category === 'Internal Team' || isAdminRole(a.role); }

// The role to credit someone with for an assignment. Falls back to what their
// record says they do, so an attendee stored as 'Studio Work' still reads as
// 'Producer' in the sidebar instead of showing a chip label as a job title.
function creditRole(name, role) {
  if (isInternalRole(role)) return role;
  return personDefaultRole(name) || '';
}

// Video Team only. Someone with no record at all is allowed through on the
// strength of their assignment; someone whose record puts them on another team
// is not, so Brand Creative and vendors stay off the dashboard.
function hasDashboard(name) {
  const team = personTeam(name);
  return !team || team === 'video';
}

function getAllPeople() {
  const personMap = new Map(); // name -> { roles: Set, projects: Map<id, {name, roles}> }
  const today = todayStr();

  const ensure = name => {
    if (!personMap.has(name)) personMap.set(name, { roles: new Set(), projects: new Map() });
    return personMap.get(name);
  };
  const credit = (name, proj, role) => {
    if (!name || !hasDashboard(name)) return;
    const entry = ensure(name);
    const r = creditRole(name, role);
    if (r) entry.roles.add(r);
    if (!proj) return;
    if (!entry.projects.has(proj.id)) entry.projects.set(proj.id, { name: proj.name, roles: new Set(), id: proj.id });
    if (r) entry.projects.get(proj.id).roles.add(r);
  };

  // The roster of people, independent of what they happen to be booked on.
  Object.keys(peopleRecords || {}).forEach(name => {
    if (personTeam(name) !== 'video') return;
    const entry = ensure(name);
    const rec = getPerson(name) || {};
    (rec.roles || []).forEach(r => entry.roles.add(r));
    const dflt = personDefaultRole(name);
    if (dflt) entry.roles.add(dflt);
  });

  // Project membership.
  (state.projects || []).filter(isActiveProject).forEach(proj => {
    for (const [role, names] of Object.entries(proj.roster || {})) {
      if (!isInternalRole(role)) continue;
      (names || []).forEach(name => credit(name, proj, role));
    }

    (proj.tasks || []).forEach(t => {
      if (t.person && !t.isDueDate && isInternalRole(t.role)) credit(t.person, proj, t.role);
      (t.attendees || []).forEach(a => {
        if (!a.person || !isInternalAttendee(a)) return;
        credit(a.person, proj, a.role);
      });
    });
  });

  // Drop soft-removed and departed people. Dash never did this — it had no
  // sunset wiring at all — so people who had left kept appearing in the sidebar
  // and every panel that reads this map.
  //
  // Date-aware on purpose: isSunset flips as soon as a last day is recorded, so
  // filtering on it deleted people who are still here for another three weeks.
  [...personMap.keys()].forEach(name => { if (!personCapacityOn(name, today)) personMap.delete(name); });

  return personMap;
}

// ── TASK FILTERING ──
function getTasksForPerson(personName, dateStr) {
  const results = [];
  (state.projects || []).filter(isActiveProject).forEach(proj => {
    (proj.tasks || []).forEach(task => {
      const start = task.date;
      const end = task.endDate || task.date;
      if (!start || dateStr < start || dateStr > end) return;

      let isMatch = false;
      let matchRoles = [];

      // Direct assignment
      if (task.person === personName) {
        isMatch = true;
        if (task.role) matchRoles.push(task.role);
      }

      // Review/event attendee
      if (task.attendees) {
        task.attendees.forEach(a => {
          if (a.person === personName) {
            isMatch = true;
            matchRoles.push(a.role || 'Attendee');
          }
        });
      }

      // PTO / Holiday: match only explicit attendees. A taskName substring check
      // ("John PTO") produced false positives for short names — "Al" matched
      // "Alex PTO" and put Alex's time off on Al's dashboard. Ops fixed this in
      // isPersonPTO; Dash kept the old test until now.
      if (isTimeOffTask(task) && personOnTimeOff(task, personName)) isMatch = true;

      if (isMatch) {
        results.push({
          ...task,
          projectName: proj.name,
          projectId: proj.id,
          matchRoles: [...new Set(matchRoles)]
        });
      }
    });
  });
  return results;
}

// ── WORKLOAD FOR A DAY ──
function getDayWorkload(personName, dateStr) {
  let total = 0;
  (state.projects || []).filter(isActiveProject).forEach(proj => {
    (proj.tasks || []).forEach(task => {
      if (task.isDueDate) return;
      const start = task.date;
      const end = task.endDate || task.date;
      if (!start || dateStr < start || dateStr > end) return;

      let isMatch = false;
      if (task.person === personName) isMatch = true;
      if (task.attendees) {
        task.attendees.forEach(a => { if (a.person === personName) isMatch = true; });
      }
      if (isMatch) total += loePts(task.loe);
    });
  });
  return total;
}

// ── TIME OFF FOR A PERSON ──
// Scans every project, completed included: time off is a fact about the person,
// and a project closing doesn't put them back at their desk. Mirrors ops.html's
// isPersonPTO, which the workload views there have used for a while — Dash's
// two effort charts had no PTO awareness at all, so a multi-day task spanning
// somebody's holiday still drew them as Busy while they were on a beach.
function isPersonOff(person, dateStr) {
  if (!person) return false;
  for (const proj of (state.projects || [])) {
    for (const t of (proj.tasks || [])) {
      if (!isTimeOffTask(t)) continue;
      const end = t.endDate || t.date;
      if (!t.date || dateStr < t.date || dateStr > end) continue;
      if (personOnTimeOff(t, person)) return true;
    }
  }
  return false;
}

// ── MULTI-DAY INFO ──
function getMultiDayInfo(task, dateStr) {
  if (!task.endDate || task.endDate === task.date) return null;
  const start = new Date(task.date + 'T00:00:00');
  const end = new Date(task.endDate + 'T00:00:00');
  const current = new Date(dateStr + 'T00:00:00');
  const totalDays = Math.round((end - start) / 86400000) + 1;
  const currentDay = Math.round((current - start) / 86400000) + 1;
  return { currentDay, totalDays };
}

// ── SIDEBAR ──
function renderSidebar() {
  const peopleMap = getAllPeople();
  const list = document.getElementById('peopleList');
  list.innerHTML = '';

  const filter = searchFilter.toLowerCase();
  const sorted = [...peopleMap.entries()].sort((a, b) => a[0].localeCompare(b[0]));

  // If saved person no longer exists, clear selection
  if (selectedPerson && !peopleMap.has(selectedPerson)) {
    selectedPerson = null;
    localStorage.removeItem('dash_selected_person');
  }

  // If saved "me" no longer exists, clear it
  if (myPerson && !peopleMap.has(myPerson)) {
    myPerson = null;
    localStorage.removeItem('dash_me');
  }

  sorted.forEach(([name, info]) => {
    if (filter && !name.toLowerCase().includes(filter)) return;
    const el = document.createElement('div');
    const isMe = name === myPerson;
    el.className = 'dash-person' + (name === selectedPerson ? ' active' : '');
    const roles = [...info.roles].sort().join(', ');

    const info2 = document.createElement('div');
    info2.className = 'dash-person-info';
    info2.innerHTML = `<div class="dash-person-name">${esc(name)}${isMe ? ' <span class="me-badge">YOU</span>' : ''}</div><div class="dash-person-roles">${esc(roles)}</div>`;
    el.appendChild(info2);

    // "This is me" toggle — pins the durable identity used for note attribution.
    const meBtn = document.createElement('button');
    meBtn.className = 'dash-me-btn' + (isMe ? ' active' : '');
    meBtn.textContent = isMe ? '★' : '☆';
    meBtn.title = isMe ? 'This is you (click to unset)' : 'This is me';
    meBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isMe) {
        myPerson = null;
        localStorage.removeItem('dash_me');
      } else {
        myPerson = name;
        localStorage.setItem('dash_me', name);
      }
      // Panels key "(you)" off myPerson, so the whole dashboard repaints —
      // a sidebar-only redraw would leave the old marker on screen.
      renderAll();
    });
    el.appendChild(meBtn);

    el.addEventListener('click', () => {
      selectedPerson = name;
      localStorage.setItem('dash_selected_person', name);
      renderAll();
    });
    list.appendChild(el);
  });
}

// ══════════════════════════════════════════════════════════════════
// ── CUSTOMIZABLE PANEL SYSTEM ──
// Each dashboard section is a registered "panel" the user can drag to
// reorder, hide, and re-add. Layout persists per-browser in localStorage.
// New panels added to DASH_PANELS appear automatically.
// ══════════════════════════════════════════════════════════════════
const DASH_PANELS = [
  { id: 'effort',     label: 'Weekly Effort',    render: renderEffortBar },
  { id: 'today',      label: 'Today',            render: renderTodaySection },

const DASH_LAYOUT_KEY = 'dash_panel_layout';
let _dashPanelDrag = null;

function getDashLayout() {
  const all = DASH_PANELS.map(p => p.id);
  const raw = localStorage.getItem(DASH_LAYOUT_KEY);
  let saved = null;
  try { saved = raw ? JSON.parse(raw) : null; } catch (_) { saved = null; }
  const order = saved && Array.isArray(saved.order) ? saved.order.filter(id => all.includes(id)) : [];
  const hidden = new Set(saved && Array.isArray(saved.hidden) ? saved.hidden.filter(id => all.includes(id)) : []);
  // Any registry panel not present in the saved order is "new" to this browser
  // (first run, or a freshly shipped panel). Append it, honoring defaultHidden.
  all.forEach(id => {
    if (order.includes(id)) return;
    order.push(id);
    const def = dashPanelDef(id);
    if (def && def.defaultHidden) hidden.add(id);
  });
  return { order, hidden };
}
function saveDashLayout(layout) {
  localStorage.setItem(DASH_LAYOUT_KEY, JSON.stringify({ order: layout.order, hidden: [...layout.hidden] }));
}
function dashPanelDef(id) { return DASH_PANELS.find(p => p.id === id); }

function moveDashPanel(id, dir) {
  const layout = getDashLayout();
  const visible = layout.order.filter(x => !layout.hidden.has(x));
  const target = visible[visible.indexOf(id) + dir];
  if (target === undefined) return;
  const a = layout.order.indexOf(id), b = layout.order.indexOf(target);
  [layout.order[a], layout.order[b]] = [layout.order[b], layout.order[a]];
  saveDashLayout(layout);
  renderDashboard();
}
function reorderDashPanel(dragId, targetId, placeBelow) {
  if (dragId === targetId) return;
  const layout = getDashLayout();
  const order = layout.order.filter(x => x !== dragId);
  let idx = order.indexOf(targetId);
  if (placeBelow) idx += 1;
  order.splice(idx, 0, dragId);
  layout.order = order;
  saveDashLayout(layout);
  renderDashboard();
}
function hideDashPanel(id) { const l = getDashLayout(); l.hidden.add(id); saveDashLayout(l); renderDashboard(); }
function showDashPanel(id) {
  const l = getDashLayout();
  l.hidden.delete(id);
  // Straight to the top, under the Add Panel button you just pressed. Keeping
  // the slot it was hidden from put it wherever it happened to live before —
  // usually the bottom of a long dashboard, which is nowhere near the control.
  // Drag it back down if you want it somewhere else; that position then sticks.
  l.order = [id, ...l.order.filter(x => x !== id)];
  saveDashLayout(l);
  renderDashboard();
  flashPanel(id);
}

/* Scroll a freshly shown panel into view and ring it briefly. No-op when the
 * panel rendered nothing — a panel with no data for today isn't in the DOM. */
function flashPanel(id) {
  const el = document.querySelector('[data-panel-id="' + id + '"]');
  if (!el) return;
  // Guarded: this runs after the panel is already shown, so a host without
  // scrollIntoView should lose the scroll, not throw out of the click handler.
  if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  el.classList.add('just-added');
  setTimeout(() => el.classList.add('fading'), 900);
  setTimeout(() => el.classList.remove('just-added', 'fading'), 1400);
}

function mkDashPanelBtn(txt, title) {
  const b = document.createElement('button');
  b.className = 'op-panel-btn';
  b.textContent = txt;
  b.title = title;
  return b;
}

function wrapDashPanel(def, content, vi, count) {
  const panel = document.createElement('div');
  panel.className = 'op-panel';
  panel.dataset.panelId = def.id;

  const tools = document.createElement('div');
  tools.className = 'op-panel-tools';

  const handle = document.createElement('span');
  handle.className = 'op-panel-handle';
  handle.textContent = '⠿';
  handle.title = 'Drag to reorder';
  handle.draggable = true;
  tools.appendChild(handle);

  const up = mkDashPanelBtn('▲', 'Move up');
  up.disabled = vi === 0;
  up.addEventListener('click', () => moveDashPanel(def.id, -1));
  const down = mkDashPanelBtn('▼', 'Move down');
  down.disabled = vi === count - 1;
  down.addEventListener('click', () => moveDashPanel(def.id, 1));
  const hide = mkDashPanelBtn('✕', 'Hide panel');
  hide.addEventListener('click', () => hideDashPanel(def.id));
  tools.appendChild(up);
  tools.appendChild(down);
  tools.appendChild(hide);

  panel.appendChild(tools);
  panel.appendChild(content);

  handle.addEventListener('dragstart', e => {
    _dashPanelDrag = def.id;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', def.id); } catch (_) {}
    try { e.dataTransfer.setDragImage(panel, 24, 12); } catch (_) {}
    panel.classList.add('dragging');
  });
  handle.addEventListener('dragend', () => {
    panel.classList.remove('dragging', 'drag-over-above', 'drag-over-below');
    _dashPanelDrag = null;
  });
  panel.addEventListener('dragover', e => {
    if (_dashPanelDrag == null || _dashPanelDrag === def.id) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const r = panel.getBoundingClientRect();
    const below = (e.clientY - r.top) > r.height / 2;
    panel.classList.toggle('drag-over-below', below);
    panel.classList.toggle('drag-over-above', !below);
  });
  panel.addEventListener('dragleave', e => {
    if (e.target === panel) panel.classList.remove('drag-over-above', 'drag-over-below');
  });
  panel.addEventListener('drop', e => {
    if (_dashPanelDrag == null || _dashPanelDrag === def.id) return;
    e.preventDefault();
    const below = panel.classList.contains('drag-over-below');
    panel.classList.remove('drag-over-above', 'drag-over-below');
    reorderDashPanel(_dashPanelDrag, def.id, below);
  });

  return panel;
}

function renderDashboard() {
  const main = document.getElementById('dashMain');

  if (!selectedPerson) {

    empty.style.display = 'flex';

  });
}

// ── TODAY SECTION ──
// ── SEQUENCE-AWARE SUGGESTIONS ──
// For a given task today, detect a concrete "what's next" pattern and emit
// a one-sentence question. Always a question (not instruction) to keep
// confidence low and trust high. Silent rather than generic.
function daysBetween(dateA, dateB) {
  if (!dateA || !dateB) return null;
  const a = new Date(dateA + 'T00:00:00');
  const b = new Date(dateB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function fmtDayShort(dateStr, today) {
  const n = daysBetween(today, dateStr);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 0 && n <= 7) return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long' });
  if (n < 0 && n >= -7) return 'last ' + new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long' });
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function buildTaskContext(task, personName, dateStr, proj) {
  const today = dateStr;
  const isForPerson = t => t.person === personName
    || (t.attendees || []).some(a => a.person === personName);
  const isPTOForPerson = t => isTimeOffTask(t) && personOnTimeOff(t, personName);

  const allTasks = (proj.tasks || []).filter(t => t.id !== task.id);
  const past = allTasks.filter(t => t.date && t.date < today).sort((a,b) => b.date.localeCompare(a.date));
  const future = allTasks.filter(t => t.date && t.date > today).sort((a,b) => a.date.localeCompare(b.date));

  const prev = past.find(isForPerson);
  const next = future.find(t => !t.isReview && !t.isDueDate);
  const nextReview = future.find(t => t.isReview && daysBetween(today, t.date) <= 7);
  const nextShoot = future.find(t => {
    const lbl = (t.reviewLabel || '').toLowerCase();
    return lbl.includes('shoot') && daysBetween(today, t.date) <= 7;
  });
  const nextKeyDate = future.find(t => {
    if (!t.isDueDate || isTimeOffTask(t)) return false;
    return daysBetween(today, t.date) <= 7;
  });
  const personPTO = future.find(t => isPTOForPerson(t) && daysBetween(today, t.date) <= 5);

  const recentNotes = (proj.notes || []).filter(n => {
    if (!n || !n.date) return false;
    if (!['delay','blocker','direction','feedback'].includes(n.type)) return false;
    const d = daysBetween(n.date, today);
    return d !== null && d >= 0 && d <= 7;
  }).sort((a,b) => b.date.localeCompare(a.date));

  const lastTouched = prev ? daysBetween(prev.date, today) : null;

  const pastIncomplete = past.filter(t => isForPerson(t) && !isTaskDone(t.id) && !t.isDueDate).length;

  return { prev, next, nextReview, nextShoot, nextKeyDate, personPTO, recentNotes, lastTouched, pastIncomplete };
}

function findHeavyReviewer(reviewTask) {
  const attendees = reviewTask.attendees || [];
  for (const a of attendees) {
    if (!a.person) continue;
    const pts = getDayWorkload(a.person, reviewTask.date);
    if (pts >= 4) return a.person;
  }
  return null;
}

function patternPTOHandoff(task, personName, dateStr, proj, ctx) {
  if (!ctx.personPTO || !ctx.next) return null;
  if (daysBetween(dateStr, ctx.personPTO.date) > 3) return null;
  if (!ctx.next.person || ctx.next.person === personName) return null;
  if (ctx.next.date < ctx.personPTO.date) return null;
  const ptoDay = fmtDayShort(ctx.personPTO.date, dateStr);
  const nextDay = fmtDayShort(ctx.next.date, dateStr);
  const nextName = ctx.next.taskName || ctx.next.role || 'the next task';
  return `You're out ${ptoDay}. ${ctx.next.person} picks up ${nextName} ${nextDay} — drop them a note before you sign off?`;
}

function patternShootApproaching(task, personName, dateStr, proj, ctx) {
  if (!ctx.nextShoot) return null;
  const n = daysBetween(dateStr, ctx.nextShoot.date);
  if (n > 3) return null;
  const lbl = (ctx.nextShoot.reviewLabel || '').toLowerCase();
  const shootType = lbl.includes('on-location') ? 'On-location shoot' : 'Studio shoot';
  const day = fmtDayShort(ctx.nextShoot.date, dateStr);
  return `${shootType} ${day} — has the shotlist and call sheet gone out to the crew?`;
}

function patternKeyDateApproaching(task, personName, dateStr, proj, ctx) {
  if (!ctx.nextKeyDate) return null;
  if (daysBetween(dateStr, ctx.nextKeyDate.date) > 3) return null;
  const type = ctx.nextKeyDate.milestoneType;
  const label = type === 'due-date' ? 'Project due' : milestoneLabel(type);
  const day = fmtDayShort(ctx.nextKeyDate.date, dateStr);
  return `${label} lands ${day} — is today's work on the critical path?`;
}

function patternReviewApproaching(task, personName, dateStr, proj, ctx) {
  if (!ctx.nextReview) return null;
  if (daysBetween(dateStr, ctx.nextReview.date) > 3) return null;
  const day = fmtDayShort(ctx.nextReview.date, dateStr);
  const reviewLabel = ctx.nextReview.reviewLabel || 'Review';
  const heavy = findHeavyReviewer(ctx.nextReview);
  if (heavy && heavy !== personName) {
    return `${reviewLabel} ${day}. ${heavy} has a heavy load that day — send early if you can?`;
  }
  return `${reviewLabel} ${day} — is today's draft the version you want stakeholders seeing?`;
}

function patternHandoffToNext(task, personName, dateStr, proj, ctx) {
  if (!ctx.next) return null;
  if (!ctx.next.person || ctx.next.person === personName) return null;
  const taskEnd = task.endDate || task.date;
  const gap = daysBetween(taskEnd, ctx.next.date);
  if (gap === null || gap > 2) return null;
  const day = fmtDayShort(ctx.next.date, dateStr);
  const nextName = ctx.next.taskName || ctx.next.role || 'their work';
  return `${ctx.next.person} starts ${nextName} ${day} — anything they should know before diving in?`;
}

function patternRecentNote(task, personName, dateStr, proj, ctx) {
  if (!ctx.recentNotes.length) return null;
  const note = ctx.recentNotes[0];
  const daysAgo = daysBetween(note.date, dateStr);
  if (daysAgo > 3) return null;
  const typeLabel = { delay: 'delay', blocker: 'blocker', direction: 'scope change', feedback: 'feedback' }[note.type] || note.type;
  const emoji = note.emoji || '📋';
  const author = note.person || 'Someone';
  const when = daysAgo === 0 ? 'today' : daysAgo === 1 ? 'yesterday' : `${daysAgo} days ago`;
  return `${emoji} ${author} flagged a ${typeLabel} ${when} — does today's task still fit?`;
}

function patternDrought(task, personName, dateStr, proj, ctx) {
  if (ctx.lastTouched == null) return null;
  if (ctx.lastTouched <= 14) return null;
  const weeks = Math.round(ctx.lastTouched / 7);
  return `First time back on ${proj.name} in ${weeks} week${weeks === 1 ? '' : 's'} — worth a quick resync with the producer before starting?`;
}

function patternStalledCluster(task, personName, dateStr, proj, ctx) {
  if (ctx.pastIncomplete < 3) return null;
  return `${ctx.pastIncomplete} tasks on ${proj.name} are past their scheduled date — re-scope any today?`;
}

function getTaskSuggestion(task, personName, dateStr) {
  if (!task || !personName || !dateStr) return null;
  if (task.isDueDate) return null; // don't suggest on PTO/milestones/due dates themselves
  if (isTaskDone(task.id)) return null;
  const proj = (state.projects || []).find(p => p.id === task.projectId);
  if (!proj) return null;

  const ctx = buildTaskContext(task, personName, dateStr, proj);

  const patterns = [
    patternPTOHandoff,
    patternShootApproaching,
    patternKeyDateApproaching,
    patternReviewApproaching,
    patternHandoffToNext,
    patternRecentNote,
    patternDrought,
    patternStalledCluster,
  ];
  for (const p of patterns) {
    const text = p(task, personName, dateStr, proj, ctx);
    if (text) return text;
  }
  return null;
}

function renderTodaySection() {
  const section = document.createElement('div');
  section.className = 'today-hero';

  const title = document.createElement('div');
  title.className = 'today-date-heading';
  title.textContent = fmtDateLong(selectedDate);
  section.appendChild(title);

  const tasks = getTasksForPerson(selectedPerson, selectedDate);

  if (!tasks.length) {
