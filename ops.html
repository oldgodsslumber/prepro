// ── TRELLO CATEGORY LOGIC (mirrors index.html) ──
const PW_PRE = [
  'script','scripting','scripts','storyboard','storyboarding','storyboards',
  'schedules','schedule','copywriting','copywrite','copyediting','copyedit',
  'meeting','brief','concept','concepting','conceptual','planning','prep',
  'pre-production','writing','write','design','designing','discovery',
  'brainstorm','brainstorming','location scouting','location scout','scouting',
  'scout','shotlist','shot list','shot-list','treatment','outline','research',
  'interview','kickoff','kick-off','kick off','casting','cast',
  'voice over','voice-over','voiceover','voice talent','voice artist','voice actor',
  'vo session','vo direction','vendor billing','vendor prep','vendor payment',
  'procurement','vendor onboard','vendor brief',
  'illustration','illustrate','illustrating','illustrations'
];
const PW_POST = [
  'animation','edit','editing','motion','vfx','visual effects',
  'drafting','v1','v2','vf','revision','revisions','revise',
  'post','post-production','color','colour','grade','color correct','colour correct',
  'mix','audio mix','sound mix','sound design',
  'delivery','deliverable','feedback','approval','sign-off','sign off'
];

function getProducerCat(name) {
  const n = (name || '').toLowerCase();
  if (PW_PRE.some(k => n.includes(k))) return 'Pre-Production';
  if (PW_POST.some(k => n.includes(k))) return 'Post-Producing';
  return 'Producing';
}

// Map a role name (+ task name for producers) to an ops category.
// Administrative / Team-Event roles are internal team work — they get their own
// category so they surface in the Gantt, workload, and breakdowns.
const ADMIN_ROLES = ['administrative', 'team/other event'];
function isAdminRole(role) { return ADMIN_ROLES.includes((role || '').toLowerCase()); }

function getRoleCat(role, taskName) {
  const r = (role || '').toLowerCase();
  if (r === 'editor')   return 'Editing';
  if (r === 'animator') return 'Animation';
  if (r === 'producer') return getProducerCat(taskName);
  if (isAdminRole(r))   return 'Administrative';
  return null;
}

function getTaskCat(task) {
  if (task.isReview) {
    if (SHOOT_LABELS.includes(task.reviewLabel)) return 'Production';
    return getProducerCat(task.taskName);
  }
  return getRoleCat(task.role, task.taskName);
}

// Default label for an un-named task — mirrors Team, where an empty name shows
// the role's general verb (Producer → "Producing") rather than a placeholder.
const ROLE_VERB = { 'Producer': 'Producing', 'Editor': 'Editing', 'Animator': 'Animating', 'Copywriter': 'Copywriting', 'Designer': 'Designing', 'Stakeholder': 'Reviewing', 'External Vendor': 'Vendor Work', 'Other': 'Working', 'Administrative': 'Administrative', 'Team/Other Event': 'Team Event' };
function roleVerb(role) { return ROLE_VERB[role] || role || 'Task'; }

// Display title for a task, falling back to the same defaults Team uses when no
// custom name was entered (role verb for work tasks, review/milestone labels else).
function opsTaskTitle(task) {
  if (!task) return 'Task';
  if (task.taskName) return task.taskName;
  if (task.isReview) return task.reviewLabel || 'Review';
  if (task.isDueDate) return milestoneLabel(task.milestoneType);
  return roleVerb(task.role);
}

// ── COLLECT ALL OPS TASKS ──
// Returns flat list of { date, endDate, person, role, cat, taskName, loe, color, projectName }
//
// opts.includeInactive keeps completed / on-hold / cancelled / draft projects in
// the list. The scheduling surfaces want them gone — you can't act on a finished
// project — but the effort charts are a record of work that actually happened,
// and dropping a project the day it ships rewrites their history. Only the
// effort path passes this; see getEffortEntries.
function getOpsEntries(opts) {
  const includeInactive = !!(opts && opts.includeInactive);
  const entries = [];
  (state.projects || []).filter(p => (includeInactive || !isInactive(p)) && !p.ghost).forEach(proj => {
    (proj.tasks || []).forEach(task => {
      if (task.isDueDate) return;
      const loe = task.loe || 'low';
      if (task.isReview) {
        const cat = getTaskCat(task);
        const color = CAT_COLORS[cat] || '#6c63ff';
        // Studio-ness rides on the review label, not the category: only the two
        // shoot labels map to Production, so "Studio Work" would otherwise fall
        // into whatever getProducerCat makes of its name and vanish from a
        // studio-focused view. See lensesOf.
        const isStudio = isStudioLabel(task.reviewLabel);
        // Iterate the FULL attendees array so attIdx is the real index into
        // task.attendees. Drag-reassign writes back by this index, so using a
        // filtered index would corrupt the wrong attendee when an external
        // attendee precedes an internal one.
        (task.attendees || []).forEach((att, attIdx) => {
          if (att.category !== 'Internal Team') return;
          entries.push({ date: task.date, endDate: task.endDate || task.date, person: att.person || att.role, role: att.role, unassigned: !att.person, cat, taskName: task.taskName || task.reviewLabel || 'Review', loe, color, projectName: proj.name, projectId: proj.id, taskId: task.id, isReview: true, attIdx, reviewLabel: task.reviewLabel || '', isStudio });
        });
        return;
      }
      // Everyone on a role task is an attendee now; the legacy single
      // task.person/role is kept for back-compat. Emit one entry per person.
      const roster = [];
      if (task.person) roster.push({ person: task.person, role: task.role, category: task.roleCategory, isPrimary: true });
      (task.attendees || []).forEach((a, i) => roster.push({ person: a.person, role: a.role, category: a.category, attIdx: i }));
      const rosterSeen = new Set();
      roster.forEach(p => {
        if (p.category !== 'Internal Team' && !isAdminRole(p.role)) return;
        if (p.person) { if (rosterSeen.has(p.person)) return; rosterSeen.add(p.person); }
        const cat = getRoleCat(p.role, task.taskName);
        if (!cat) return;
        const color = CAT_COLORS[cat] || '#6c63ff';
        entries.push({ date: task.date, endDate: task.endDate || task.date, person: p.person || p.role, role: p.role, unassigned: !p.person, cat, taskName: task.taskName || roleVerb(p.role), loe, color, projectName: proj.name, projectId: proj.id, taskId: task.id, isPrimary: p.isPrimary || false, attIdx: p.attIdx });
      });
    });
  });
  return entries;
}

// Per-person PTO periods, sourced from PTO milestones' attendees.
// Returned as timeline-shaped entries (date/endDate/person) flagged isPTO.
function getPtoEntries() {
  const out = [];
  (state.projects || []).filter(p => !isInactive(p) && !p.ghost).forEach(proj => {
    (proj.tasks || []).forEach(t => {
      if (!isTimeOffTask(t)) return;
      const end = t.endDate || t.date;
      (t.attendees || []).forEach(a => {
        if (!a.person || !personCapacityOn(a.person, todayStr())) return;
        out.push({ person: a.person, date: t.date, endDate: end, projectName: proj.name, isPTO: true });
      });
    });
  });
  return out;
}

// ── STUDIO BLOCKS ──
// Studio Shoots / On-Location Shoots / "Studio Work" (set builds, strikes,
// maintenance) are review-type tasks, so getOpsEntries only emits them once
// they carry an Internal Team attendee with a name. Studio Work blocks are
// created with an empty attendee list and usually never get crew, so the
// studio's own booked time never reached the Gantt at all — the Studio
// Calendar only escapes this by rendering straight from getStudioShoots().
//
// Returned timeline-shaped (same shape as getPtoEntries) and rendered on one
// "Studio" resource row. Blocks that DO have named internal crew are left out:
// those already draw on each crew member's row, and repeating them here would
// double-count the same booking.
const STUDIO_ROW = 'Studio';
function getStudioBlockEntries() {
  const out = [];
  const today = todayStr();
  (state.projects || []).filter(p => !isInactive(p) && !p.ghost).forEach(proj => {
    (proj.tasks || []).forEach(task => {
      if (!task.isReview || !isStudioLabel(task.reviewLabel)) return;
      const onSomeonesRow = (task.attendees || []).some(a =>
        a.category === 'Internal Team' && a.person && personCapacityOn(a.person, today));
      if (onSomeonesRow) return;
      const cat = getTaskCat(task);
      out.push({
        person: STUDIO_ROW, date: task.date, endDate: task.endDate || task.date,
        cat, color: CAT_COLORS[cat] || '#c0394f', loe: task.loe || 'low',
        taskName: task.taskName || task.reviewLabel || 'Studio',
        projectName: proj.name, projectId: proj.id, taskId: task.id,
        reviewLabel: task.reviewLabel || '', isStudio: true,
        isStudioBlock: true
      });
    });
  });
  return out;
}

// ── PEOPLE LIST ──
function getAllPeople() {
  const people = new Set();
  const today = todayStr();
  getOpsEntries().forEach(e => { if (e.person && personCapacityOn(e.person, today)) people.add(e.person); });
  const alpha = [...people].sort();
  if (!personOrder.length) return alpha;
  // Saved order first (only those still present), then any new people alphabetically
  const ordered = personOrder.filter(p => people.has(p));
  const rest = alpha.filter(p => !personOrder.includes(p));
  return [...ordered, ...rest];
}
// Same as getAllPeople but also surfaces people who only appear on PTO (no work
// entries). The timeline renders and reorders from THIS list so PTO-only rows
// are reorderable too.
function getTimelinePeople() {
  const people = new Set();
  const today = todayStr();
  getOpsEntries().forEach(e => { if (e.person && personCapacityOn(e.person, today)) people.add(e.person); });
  getPtoEntries().forEach(e => { if (e.person && personCapacityOn(e.person, today)) people.add(e.person); });
  // The studio is a resource, not a person, so it only exists on this list —
  // getAllPeople (workload, pickers, breakdowns) deliberately never sees it.
  if (getStudioBlockEntries().length) people.add(STUDIO_ROW);
  const alpha = [...people].sort();
  if (!personOrder.length) return alpha;
  const ordered = personOrder.filter(p => people.has(p));
  const rest = alpha.filter(p => !personOrder.includes(p));
  return [...ordered, ...rest];
}
function savePersonOrder(arr) {
  personOrder = arr;
  try { localStorage.setItem('ops_person_order', JSON.stringify(arr)); } catch(_) {}
}
function movePerson(person, dir) {
  const current = getTimelinePeople();
  const idx = current.indexOf(person);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= current.length) return;
  current.splice(idx, 1);
  current.splice(newIdx, 0, person);
  savePersonOrder(current);
  renderTimeline();
}

// ── WORKLOAD ──
// An unset LOE scores as Low, matching what the panel shows for a task that
// has never had one set. It used to score Medium, so a task the UI called
// Low was quietly counted as 2 points.
function loePts(loe) { return LOE_PTS[loe] || LOE_PTS.low; }

// Returns the total effort score for a single day
function getDayWorkload(person, dateStr) {
  // Someone who had left by this date isn't capacity, however their old tasks
  // still read in the stored schedule.
  if (!personActiveOn(person, dateStr)) return 0;
  let total = 0;
  getOpsEntries().forEach(e => {
    if (e.person !== person) return;
    if (dateStr >= e.date && dateStr <= e.endDate) total += loePts(e.loe);
  });
  return total;
}

// Check if a person has PTO or a holiday on a given date. Deliberately scans
// EVERY project, completed included: time off is a fact about the person, and a
// project closing doesn't put them back at their desk.
function isPersonPTO(person, dateStr) {
  const lowerPerson = person.toLowerCase();
  for (const proj of (state.projects || [])) {
    for (const t of (proj.tasks || [])) {
      if (!isTimeOffTask(t)) continue;
      const end = t.endDate || t.date;
      if (dateStr < t.date || dateStr > end) continue;
      // Match only explicit attendees. A taskName substring check ("John PTO")
      // produced false positives for short names (e.g. "Al" matched "Alex PTO").
      if ((t.attendees || []).some(a => a.person && a.person.toLowerCase() === lowerPerson)) return true;
    }
  }
  return false;
}

// Returns the average daily score across the weekdays in a Mon–Sun window, excluding PTO days
function getAvgWorkload(person, weekMonday) {
  const entries = getOpsEntries().filter(e => e.person === person);
  if (!entries.length) return 0;
  let total = 0;
  let workDays = 0;
  for (let i = 0; i < 5; i++) {
    const ds = addDays(weekMonday, i);
    if (isPersonPTO(person, ds)) continue;
    // Days after someone left are not workdays. Counting them would divide their
    // real work across empty days and report them as lightly loaded rather than
    // gone.
    if (!personActiveOn(person, ds)) continue;
    workDays++;
    entries.forEach(e => { if (ds >= e.date && ds <= e.endDate) total += loePts(e.loe); });
  }
  if (workDays === 0) return 0;
  return Math.round((total / workDays) * 10) / 10;
}

function workloadInfo(pts) {
  if (pts === 0)  return { label: '—',          color: '#4a4a60', emoji: '' };
  if (pts < 1.5)  return { label: 'Light',       color: '#4cba6a', emoji: '🟢' };
  if (pts < 2.5)  return { label: 'Manageable',  color: '#9ab84c', emoji: '🟡' };
  if (pts < 3.5)  return { label: 'Busy',        color: '#e07b39', emoji: '🟠' };
  if (pts < 4.5)  return { label: 'Very Busy',   color: '#c0394f', emoji: '🔴' };
  return            { label: 'Overloaded',     color: '#8b1a2a', emoji: '🚨' };
}

function fmtDate(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function getWeekStart(dateStr) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  const day = d.getDay(); // 0=Sun
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return fmtDate(mon.getFullYear(), mon.getMonth() + 1, mon.getDate());
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return fmtDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
}

function todayStr() {
  const d = new Date();
  return fmtDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
}

// ── FILTER CHIPS ──
function renderFilterChips() {
  const container = document.getElementById('filterChips');
  container.innerHTML = '';
  const people = getAllPeople();
  if (!people.length) { container.textContent = 'No internal team members found.'; return; }

  // Collect person → color from their most common category
  const personColors = {};
  getOpsEntries().forEach(e => { if (e.person && !personColors[e.person]) personColors[e.person] = e.color; });

  people.forEach(person => {
    const chip = document.createElement('div');
    chip.className = 'ops-person-chip' + (hiddenPeople.has(person) ? ' off' : '');
    const dot = document.createElement('span');
    dot.className = 'chip-dot';
    dot.style.background = personColors[person] || '#6c63ff';
    const lbl = document.createElement('span');
    lbl.textContent = person;
    chip.appendChild(dot);
    chip.appendChild(lbl);
    chip.addEventListener('click', () => {
      if (hiddenPeople.has(person)) hiddenPeople.delete(person);
      else hiddenPeople.add(person);
      renderFilterChips();
      if (viewMode === 'person') renderTimeline();
      else if (viewMode === 'studio') renderStudio();
      else if (viewMode === 'headsup') renderHeadsUp();
      else if (viewMode === 'metrics') renderMetrics();
    });
    container.appendChild(chip);
  });
}

// ── CHIP BUILDER (shared by calendar + person view) ──
// Three letters each, matching team.html's ROLE_ABBR where the concepts line up
// (Producing→PRD like Producer, Editing→EDT like Editor, Animation→ANM).
const SHORT_CAT = { 'Pre-Production':'PRE','Producing':'PRD','Post-Producing':'PST','Editing':'EDT','Animation':'ANM','Production':'SHT','Administrative':'ADM' };

/* -- LENS FILTER + LEGEND ----------------------------------------------------
 * LENSES is the legend's content AND the filter's domain -- one list, so a new
 * category can never show up as a colour with no explanation, or as an
 * explanation you cannot filter by.
 *
 * `why` is the actual rule from getRoleCat / getProducerCat, not a paraphrase.
 * The producer categories are decided by keyword-matching the TASK NAME, which
 * is the single most surprising thing about this palette, so it says so.
 * -------------------------------------------------------------------------- */
const LENSES = [
  { key: 'Pre-Production', why: 'Producer task whose name matches a pre keyword \u2014 script, storyboard, brief, concept, planning, casting, VO, scouting\u2026' },
  { key: 'Producing',      why: 'Producer task matching neither keyword list. The catch-all, so an unnamed producer task lands here.' },
  { key: 'Post-Producing', why: 'Producer task whose name matches a post keyword \u2014 edit, motion, vfx, v1/v2, revision, colour, mix, delivery, approval\u2026' },
  { key: 'Editing',        why: 'Anyone working the Editor role. Never depends on the task name.' },
  { key: 'Animation',      why: 'Anyone working the Animator role. Never depends on the task name.' },
  { key: 'Production',     why: 'A Studio Shoot or On-Location Shoot.' },
  { key: 'Administrative', why: 'Administrative or Team/Other Event role.' },
  { key: 'Studio',         label: 'Studio (any)', color: CAT_COLORS['Production'], abbr: 'STU',
    why: 'Cuts across the colours above: every shoot plus Studio Work, including studio blocks with no crew booked. Studio Work is not a shoot label, so it is usually coloured Producing.' }
];
function lensLabel(l) { return l.label || l.key; }
function lensColor(l) { return l.color || CAT_COLORS[l.key] || '#6c63ff'; }
function lensAbbr(l)  { return l.abbr  || SHORT_CAT[l.key] || ''; }

// Every lens an entry answers to. Studio is additive -- a shoot is both
// Production and Studio, so filtering by either one finds it.
function lensesOf(entry) {
  const out = entry.cat ? [entry.cat] : [];
  if (entry.isStudio || entry.isStudioBlock) out.push('Studio');
  return out;
}
// Empty filter means unfiltered. PTO is never tested: it stays visible on every
// row that survives, because it is the reason a filtered lane looks empty.
function passesLens(entry) {
  if (!tlLens.size) return true;
  return lensesOf(entry).some(l => tlLens.has(l));
}

function setLens(keys) {
  tlLens = new Set(keys);
  saveLens();
  renderLegend();
  syncLegendBtn();
  if (viewMode === 'person') renderTimeline();
}
function toggleLens(key) {
  const next = new Set(tlLens);
  if (next.has(key)) next.delete(key); else next.add(key);
  setLens(next);
}

// ── TIMELINE HELPERS ──
function daysBetweenDates(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}

function resetTlRange() {
  const today = todayStr();
  const mon = getWeekStart(today);
  const before = new Date(mon + 'T00:00:00');
  before.setDate(before.getDate() - TL_WEEKS_INIT * 7);
  tlStart = fmtDate(before.getFullYear(), before.getMonth() + 1, before.getDate());
  const after = new Date(mon + 'T00:00:00');
  after.setDate(after.getDate() + TL_WEEKS_INIT * 7);
  tlEnd = fmtDate(after.getFullYear(), after.getMonth() + 1, after.getDate());
}

// Greedy lane assignment: pack tasks into horizontal swim lanes without overlap
function assignLanes(entries) {
  const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date));
  const laneEnds = []; // end date of last task assigned to each lane
  return sorted.map(entry => {
    const end = entry.endDate || entry.date;
    let lane = laneEnds.findIndex(le => le < entry.date);
    if (lane === -1) { lane = laneEnds.length; laneEnds.push(end); }
    else laneEnds[lane] = end;
    return { ...entry, lane };
  });
}

// Build the ordered array of visible dates and the date→col map
function buildTlDates() {
  tlDates = [];
  let d = new Date(tlStart + 'T00:00:00');
  const end = new Date(tlEnd + 'T00:00:00');
  while (d <= end) {
    const dow = d.getDay();
    if (showWeekends || (dow !== 0 && dow !== 6)) {
      tlDates.push(fmtDate(d.getFullYear(), d.getMonth() + 1, d.getDate()));
    }
    d.setDate(d.getDate() + 1);
  }
  tlDateMap = new Map(tlDates.map((ds, i) => [ds, i]));
}

// Find the nearest visible column index for a date (snaps toward center if hidden)
function nearestCol(dateStr, snapForward) {
  if (tlDateMap.has(dateStr)) return tlDateMap.get(dateStr);
  const d = new Date(dateStr + 'T00:00:00');
  for (let i = 1; i <= 3; i++) {
    d.setDate(d.getDate() + (snapForward ? 1 : -1));
    const ds = fmtDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
    if (tlDateMap.has(ds)) return tlDateMap.get(ds);
  }
  return null;
}

function updateZoomButtons() {
  const idx = TL_ZOOM_STEPS.indexOf(tlColW);
  document.getElementById('zoomOutBtn').disabled = idx <= 0;
  document.getElementById('zoomInBtn').disabled  = idx >= TL_ZOOM_STEPS.length - 1;
  document.getElementById('zoomLabel').textContent = tlColW + 'px';
}

// ── TIMELINE DRAG (move + reassign) ──
function colToDate(col) {
  if (col < 0) col = 0;
  if (col >= tlDates.length) col = tlDates.length - 1;
  return tlDates[col] || null;
}

function findTask(projectId, taskId) {
  const proj = state.projects.find(p => p.id === projectId);
  if (!proj) return null;
  const task = proj.tasks.find(t => t.id === taskId);
  return task ? { proj, task } : null;
}

function getPersonRowAtY(y) {
  const rows = document.querySelectorAll('.tl-person-row');
  for (const row of rows) {
    const rect = row.getBoundingClientRect();
    if (y >= rect.top && y <= rect.bottom) {
      const nameEl = row.querySelector('.tl-row-name-text');
      return nameEl ? nameEl.textContent : null;
    }
  }
  return null;
}

function startTlDrag(e, entry, bar, personRow) {
  if (e.button !== 0) return;
  e.preventDefault();
  const sc = document.getElementById('tlScroll');
  const startX = e.clientX;
  const startScrollLeft = sc.scrollLeft;
  let moved = false;
  let lastHighlightRow = null;

  function onMove(ev) {
    const dx = ev.clientX - startX;
    if (!moved && Math.abs(dx) < 4) return;
    moved = true;
    bar.classList.add('dragging');

    // Horizontal shift
    const totalDx = dx + (sc.scrollLeft - startScrollLeft);
    const colShift = Math.round(totalDx / tlColW);
    const origStartCol = nearestCol(entry.date, true);
    const origEndCol   = nearestCol(entry.endDate || entry.date, false);
    if (origStartCol === null) return;
    const newStartCol = origStartCol + colShift;
    const newEndCol   = (origEndCol !== null ? origEndCol : origStartCol) + colShift;
    const left  = newStartCol * tlColW + 2;
    const width = Math.max(TL_BAR_H, (newEndCol - newStartCol + 1) * tlColW - 4);
    bar.style.left  = left + 'px';
    bar.style.width = width + 'px';

    // Vertical — highlight target person row
    const targetPerson = getPersonRowAtY(ev.clientY);
    if (lastHighlightRow) lastHighlightRow.classList.remove('drop-target');
    if (targetPerson && targetPerson !== entry.person && targetPerson !== STUDIO_ROW) {
      const rows = document.querySelectorAll('.tl-person-row');
      for (const r of rows) {
        const nm = r.querySelector('.tl-row-name-text');
        if (nm && nm.textContent === targetPerson) { r.classList.add('drop-target'); lastHighlightRow = r; break; }
      }
    }
  }

  function onUp(ev) {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    bar.classList.remove('dragging');
    if (lastHighlightRow) lastHighlightRow.classList.remove('drop-target');
    if (!moved) return;

    const dx = ev.clientX - startX;
    const totalDx = dx + (sc.scrollLeft - startScrollLeft);
    const colShift = Math.round(totalDx / tlColW);
    const found = findTask(entry.projectId, entry.taskId);
    if (!found) return;
    const { task } = found;

    // Apply date shift
    if (colShift !== 0) {
      const startD = new Date(task.date + 'T00:00:00');
      const newStart = new Date(startD);
      // Walk column-by-column to account for hidden weekends
      let remaining = Math.abs(colShift);
      const dir = colShift > 0 ? 1 : -1;
      while (remaining > 0) {
        newStart.setDate(newStart.getDate() + dir);
        if (!showWeekends && (newStart.getDay() === 0 || newStart.getDay() === 6)) continue;
        remaining--;
      }
      const newStartStr = fmtDate(newStart.getFullYear(), newStart.getMonth() + 1, newStart.getDate());
      if (task.endDate && task.endDate !== task.date) {
        const durMs = new Date(task.endDate + 'T00:00:00') - new Date(task.date + 'T00:00:00');
        const newEndD = new Date(newStart.getTime() + durMs);
        task.endDate = fmtDate(newEndD.getFullYear(), newEndD.getMonth() + 1, newEndD.getDate());
      }
      task.date = newStartStr;
    }

    // Apply person reassignment
    const targetPerson = getPersonRowAtY(ev.clientY);
    if (targetPerson && targetPerson !== entry.person && targetPerson !== STUDIO_ROW) {
      if (entry.attIdx != null) {
        // Reassign the attendee (reviews and role tasks alike)
        const att = (task.attendees || [])[entry.attIdx];
        if (att) att.person = targetPerson;
      } else {
        task.person = targetPerson;
      }
    }

    saveState();
    renderTimeline();
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// ── TIMELINE RESIZE ──
function startTlResize(e, entry, bar, side) {
  if (e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  const sc = document.getElementById('tlScroll');
  const startX = e.clientX;
  const startScrollLeft = sc.scrollLeft;
  const origLeft  = parseFloat(bar.style.left);
  const origWidth = parseFloat(bar.style.width);

  function onMove(ev) {
    const dx = ev.clientX - startX + (sc.scrollLeft - startScrollLeft);
    if (side === 'right') {
      bar.style.width = Math.max(TL_BAR_H, origWidth + dx) + 'px';
    } else {
      const newLeft  = origLeft + dx;
      const newWidth = origWidth - dx;
      if (newWidth >= TL_BAR_H) {
        bar.style.left  = newLeft + 'px';
        bar.style.width = newWidth + 'px';
      }
    }
  }

  function onUp(ev) {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);

    const found = findTask(entry.projectId, entry.taskId);
    if (!found) return;
    const { task } = found;

    const dx = ev.clientX - startX + (sc.scrollLeft - startScrollLeft);
    const colShift = Math.round(dx / tlColW);
    if (colShift === 0) { renderTimeline(); return; }

    if (side === 'right') {
      const endD = new Date((task.endDate || task.date) + 'T00:00:00');
      let remaining = Math.abs(colShift);
      const dir = colShift > 0 ? 1 : -1;
      while (remaining > 0) {
        endD.setDate(endD.getDate() + dir);
        if (!showWeekends && (endD.getDay() === 0 || endD.getDay() === 6)) continue;
        remaining--;
      }
      const newEndStr = fmtDate(endD.getFullYear(), endD.getMonth() + 1, endD.getDate());
      if (newEndStr < task.date) return renderTimeline();
      if (newEndStr === task.date) delete task.endDate;
      else task.endDate = newEndStr;
    } else {
      const startD = new Date(task.date + 'T00:00:00');
      let remaining = Math.abs(colShift);
      const dir = colShift > 0 ? 1 : -1;
      while (remaining > 0) {
        startD.setDate(startD.getDate() + dir);
        if (!showWeekends && (startD.getDay() === 0 || startD.getDay() === 6)) continue;
        remaining--;
      }
      const newStartStr = fmtDate(startD.getFullYear(), startD.getMonth() + 1, startD.getDate());
      const endDate = task.endDate || task.date;
      if (newStartStr > endDate) return renderTimeline();
      task.date = newStartStr;
      if (task.date === task.endDate) delete task.endDate;
    }

    saveState();
    renderTimeline();
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// ── TIMELINE RENDER ──
function renderTimeline() {
  buildTlDates();
  updateZoomButtons();

  const today   = todayStr();
  const numCols = tlDates.length;
  const totalW  = TL_NAME_W + numCols * tlColW;

  const tlInner = document.getElementById('tlInner');
  tlInner.style.width = totalW + 'px';

  // ── Week banding ──
  // Columns are a contiguous date run (weekends optionally filtered out), so a
  // week is always the same number of columns. Shade odd absolute week numbers
  // so the stripes don't jump as the visible range grows.
  const colsPerWeek = showWeekends ? 7 : 5;
  const bandW       = colsPerWeek * tlColW;
  const bandWeek    = ds => {
    const d = new Date(ds + 'T00:00:00');
    const monOff = (d.getDay() + 6) % 7;                       // Mon = 0
    const mon = new Date(d); mon.setDate(mon.getDate() - monOff);
    // Weeks since Mon 1970-01-05; round absorbs DST hour shifts.
    return { week: Math.round((mon - new Date(1970, 0, 5)) / 6048e5), pos: showWeekends ? monOff : Math.min(monOff, 4) };
  };
  if (numCols) {
    const { week, pos } = bandWeek(tlDates[0]);
    // Col 0 sits `pos` columns into its week; the tile's shaded half comes first,
    // so an even (unshaded) starting week gets pushed a further band left.
    const off = -(pos * tlColW) - (week % 2 === 0 ? bandW : 0);
    tlInner.style.setProperty('--tl-band-w', bandW + 'px');
    tlInner.style.setProperty('--tl-band-off', off + 'px');
  }

  // ── Month header row ──
  const monthRow = document.getElementById('tlMonthRow');
  monthRow.innerHTML = '';
  const mNameHd = document.createElement('div');
  mNameHd.className = 'tl-name-hd';
  monthRow.appendChild(mNameHd);

  let curMonth = -1, curYear = -1, curCell = null, curCount = 0;
  tlDates.forEach(ds => {
    const d = new Date(ds + 'T00:00:00');
    const m = d.getMonth(), y = d.getFullYear();
    if (m !== curMonth || y !== curYear) {
      if (curCell) { curCell.style.width = (curCount * tlColW) + 'px'; monthRow.appendChild(curCell); }
      curCell = document.createElement('div');
      curCell.className = 'tl-month-cell';
      curCell.textContent = MONTHS[m].slice(0,3).toUpperCase() + ' ' + y;
      curMonth = m; curYear = y; curCount = 0;
    }
    curCount++;
  });
  if (curCell) { curCell.style.width = (curCount * tlColW) + 'px'; monthRow.appendChild(curCell); }

  // ── Day header row ──
  const dayRow = document.getElementById('tlDayRow');
  dayRow.innerHTML = '';
  const dNameHd = document.createElement('div');
  dNameHd.className = 'tl-name-hd';
  dNameHd.textContent = 'PEOPLE';
  dayRow.appendChild(dNameHd);

  tlDates.forEach(ds => {
    const d   = new Date(ds + 'T00:00:00');
    const dow = d.getDay();
    const cell = document.createElement('div');
    const bw = bandWeek(ds);
    cell.className = 'tl-day-cell'
      + (bw.week % 2 ? ' wk-band' : '')
      + (bw.pos === 0 ? ' wk-start' : '')
      + (ds === today ? ' today' : '')
      + (dow === 0 || dow === 6 ? ' weekend' : '');
    cell.style.width = tlColW + 'px';
    // Show day number; if narrow also show month initial on 1st
    if (tlColW >= 36 && d.getDate() === 1) {
      cell.textContent = MONTHS[d.getMonth()].slice(0,1);
    } else {
      cell.textContent = d.getDate();
    }
    dayRow.appendChild(cell);
  });

  // ── Person rows ──
  const rows = document.getElementById('tlRows');
  rows.innerHTML = '';

  renderTlFilterBar();
  const filtering  = tlLens.size > 0;
  // PTO is deliberately not filtered: see passesLens.
  const allEntries = getOpsEntries().filter(passesLens);
  const ptoAll     = getPtoEntries();
  const studioAll  = getStudioBlockEntries().filter(passesLens);
  // Includes people who only appear on PTO, ordered by the saved row order.
  const people     = getTimelinePeople();
  const personColor = {};
  allEntries.forEach(e => { if (e.person && !personColor[e.person]) personColor[e.person] = e.color; });
  personColor[STUDIO_ROW] = CAT_COLORS['Production'];

  const todayCol = tlDateMap.get(today) ?? null;

  if (!people.length) {
    rows.innerHTML = '<div style="padding:20px;color:var(--dim);font-size:12px">No internal team tasks found.</div>';
    return;
  }
  // A filter that matches nothing must not look like missing data.
  if (filtering && !allEntries.length && !studioAll.length) {
    rows.innerHTML = '<div style="padding:20px;color:var(--dim);font-size:12px">No work matches this filter. Clear it in the bar above, or from the Legend.</div>';
    return;
  }

  people.forEach(person => {
    const entries       = allEntries.filter(e => e.person === person);
    const ptoEntries    = ptoAll.filter(e => e.person === person);
    const studioEntries = studioAll.filter(e => e.person === person);
    // Unfiltered, a PTO-only row is worth showing — it says where somebody is.
    // Filtered, it is noise: "animator work only" should not list every producer
    // with a holiday booked. So while a lens is on, a row has to earn its place
    // with real matching work, and PTO then rides along on the rows that stay.
    if (filtering ? (!entries.length && !studioEntries.length)
                  : (!entries.length && !ptoEntries.length && !studioEntries.length)) return;

    const laned    = assignLanes([...entries, ...ptoEntries, ...studioEntries]);
    const numLanes = Math.max(...laned.map(e => e.lane)) + 1;
    const trackH   = TL_PAD * 2 + numLanes * TL_LANE_H;

    const row = document.createElement('div');
    row.className = 'tl-person-row' + (hiddenPeople.has(person) ? ' dimmed' : '');

    const nameCell = document.createElement('div');
    nameCell.className = 'tl-row-name';
    nameCell.style.height = trackH + 'px';
    const dot = document.createElement('span');
    dot.className = 'tl-row-dot';
    dot.style.background = personColor[person] || '#6c63ff';
    nameCell.appendChild(dot);
    const nameText = document.createElement('span');
    nameText.className = 'tl-row-name-text';
    nameText.textContent = person;
    nameCell.appendChild(nameText);

    // Reorder buttons
    const reorder = document.createElement('div');
    reorder.className = 'tl-reorder';
    const btnUp = document.createElement('button');
    btnUp.className = 'tl-reorder-btn';
    btnUp.textContent = '▲';
    btnUp.title = 'Move up';
    btnUp.addEventListener('click', e => { e.stopPropagation(); movePerson(person, -1); });
    const btnDn = document.createElement('button');
    btnDn.className = 'tl-reorder-btn';
    btnDn.textContent = '▼';
    btnDn.title = 'Move down';
    btnDn.addEventListener('click', e => { e.stopPropagation(); movePerson(person, 1); });
    reorder.appendChild(btnUp);
    reorder.appendChild(btnDn);
    nameCell.appendChild(reorder);
    row.appendChild(nameCell);

    const track = document.createElement('div');
    track.className = 'tl-track';
    track.style.height = trackH + 'px';

    // Today column highlight
    if (todayCol !== null) {
      const todayEl = document.createElement('div');
      todayEl.className = 'tl-today-col';
      todayEl.style.left  = (todayCol * tlColW) + 'px';
      todayEl.style.width = tlColW + 'px';
      track.appendChild(todayEl);
    }

    laned.forEach(entry => {
      const entryEnd = entry.endDate || entry.date;
      const visStart = entry.date < tlStart ? tlStart : entry.date;
      const visEnd   = entryEnd   > tlEnd   ? tlEnd   : entryEnd;
      if (visEnd < visStart) return;

      const startCol = nearestCol(visStart, true);
      const endCol   = nearestCol(visEnd,   false);
      if (startCol === null || endCol === null || endCol < startCol) return;

      const left  = startCol * tlColW + 2;
      const width = Math.max(TL_BAR_H, (endCol - startCol + 1) * tlColW - 4);
      const top   = TL_PAD + entry.lane * TL_LANE_H;

      // PTO renders as a read-only chip (no drag/resize/reassign, no LoE dot).
      if (entry.isPTO) {
        const pto = document.createElement('div');
        pto.className = 'tl-task-bar tl-pto-bar';
        pto.style.cssText = `left:${left}px;width:${width}px;top:${top}px;height:${TL_BAR_H}px;z-index:2;`;
        pto.title = `${entry.person} · PTO\n${entry.date}${entry.endDate && entry.endDate !== entry.date ? ' → ' + entry.endDate : ''} (${entry.projectName})`;
        const pInner = document.createElement('div');
        pInner.className = 'tl-bar-inner';
        pInner.style.pointerEvents = 'none';
        const pLbl = document.createElement('span');
        pLbl.className = 'tl-bar-name';
        pLbl.textContent = '🏖 PTO';
        pInner.appendChild(pLbl);
        pto.appendChild(pInner);
        track.appendChild(pto);
        return;
      }

      // Studio blocks are a room booking, not somebody's task: read-only here
      // (no drag/resize/reassign — there is no person to reassign them to).
      if (entry.isStudioBlock) {
        const sb = document.createElement('div');
        sb.className = 'tl-task-bar tl-studio-bar';
        sb.style.cssText = `left:${left}px;width:${width}px;top:${top}px;height:${TL_BAR_H}px;background:${entry.color};z-index:2;`;
        sb.title = `Studio · ${entry.taskName}
${entry.date}${entry.endDate && entry.endDate !== entry.date ? ' → ' + entry.endDate : ''} (${entry.projectName})`;
        const sInner = document.createElement('div');
        sInner.className = 'tl-bar-inner';
        sInner.style.pointerEvents = 'none';
        const sLbl = document.createElement('span');
        sLbl.className = 'tl-bar-name';
        sLbl.textContent = '🎬 ' + entry.taskName;
        sInner.appendChild(sLbl);
        sb.appendChild(sInner);
        track.appendChild(sb);
        return;
      }

      const bar = document.createElement('div');
      bar.className = 'tl-task-bar';
      bar.style.cssText = `left:${left}px;width:${width}px;top:${top}px;height:${TL_BAR_H}px;background:${entry.color};z-index:2;`;
      bar.title = `${entry.person} · ${entry.cat} · ${entry.taskName}\n${entry.date}${entry.endDate && entry.endDate !== entry.date ? ' → ' + entry.endDate : ''} (${entry.projectName})`;
      bar.dataset.projectId = entry.projectId;
      bar.dataset.taskId    = entry.taskId;
      if (entry.isReview) bar.dataset.attIdx = entry.attIdx;

      // Resize handles (for multi-day tasks)
      const isMulti = entry.endDate && entry.endDate !== entry.date;
      if (isMulti) {
        const lh = document.createElement('div');
        lh.className = 'tl-resize-handle left';
        lh.addEventListener('mousedown', e => startTlResize(e, entry, bar, 'left'));
        bar.appendChild(lh);
      }
      const rh = document.createElement('div');
      rh.className = 'tl-resize-handle right';
      rh.addEventListener('mousedown', e => startTlResize(e, entry, bar, 'right'));
      bar.appendChild(rh);

      // Drag to move / reassign
      bar.addEventListener('mousedown', e => {
        if (e.target.classList.contains('tl-resize-handle')) return;
        startTlDrag(e, entry, bar, row);
      });

      const inner = document.createElement('div');
      inner.className = 'tl-bar-inner';
      inner.style.pointerEvents = 'none';

      if (chipDisplay === 'categories') {
        const catSp = document.createElement('span');
        catSp.className = 'tl-bar-cat';
        // Same abbreviation the calendar chips use — the toggle promises a
        // "category abbreviation", and the full name is already in the tooltip.
        catSp.textContent = SHORT_CAT[entry.cat] || entry.cat;
        inner.appendChild(catSp);
      } else {
        const nameSp = document.createElement('span');
        nameSp.className = 'tl-bar-name';
        nameSp.textContent = entry.taskName;
        inner.appendChild(nameSp);
      }

      const loeSp = document.createElement('span');
      loeSp.className = 'tl-bar-loe';
      loeSp.textContent = entry.loe === 'low' ? '🟢' : entry.loe === 'high' ? '🔴' : '🟡';
      inner.appendChild(loeSp);

      bar.appendChild(inner);
      track.appendChild(bar);
    });

    row.appendChild(track);
    rows.appendChild(row);
  });
}

function scrollTlToToday() {
  const sc = document.getElementById('tlScroll');
  if (!sc) return;
  buildTlDates();
  const col = tlDateMap.get(todayStr()) ?? 0;
  sc.scrollLeft = Math.max(0, TL_NAME_W + col * tlColW - Math.round((sc.clientWidth - TL_NAME_W) / 2));
}

function extendTimeline(direction) {
  const sc     = document.getElementById('tlScroll');
  const prevSL = sc.scrollLeft;
  const prevSW = sc.scrollWidth;

  if (direction === 'right') {
    const d = new Date(tlEnd + 'T00:00:00');
    d.setDate(d.getDate() + TL_WEEKS_EXT * 7);
    tlEnd = fmtDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
  } else {
    const d = new Date(tlStart + 'T00:00:00');
    d.setDate(d.getDate() - TL_WEEKS_EXT * 7);
    tlStart = fmtDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }
  renderTimeline();
  if (direction === 'left') sc.scrollLeft = prevSL + (sc.scrollWidth - prevSW);
}

function setupTlObserver() {
  if (tlObserver) { tlObserver.disconnect(); tlObserver = null; }
  const sc = document.getElementById('tlScroll');
  tlObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      if (e.target.id === 'tlSentinelL') extendTimeline('left');
      if (e.target.id === 'tlSentinelR') extendTimeline('right');
    });
  }, { root: sc, rootMargin: '0px 600px', threshold: 0 });
  tlObserver.observe(document.getElementById('tlSentinelL'));
  tlObserver.observe(document.getElementById('tlSentinelR'));
}

// ── VIEW SWITCHER ──
function applyViewMode() {
  const calScroll   = document.getElementById('calScroll');
  const personView  = document.getElementById('personView');
  const headsupView = document.getElementById('headsupView');
  const studioView  = document.getElementById('studioView');
  const metricsView = document.getElementById('metricsView');
  const standupView = document.getElementById('standupView');
  const calNav      = document.querySelector('.cal-nav');
  const calDow      = document.getElementById('calDowRow');

  // Show/hide controls based on view mode
  const chipToggle = document.getElementById('chipDisplayToggle');
  const zoomGroup = document.querySelector('.ops-zoom');
  const wkndBtn = document.getElementById('wkndBtn');
  const isTimeline = viewMode === 'person';
  const isStudio = viewMode === 'studio';
  const legendWrap = document.getElementById('legendWrap');
  chipToggle.style.display = isTimeline ? '' : 'none';
  zoomGroup.style.display = isTimeline ? '' : 'none';
  wkndBtn.style.display = (isTimeline || isStudio) ? '' : 'none';
  if (legendWrap) legendWrap.style.display = isTimeline ? '' : 'none';
  // The filter itself persists across views — only the popover closes, so
  // coming back to the Gantt finds it exactly as you left it.
  if (!isTimeline) toggleLegendPop(false);

  // Standup uses the .visible class for display; clear it on every switch and
  // let the standup branch below re-add it, so we don't have to touch each view.
  standupView.classList.remove('visible');

  if (viewMode === 'headsup') {
    if (tlObserver) { tlObserver.disconnect(); tlObserver = null; }
    calScroll.style.display = 'none';
    calNav.style.display    = 'none';
    calDow.style.display    = 'none';
    personView.classList.remove('visible');
    studioView.classList.remove('visible');
    metricsView.classList.remove('visible');
    headsupView.classList.add('visible');
    renderHeadsUp();
  } else if (viewMode === 'person') {
    calScroll.style.display = 'none';
    calNav.style.display    = 'none';
    calDow.style.display    = 'none';
    headsupView.classList.remove('visible');
    studioView.classList.remove('visible');
    metricsView.classList.remove('visible');
    personView.classList.add('visible');
    if (!tlStart) resetTlRange();
    renderTimeline();
    setTimeout(() => { scrollTlToToday(); setupTlObserver(); }, 30);
  } else if (viewMode === 'studio') {
    if (tlObserver) { tlObserver.disconnect(); tlObserver = null; }
    personView.classList.remove('visible');
    headsupView.classList.remove('visible');
    metricsView.classList.remove('visible');
    studioView.classList.add('visible');
    calScroll.style.display = '';
    calNav.style.display    = '';
    calDow.style.display    = '';
    renderStudio();
    setupCalObserver();
    scrollToToday();
  } else if (viewMode === 'metrics') {
    if (tlObserver) { tlObserver.disconnect(); tlObserver = null; }
    calScroll.style.display = 'none';
    calNav.style.display    = 'none';
    calDow.style.display    = 'none';
    personView.classList.remove('visible');
    headsupView.classList.remove('visible');
    studioView.classList.remove('visible');
    metricsView.classList.add('visible');
    renderMetrics();
  } else if (viewMode === 'standup') {
    if (tlObserver) { tlObserver.disconnect(); tlObserver = null; }
    calScroll.style.display = 'none';
    calNav.style.display    = 'none';
    calDow.style.display    = 'none';
    personView.classList.remove('visible');
    headsupView.classList.remove('visible');
    studioView.classList.remove('visible');
    metricsView.classList.remove('visible');
    standupView.classList.add('visible');
    renderStandup();
  }
}

// ── UTILITY HELPERS ──
function fmtDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function getNextBusinessDays(startDate, count) {
  const days = [];
  let cursor = addDays(startDate, 1);
  while (days.length < count) {
    const day = new Date(cursor + 'T00:00:00').getDay();
    if (day !== 0 && day !== 6) days.push(cursor);
    cursor = addDays(cursor, 1);
  }
  return days;
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ── STANDUP VIEW ──
// Per-person standup: pick a video-team member, see their active projects and
// each project's notes, and drop a fresh note in the moment. Notes written here
// are ordinary project notes (same shape team.html's addNote writes) so they
// also surface in team.html's feed and the ops Metrics retrospective.

// Types for the add-note picker — mirrors team.html NOTE_TYPES minus the
// auto-only 'system' type. emoji is denormalized onto each note at creation so
// other views render it without a lookup.
const STANDUP_NOTE_TYPES = [
  { key: 'update',    label: 'Project Update',       emoji: '📋' },
  { key: 'delay',     label: 'Project Delay',        emoji: '⏳' },
  { key: 'direction', label: 'Change in Direction',  emoji: '🔀' },
  { key: 'feedback',  label: 'Stakeholder Feedback', emoji: '💬' },
  { key: 'blocker',   label: 'Blocker',              emoji: '🚧' },
  { key: 'decision',  label: 'Decision Made',        emoji: '✅' },
  { key: 'team',      label: 'Team Change',          emoji: '👥' }
];
let standupPerson = (() => { try { return localStorage.getItem('ops_standup_person') || null; } catch (_) { return null; } })();

// ops.html has no genId of its own; mirror team.html's.
function genId() {
  try { return crypto.randomUUID(); }
  catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
}

// Projects the standup cares about: active, real (non-ghost) work, minus the
// PTO/holiday/admin buckets. (This panel had its own copy of the non-work test
// before isNonWorkProject existed — it now shares the one every review surface
// uses, so the standup and Project Health can't disagree about what a project
// is.)
function standupActiveProjects() {
  return reviewableProjects();
}

// Standup is a producer conversation: a person only shows the projects they
// LEAD. getPrimaryProducer is the same call the card's "Lead: …" line uses, so
// the rail and the cards can never disagree.
function standupLeadProjects(person) {
  if (!person) return [];
  return standupActiveProjects().filter(p => getPrimaryProducer(p) === person);
}

// The left rail: everyone who leads at least one active project. Ordered by
// getAllPeople() so the rail keeps the timeline's person order and its
// sunset/non-internal filtering.
function standupLeads() {
  const leads = new Set();
  standupActiveProjects().forEach(p => {
    const lead = getPrimaryProducer(p);
    if (lead) leads.add(lead);
  });
  return getAllPeople().filter(p => leads.has(p));
}

// Add a note to a project from the standup tab. Author is the configurable "me"
// identity (shared dash_me key). Note shape matches team.html addNote exactly,
// then saveState() persists it to Firebase for every other view.
function addStandupNote(projectId, type, body) {
  body = (body || '').trim();
  if (!body) return;
  const proj = (state.projects || []).find(p => p.id === projectId);
  if (!proj) return;
  const me = (localStorage.getItem('dash_me') || '').trim();
  if (!me) {
    const el = document.getElementById('suMeInput');
    if (el) { el.focus(); el.style.borderColor = 'var(--danger)'; }
    return;
  }
  if (!proj.notes) proj.notes = [];
  const nt = STANDUP_NOTE_TYPES.find(t => t.key === type) || STANDUP_NOTE_TYPES[0];
  const now = new Date();
  proj.notes.push({
    id: genId(),
    type: nt.key,
    emoji: nt.emoji,
    body: body,
    person: me,
    date: fmtDate(now.getFullYear(), now.getMonth() + 1, now.getDate()),
    time: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0')
  });
  saveState();
  renderStandup();
}

function renderStandup() {
  const view = document.getElementById('standupView');
  if (!view) return;
  view.innerHTML = '';

  const people = standupLeads();
  if (standupPerson && !people.includes(standupPerson)) standupPerson = null;
  if (!standupPerson && people.length) standupPerson = people[0];

  // Header: title + configurable "You" identity (author for notes added here).
  const head = document.createElement('div');
  head.className = 'su-head';
  const h2 = document.createElement('h2');
  h2.textContent = 'Standup';
  head.appendChild(h2);
  const meWrap = document.createElement('div');
  meWrap.className = 'su-me';
  const meLbl = document.createElement('label');
  meLbl.textContent = 'You';
  const meInput = document.createElement('input');
  meInput.id = 'suMeInput';
  meInput.type = 'text';
  meInput.placeholder = 'Your name';
  meInput.autocomplete = 'off';
  meInput.value = localStorage.getItem('dash_me') || '';
  meInput.title = 'Notes you add are attributed to this name';
  meInput.addEventListener('input', () => {
    try { localStorage.setItem('dash_me', meInput.value.trim()); } catch (_) {}
    meInput.style.borderColor = '';
  });
  meWrap.appendChild(meLbl);
  meWrap.appendChild(meInput);
  head.appendChild(meWrap);
  view.appendChild(head);

  const bodyWrap = document.createElement('div');
  bodyWrap.className = 'su-body';

  // Left: clickable people list.
  const list = document.createElement('div');
  list.className = 'su-people';
  if (!people.length) {
    const em = document.createElement('div');
    em.className = 'su-empty';
    em.style.padding = '16px';
    em.textContent = 'No lead producers found.';
    list.appendChild(em);
  } else {
    people.forEach(person => {
      const row = document.createElement('div');
      row.className = 'su-name' + (person === standupPerson ? ' active' : '');
      row.textContent = person;
      row.addEventListener('click', () => {
        standupPerson = person;
        try { localStorage.setItem('ops_standup_person', person); } catch (_) {}
        renderStandup();
      });
      list.appendChild(row);
    });
  }
  bodyWrap.appendChild(list);

  // Right: selected person's active projects, each with notes + add box.
  const detail = document.createElement('div');
  detail.className = 'su-detail';
  const projects = standupPerson ? standupLeadProjects(standupPerson) : [];
  if (!standupPerson) {
    const em = document.createElement('div'); em.className = 'su-empty';
    em.textContent = 'Select a lead producer to see their projects.';
    detail.appendChild(em);
  } else if (!projects.length) {
    const em = document.createElement('div'); em.className = 'su-empty';
    em.textContent = standupPerson + ' leads no active projects.';
    detail.appendChild(em);
  } else {
    projects.forEach(proj => detail.appendChild(buildStandupProjectCard(proj)));
  }
  bodyWrap.appendChild(detail);
  view.appendChild(bodyWrap);
}

function buildStandupProjectCard(proj) {
  const card = document.createElement('div');
  card.className = 'su-proj-card';

  const title = document.createElement('div');
  title.className = 'su-proj-title';
  title.textContent = proj.name || '(untitled project)';
  card.appendChild(title);

  const producer = getPrimaryProducer(proj);
  if (producer) {
    const sub = document.createElement('div');
    sub.className = 'su-proj-sub';
    sub.textContent = 'Lead: ' + producer;
    card.appendChild(sub);
  }

  // Notes, newest first (date+time descending). Only the latest one shows;
  // the rest hide behind a caret so long-running projects stay scannable.
  const notesWrap = document.createElement('div');
  notesWrap.className = 'su-notes';
  const notes = [...(proj.notes || [])]
    .filter(n => n && n.date)
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));

  const buildNoteRow = n => {
    const row = document.createElement('div');
    row.className = 'su-note';
    const emoji = document.createElement('span');
    emoji.className = 'su-note-emoji';
    emoji.textContent = n.emoji || '📋';
    const bodyCol = document.createElement('div');
    const b = document.createElement('div');
    b.className = 'su-note-body';
    b.textContent = n.body || '';
    const meta = document.createElement('div');
    meta.className = 'su-note-meta';
    meta.textContent = (n.person || 'Team') + ' · ' + n.date + (n.time ? ' ' + n.time : '');
    bodyCol.appendChild(b);
    bodyCol.appendChild(meta);
    row.appendChild(emoji);
    row.appendChild(bodyCol);
    return row;
  };

  if (!notes.length) {
    const em = document.createElement('div');
    em.className = 'su-note-empty';
    em.textContent = 'No notes yet.';
    notesWrap.appendChild(em);
  } else {
    notesWrap.appendChild(buildNoteRow(notes[0]));
    const older = notes.slice(1);
    if (older.length) {
      const olderWrap = document.createElement('div');
      olderWrap.className = 'su-notes-older';
      olderWrap.style.display = 'none';
      older.forEach(n => olderWrap.appendChild(buildNoteRow(n)));

      const toggle = document.createElement('div');
      toggle.className = 'su-more';
      toggle.setAttribute('role', 'button');
      toggle.tabIndex = 0;
      toggle.setAttribute('aria-expanded', 'false');
      const caret = document.createElement('span');
      caret.className = 'su-more-caret';
      caret.textContent = '▸';
      const lbl = document.createElement('span');
      lbl.textContent = older.length === 1 ? '1 earlier note' : older.length + ' earlier notes';
      toggle.appendChild(caret);
      toggle.appendChild(lbl);

      let expanded = false;
      const flip = () => {
        expanded = !expanded;
        olderWrap.style.display = expanded ? '' : 'none';
        caret.textContent = expanded ? '▾' : '▸';
        toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      };
      toggle.addEventListener('click', flip);
      toggle.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
      });

      notesWrap.appendChild(toggle);
      notesWrap.appendChild(olderWrap);
    }
  }
  card.appendChild(notesWrap);

  // Add-note row: type picker + text + Add.
  const addRow = document.createElement('div');
  addRow.className = 'su-add-row';
  const sel = document.createElement('select');
  STANDUP_NOTE_TYPES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.key;
    opt.textContent = t.emoji + ' ' + t.label;
    sel.appendChild(opt);
  });
  sel.value = 'update';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Add a note…';
  input.autocomplete = 'off';
  const btn = document.createElement('button');
  btn.className = 'su-add-btn';
  btn.textContent = 'Add';
  const submit = () => addStandupNote(proj.id, sel.value, input.value);
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  addRow.appendChild(sel);
  addRow.appendChild(input);
  addRow.appendChild(btn);
  card.appendChild(addRow);

  return card;
}

// ── HEADS UP VIEW ──
// Returns the primary producer name for a project. An explicitly set lead
// producer always wins — it is the field the user actually curates (team.html's
// drag box, ticket import). Only when none is set do we fall back to the
// heuristic below, because a handoff leaves the outgoing producer with every
// historical task plus a roster entry, so the heuristic would name them forever.
function getPrimaryProducer(proj) {
  if (!proj) return null;
  if (proj.leadProducer) return proj.leadProducer;
  const counts = {};
  (proj.tasks || []).forEach(t => {
    if (t.role === 'Producer' && t.person) counts[t.person] = (counts[t.person] || 0) + 1;
  });
  ((proj.roster || {})['Producer'] || []).forEach(name => {
    counts[name] = (counts[name] || 0) + 100;
  });
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  return top ? top[0] : null;
}

function getTeamHeadsUp() {
  const items = [];
  const today = todayStr();
  const bizDays = getNextBusinessDays(today, 5);
  const cutoff = bizDays[bizDays.length - 1];

  const INTERNAL_ROLES = new Set(['Producer', 'Editor', 'Animator']);

  // Build a map of all internal people and their projects
  const peopleProjects = new Map(); // person -> Set of projectIds
  (state.projects || []).filter(p => !isInactive(p) && !p.ghost).forEach(proj => {
    const roster = proj.roster || {};
    for (const [role, names] of Object.entries(roster)) {
      if (!INTERNAL_ROLES.has(role)) continue;
      (names || []).forEach(name => {
        if (isSunset(name)) return;
        if (!peopleProjects.has(name)) peopleProjects.set(name, new Set());
        peopleProjects.get(name).add(proj.id);
      });
    }
    (proj.tasks || []).forEach(t => {
      if (t.person && !isSunset(t.person) && INTERNAL_ROLES.has(t.role)) {
        if (!peopleProjects.has(t.person)) peopleProjects.set(t.person, new Set());
        peopleProjects.get(t.person).add(proj.id);
      }
    });
  });

  (state.projects || []).filter(p => !isInactive(p) && !p.ghost).forEach(proj => {
    const producer = getPrimaryProducer(proj);
    const withProducer = (label) => producer ? (producer + ' - ' + label) : label;

    (proj.tasks || []).forEach(task => {
      const start = task.date;
      const end = task.endDate || task.date;
      if (!start || end < today || start > cutoff) return;

      // Reviews & shoots
      if (task.isReview) {
        const isShoot = (task.reviewLabel || '').includes('Shoot');
        const attendeeNames = (task.attendees || []).filter(a => a.person).map(a => a.person);
        const baseTitle = task.taskName || task.reviewLabel || 'Review';
        items.push({
          type: isShoot ? 'shoot' : 'review',
          icon: isShoot ? '🎬' : '📋',
          title: withProducer(baseTitle),
          project: proj.name,
          projectId: proj.id,
          date: start,
          endDate: end !== start ? end : null,
          people: attendeeNames,
          taskId: task.id
        });
      }

      // Milestones with action keywords
      if (task.isDueDate && !isTimeOffTask(task)) {
        const tn = (task.taskName || '').toLowerCase();
        const actionKW = ['kick-off','kick off','kickoff','delivery','deliverable','deliver','handoff','hand-off','hand off','launch','go live','go-live','golive','final','finalize','lock','approval','sign-off','sign off','signoff','presentation','present','pitch','onboard','on-board','onboarding','start','begins','begin','deadline'];
        if (actionKW.some(kw => tn.includes(kw))) {
          items.push({
            type: 'milestone',
            icon: '🎯',
            title: withProducer(task.taskName || 'Milestone'),
            project: proj.name,
            projectId: proj.id,
            date: start,
            endDate: end !== start ? end : null,
            people: [],
            taskId: task.id
          });
        }
      }

      // PTO and holidays — both mean the person is not working
      if (isTimeOffTask(task)) {
        (task.attendees || []).forEach(a => {
          if (!a.person || isSunset(a.person)) return;
          // Find which projects this person is on
          const theirProjects = peopleProjects.get(a.person);
          if (!theirProjects || !theirProjects.size) return;

          // Calculate their workload before PTO
          let totalPts = 0;
          (state.projects || []).filter(p => theirProjects.has(p.id) && !isInactive(p) && !p.ghost).forEach(p => {
            (p.tasks || []).forEach(t => {
              if (t.isDueDate || t.person !== a.person) return;
              const tEnd = t.endDate || t.date;
              if (t.date <= cutoff && tEnd >= today) totalPts += loePts(t.loe);
            });
          });

          const role = a.role || '';
          items.push({
            type: 'pto',
            icon: '🏖',
            title: a.person + ' — PTO',
            project: proj.name,
            projectId: proj.id,
            date: start,
            endDate: end !== start ? end : null,
            people: [a.person],
            teammateName: a.person,
            teammateRole: role,
            workloadPts: totalPts
          });
        });
      }
    });
  });

  // Deduplicate
  const seen = new Set();
  const deduped = items.filter(item => {
    const key = item.type + '|' + item.title + '|' + item.date;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  // Consolidate already-started PTO into a single "Currently Out" card
  const startedPto = deduped.filter(i => i.type === 'pto' && i.date <= today);
  const other = deduped.filter(i => !(i.type === 'pto' && i.date <= today));
  if (startedPto.length) {
    const byPerson = new Map();
    startedPto.forEach(i => {
      const name = i.teammateName || i.title.replace(/ — PTO$/, '');
      if (!byPerson.has(name)) byPerson.set(name, { name, endDate: i.endDate || i.date });
      else {
        const existing = byPerson.get(name);
        const end = i.endDate || i.date;
        if (end > existing.endDate) existing.endDate = end;
      }
    });
    const people = [...byPerson.values()].sort((a, b) => a.name.localeCompare(b.name));
    other.push({
      type: 'pto',
      icon: '🏖',
      title: 'Currently Out (' + people.length + ')',
      project: '',
      projectId: null,
      date: today,
      endDate: null,
      consolidated: true,
      outPeople: people,
      people: people.map(p => p.name)
    });
  }

  // Sort: shoots first, then reviews, then milestones, then PTO. Within each, by date.
  const typePriority = { shoot: 0, review: 1, milestone: 2, pto: 3 };
  return other.sort((a, b) => {
    const pa = typePriority[a.type] ?? 9;
    const pb = typePriority[b.type] ?? 9;
    if (pa !== pb) return pa - pb;
    return a.date.localeCompare(b.date);
  });
}

function getOpsHeadsUpPrompt(item) {
  const today = todayStr();

  if (item.type === 'pto') {
    if (item.consolidated) return null;

    const name = item.teammateName;
    const role = (item.teammateRole || '').toLowerCase();
    const heavy = item.workloadPts >= 4;

    if (role === 'producer') {
      const start = new Date(item.date + 'T00:00:00');
      const end = new Date((item.endDate || item.date) + 'T00:00:00');
      const days = Math.round((end - start) / 86400000) + 1;
      if (days > 3) return { text: `${name}'s out ${days} days — coverage doc + backup lined up?`, tasks: [] };
      if (days === 3) return { text: `${name}'s out 3 days — does this need a coverage doc?`, tasks: [] };
      return { text: `Anyone covering for ${name}?`, tasks: [] };
    }
    if (role === 'stakeholder' || role === 'designer' || role === 'copywriter') {
      return { text: `Got sign-off from ${name} before PTO?`, tasks: [] };
    }
    if (role === 'editor' || role === 'animator') {
      if (heavy) return { text: `${name}'s got ${item.workloadPts} pts before PTO — work on track?`, tasks: [] };
      return { text: `${name}'s work on track before PTO?`, tasks: [] };
    }
    if (heavy) return { text: `${name}'s got ${item.workloadPts} pts before PTO — handed off?`, tasks: [] };
    return { text: `${name} handed off their tasks?`, tasks: [] };
  }

  if (item.type === 'review' || item.type === 'shoot' || item.type === 'milestone') {
    const proj = (state.projects || []).find(p => p.id === item.projectId);
    if (!proj) return { text: 'Everything ready?', tasks: [] };
    const eventName = (item.title || '').toLowerCase();

    const leadingTasks = (proj.tasks || []).filter(t => {
      if (t.isDueDate || t.isReview) return false;
      const end = t.endDate || t.date;
      return end >= today && t.date < item.date;
    });

    const stopWords = new Set(['the','and','for','with','this','that','from','into','kick','off','final','date','due']);
    const eventWords = eventName.split(/[\s·\-—:,]+/).filter(w => w.length > 2 && !stopWords.has(w)).map(w => w.toLowerCase());
    const matched = leadingTasks.filter(t => {
      const tn = (t.taskName || '').toLowerCase();
      return eventWords.some(w => tn.includes(w));
    });

    if (matched.length === 1) return { text: `Will "${opsTaskTitle(matched[0])}" be ready in time?`, tasks: leadingTasks };
    if (matched.length > 1) return { text: `${matched.length} related tasks need to land — all on track?`, tasks: leadingTasks };
    if (leadingTasks.length) return { text: `${leadingTasks.length} task${leadingTasks.length > 1 ? 's' : ''} due before this — all on track?`, tasks: leadingTasks };
    if (item.type === 'shoot') return { text: 'Shoot prepped?', tasks: [] };
    if (item.type === 'milestone') return { text: 'Everything ready for this?', tasks: [] };
    return { text: 'Review ready?', tasks: [] };
  }

  return null;
}

// ── CUSTOMIZABLE PANEL SYSTEM (Ops Dashboard + Metrics views) ──
// Each dashboard section is a registered "panel". Users can drag to
// reorder, hide, and re-add panels; layout persists per-browser in
// localStorage. New panels added to a registry appear automatically.
// ══════════════════════════════════════════════════════════════════
const DASH_PANELS = [

  { id: 'reviews',       label: 'Upcoming Reviews',           render: () => renderHuGroup('review', 'Upcoming Reviews') },

  { id: 'deliveries',    label: 'Deliveries & Deadlines',     render: renderDeliveriesPanel,    defaultHidden: true },
];
const METRICS_PANELS = [
  { id: 'snapshot',     label: 'Snapshot',              render: renderMetricsTiles },
  { id: 'teamWorkload', label: 'Team Workload',         render: renderTeamWorkloadPanel },
  { id: 'categoryMix',  label: 'Category Mix',          render: renderCategoryMix },

  { id: 'effortNext',   label: 'Effort · Next 21 Days', render: () => renderEffortChart('next', 15) },
  { id: 'projectGantt', label: 'Project Timeline',      render: renderProjectGantt },
  { id: 'health',       label: 'Project Health',        render: renderProjectHealth },
  { id: 'projRetro',    label: 'Project Retrospective', render: renderProjectMetricsPanel },
];
const PANEL_VIEWS = {
  dash:    { key: 'ops_dash_layout',    el: 'headsupView', panels: () => DASH_PANELS },
  metrics: { key: 'ops_metrics_layout', el: 'metricsView', panels: () => METRICS_PANELS },
};
let _panelDrag = null;

function getLayout(view) {
  const def = PANEL_VIEWS[view];
  const panels = def.panels();
  const all = panels.map(p => p.id);
  const raw = localStorage.getItem(def.key);
  let saved = null;
  try { saved = raw ? JSON.parse(raw) : null; } catch (_) { saved = null; }
  const order = saved && Array.isArray(saved.order) ? saved.order.filter(id => all.includes(id)) : [];
  const hidden = new Set(saved && Array.isArray(saved.hidden) ? saved.hidden.filter(id => all.includes(id)) : []);
  // Any registry panel not in the saved order is "new" to this browser (first
  // run, or a freshly shipped panel). Append it, honoring defaultHidden.
  all.forEach(id => {
    if (order.includes(id)) return;
    order.push(id);
    const p = panels.find(x => x.id === id);
    if (p && p.defaultHidden) hidden.add(id);
  });
  return { order, hidden };
}
function saveLayout(view, layout) {
  localStorage.setItem(PANEL_VIEWS[view].key, JSON.stringify({ order: layout.order, hidden: [...layout.hidden] }));
}
function panelDef(view, id) { return PANEL_VIEWS[view].panels().find(p => p.id === id); }
function rerenderPanelView(view) { view === 'dash' ? renderHeadsUp() : renderMetrics(); }

function movePanel(view, id, dir) {
  const layout = getLayout(view);
  const visible = layout.order.filter(x => !layout.hidden.has(x));
  const target = visible[visible.indexOf(id) + dir];
  if (target === undefined) return;
  const a = layout.order.indexOf(id), b = layout.order.indexOf(target);
  [layout.order[a], layout.order[b]] = [layout.order[b], layout.order[a]];
  saveLayout(view, layout);
  rerenderPanelView(view);
}
function reorderPanel(view, dragId, targetId, placeBelow) {
  if (dragId === targetId) return;
  const layout = getLayout(view);
  const order = layout.order.filter(x => x !== dragId);
  let idx = order.indexOf(targetId);
  if (placeBelow) idx += 1;
  order.splice(idx, 0, dragId);
  layout.order = order;
  saveLayout(view, layout);
  rerenderPanelView(view);
}
function hidePanel(view, id) { const l = getLayout(view); l.hidden.add(id); saveLayout(view, l); rerenderPanelView(view); }
function showPanel(view, id) {
  const l = getLayout(view);
  l.hidden.delete(id);
  // Straight to the top, under the Add Panel button you just pressed. Keeping
  // the slot it was hidden from put it wherever it happened to live before —
  // usually the bottom of a long view, which is nowhere near the control.
  // Drag it back down if you want it somewhere else; that position then sticks.
  l.order = [id, ...l.order.filter(x => x !== id)];
  saveLayout(view, l);
  rerenderPanelView(view);
  flashPanel(id);
}

/* Scroll a freshly shown panel into view and ring it briefly. No-op when the
 * panel rendered nothing — a panel with no data right now isn't in the DOM. */
function flashPanel(id) {
  const el = document.querySelector('[data-panel-id="' + id + '"]');
  if (!el) return;
  // Guarded: this runs after the panel is already shown, so a host without
  // scrollIntoView should lose the scroll, not throw out of the click handler.
  if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  el.classList.add('just-added');
  setTimeout(() => el.classList.add('fading'), 900);
  setTimeout(() => el.classList.remove('just-added', 'fading'), 1400);
}

function mkPanelBtn(txt, title) {
  const b = document.createElement('button');
  b.className = 'op-panel-btn';
  b.textContent = txt;
  b.title = title;
  return b;
}

function wrapPanel(view, def, content, vi, count) {
  const panel = document.createElement('div');
  panel.className = 'op-panel';
  panel.dataset.panelId = def.id;

  const tools = document.createElement('div');
  tools.className = 'op-panel-tools';

  const handle = document.createElement('span');
  handle.className = 'op-panel-handle';
  handle.textContent = '⠿';
  handle.title = 'Drag to reorder';
  handle.draggable = true;
  tools.appendChild(handle);

  const up = mkPanelBtn('▲', 'Move up');
  up.disabled = vi === 0;
  up.addEventListener('click', () => movePanel(view, def.id, -1));
  const down = mkPanelBtn('▼', 'Move down');
  down.disabled = vi === count - 1;
  down.addEventListener('click', () => movePanel(view, def.id, 1));
  const hide = mkPanelBtn('✕', 'Hide panel');
  hide.addEventListener('click', () => hidePanel(view, def.id));
  tools.appendChild(up);
  tools.appendChild(down);
  tools.appendChild(hide);

  panel.appendChild(tools);
  panel.appendChild(content);

  handle.addEventListener('dragstart', e => {
    _panelDrag = { view, id: def.id };
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', def.id); } catch (_) {}
    try { e.dataTransfer.setDragImage(panel, 24, 12); } catch (_) {}
    panel.classList.add('dragging');
  });
  handle.addEventListener('dragend', () => {
    panel.classList.remove('dragging', 'drag-over-above', 'drag-over-below');
    _panelDrag = null;
  });
  panel.addEventListener('dragover', e => {
    if (!_panelDrag || _panelDrag.view !== view || _panelDrag.id === def.id) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const r = panel.getBoundingClientRect();
    const below = (e.clientY - r.top) > r.height / 2;
    panel.classList.toggle('drag-over-below', below);
    panel.classList.toggle('drag-over-above', !below);
  });
  panel.addEventListener('dragleave', e => {
    if (e.target === panel) panel.classList.remove('drag-over-above', 'drag-over-below');
  });
  panel.addEventListener('drop', e => {
    if (!_panelDrag || _panelDrag.view !== view || _panelDrag.id === def.id) return;
    e.preventDefault();
    const below = panel.classList.contains('drag-over-below');
    panel.classList.remove('drag-over-above', 'drag-over-below');
    reorderPanel(view, _panelDrag.id, def.id, below);
  });

  return panel;
}

function renderAddBar(view, layout) {
  const bar = document.createElement('div');
  bar.className = 'op-add-bar';

  const menu = document.createElement('div');
  menu.className = 'op-add-menu';
  menu.style.display = 'none';

  const hiddenIds = PANEL_VIEWS[view].panels().map(p => p.id).filter(id => layout.hidden.has(id));
  if (!hiddenIds.length) {
    const e = document.createElement('div');
    e.className = 'op-add-menu-empty';
    e.textContent = 'All panels are visible';
    menu.appendChild(e);
  } else {
    hiddenIds.forEach(id => {
      const def = panelDef(view, id);
      const item = document.createElement('button');
      item.className = 'op-add-menu-item';
      const plus = document.createElement('span');
      plus.textContent = '＋';
      item.appendChild(plus);
      item.appendChild(document.createTextNode(def.label));
      item.addEventListener('click', () => showPanel(view, id));
      menu.appendChild(item);
    });
  }

  const btn = document.createElement('button');
  btn.className = 'op-add-btn';
  btn.textContent = '＋ Add Panel';
  btn.addEventListener('click', ev => {
    ev.stopPropagation();
    const open = menu.style.display !== 'none';
    document.querySelectorAll('.op-add-menu').forEach(m => { m.style.display = 'none'; });
    menu.style.display = open ? 'none' : 'flex';
  });

  bar.appendChild(btn);
  bar.appendChild(menu);
  return bar;
}
// Close any open add-panel menu on outside click.
document.addEventListener('click', () => {
  document.querySelectorAll('.op-add-menu').forEach(m => { m.style.display = 'none'; });
});

function renderPanelView(view) {
  const container = document.getElementById(PANEL_VIEWS[view].el);
  if (!container) return;
  container.innerHTML = '';
  const layout = getLayout(view);
  container.appendChild(renderAddBar(view, layout));
  const visible = layout.order.filter(id => !layout.hidden.has(id));
  visible.forEach((id, vi) => {
    const def = panelDef(view, id);
    if (!def) return;
    let content = null;
    try { content = def.render(); } catch (err) { console.error('panel render failed:', id, err); }
    if (!content) return; // panel has no data right now → nothing to show
    container.appendChild(wrapPanel(view, def, content, vi, visible.length));
  });
}

const HU_LOE_EMOJI = { low: '🟢', medium: '🟡', high: '🔴' };

function renderHeadsUp() { renderPanelView('dash'); }

function huGroups() {
  const groups = { shoot: [], review: [], milestone: [], pto: [] };
  getTeamHeadsUp().forEach(item => { if (groups[item.type]) groups[item.type].push(item); });
  return groups;
}

function renderHuGroup(type, label) {

      if (promptData) {

          });

          promptDiv.addEventListener('click', () => {
            expanded = !expanded;
            tasksDiv.style.display = expanded ? '' : 'none';
          });

          body.appendChild(promptDiv);
          body.appendChild(tasksDiv);
        } else {
          body.appendChild(promptDiv);
        }
      }

      card.appendChild(body);
      section.appendChild(card);
    });

  return section;
}

// Business days (Mon–Fri) starting from startStr, inclusive.
function opsBizDays(startStr, count) {
  const out = [];
  let cursor = startStr;
  while (out.length < count) {
    const dow = new Date(cursor + 'T00:00:00').getDay();
    if (dow !== 0 && dow !== 6) out.push(cursor);
    cursor = addDays(cursor, 1);
  }
  return out;
}
function opsRelDay(dateStr, today) {
  const n = daysBetweenDates(today, dateStr);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 1 && n <= 7) return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long' });
  if (n < 0) return Math.abs(n) + 'd ago';
  return fmtDateShort(dateStr);
}
function fmtPts(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

function mkOpsSection(titleText) {
  const section = document.createElement('div');
  section.className = 'hu-section';
  const title = document.createElement('div');

}
function mkOpsEmpty(text) {

// A row with a left node and a right-aligned cluster of nodes.
function opsRow(leftNode, rightNodes) {

}
function mkOpsName(text) {
